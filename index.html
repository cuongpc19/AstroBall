<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- iOS "Add to Home Screen" caches index.html in its own web-clip storage and
         keeps pointing at the OLD hashed bundle. These force a revalidate so the
         home-screen app loads the latest deploy like a normal Safari tab does. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>AstroBall</title>
    <link rel="preload" as="font" type="font/ttf" href="fonts/LilitaOne.ttf" crossorigin />
    <style>
      @font-face {
        font-family: "Lilita One";
        src: url("fonts/LilitaOne.ttf") format("truetype");
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* ⚠ The letterbox bars, and they are most of the screen on a desktop frame: the design box
           is 540 wide against a 16:9 page, so the canvas is about a quarter of the width and the
           rest of the page is this colour. It said #eef2f7 with this same comment, which was true
           when the game was pale and false ever since it went violet — two white slabs either side
           of a violet game.

           Dark violet rather than a gradient, because the page cannot know which scene is up:
           Home is flat #312d58 top to bottom while the board runs #2f2c63 to #6a4f9e, so any single
           gradient is wrong on one of them. `setPageBackground` below hands each scene its own. */
        background: #2f2c63;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        /* ⚠ Required by the host's mobile checklist, and worth having anyway: without these a
           long press on a tray raises the text-selection magnifier and the context menu on top
           of the board, over a game whose only input *is* press-and-hold-adjacent. */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        position: absolute;
        inset: 0;
      }
      #game canvas {
        display: block;
        /* ⚠ **Chrome's focus ring, and it is not a decoration we can leave on.** Since M86 the
           default ring is drawn two-tone — a dark inner band and a **white outer band** — precisely
           so it stays visible on any background. Ours is dark violet, so what shows is the white
           half: a hairline down each side of the canvas. Reported from the live CrazyGames desktop
           frame as "vạch trắng hai bên", and it never appeared locally because nothing here takes
           the focus; the host focuses the game frame so its keyboard controls work, and the ring
           comes with it. The give-away was that clicking the page *outside* the game made it
           vanish — a picture the game drew could not do that, a focus ring does nothing else.
           The board is driven entirely by pointer taps and the canvas is not a control anyone
           tabs to, so there is no keyboard affordance being taken away here. */
        outline: none;
      }
      #game canvas:focus,
      #game canvas:focus-visible {
        outline: none;
      }
      /* Pure HTML boot screen — paints in the first frame, before the Phaser
         bundle has downloaded. HomeScene hides it once the game is up. */
      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        /* ⚠ The same violet, or the first frame is a white flash before the scene repaints the
           page. The boot poster is a full-screen div, so it *is* the first thing anyone sees. */
        background: #2f2c63;
        font-family: "Lilita One", Arial, sans-serif;
        z-index: 10;
        transition: opacity 0.3s ease;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot .title {
        font-size: 46px;
        color: #fff;
        -webkit-text-stroke: 3px #2b3550;
        letter-spacing: 2px;
        animation: bootPulse 1s ease-in-out infinite;
      }
      #boot .dots {
        display: flex;
        gap: 10px;
      }
      #boot .dots span {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        animation: bootBounce 0.9s ease-in-out infinite;
      }
      #boot .dots span:nth-child(1) { background: #e32d2d; }
      #boot .dots span:nth-child(2) { background: #f7d117; animation-delay: 0.15s; }
      #boot .dots span:nth-child(3) { background: #2f6fe0; animation-delay: 0.3s; }
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes bootBounce {
        0%, 100% { transform: translateY(0); opacity: 0.5; }
        50% { transform: translateY(-12px); opacity: 1; }
      }
      /* The watchdog's report. Deliberately plain and selectable — its whole job is to be read
         off a screen or copied out of a phone that has no DevTools attached to it. */
      #boot .diag {
        display: none;
        max-width: 92%;
        max-height: 60%;
        overflow: auto;
        font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
        color: #2b3550;
        background: #fff;
        border: 2px solid #2b3550;
        border-radius: 10px;
        padding: 10px 12px;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        -webkit-user-select: text;
      }
    </style>
    <!--
      Boot watchdog.

      ⚠ A **classic** inline script, in ES5, on purpose — three separate reasons, and each one is
      a failure this is meant to catch. A browser too old for `<script type="module">` ignores the
      bundle entirely and runs nothing at all; a browser too old for the bundle's syntax throws
      before any of our code exists; and either way the only thing on screen is the boot poster,
      pulsing forever with nothing to say. `defer`/`async` would not help: the point is to be
      installed *before* the module is even fetched, so `window.onerror` is already listening.

      What it produces is a report the player can read off the screen and send back, because the
      devices this fires on are exactly the ones with no DevTools attached.
    -->
    <script>
      (function () {
        var notes = [];
        function note(s) {
          notes.push(s);
        }
        window.addEventListener("error", function (e) {
          // Two different events share this name. A resource that 404s or fails to parse targets
          // the element; a thrown exception targets the window and carries `message`.
          if (e && e.target && e.target !== window && (e.target.src || e.target.href)) {
            note("khong tai duoc: " + (e.target.src || e.target.href));
          } else if (e && e.message) {
            note("loi: " + e.message + " @ " + (e.filename || "?") + ":" + (e.lineno || 0));
          }
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason;
          note("promise: " + ((r && (r.stack || r.message)) || r));
        });

        function probe() {
          var out = [];
          out.push("URL: " + location.href);
          out.push("UA: " + navigator.userAgent);
          var mod = "noModule" in document.createElement("script");
          out.push("ES module: " + (mod ? "co" : "KHONG — day chinh la loi"));
          var gl = "none";
          try {
            var c = document.createElement("canvas");
            gl = c.getContext("webgl") || c.getContext("experimental-webgl") ? "webgl" : c.getContext("2d") ? "chi 2d" : "none";
          } catch (err) {
            gl = "loi: " + err;
          }
          out.push("canvas: " + gl);
          try {
            out.push("webp: " + (document.createElement("canvas").toDataURL("image/webp").indexOf("image/webp") === 5 ? "co" : "KHONG"));
          } catch (err) {
            out.push("webp: ?");
          }
          out.push("storage: " + (function () {
            try {
              localStorage.setItem("bf_probe", "1");
              localStorage.removeItem("bf_probe");
              return "co";
            } catch (err) {
              return "KHONG (" + err.name + ")";
            }
          })());
          out.push(notes.length ? "\n" + notes.join("\n") : "\n(khong bat duoc loi nao — bundle co the van dang tai)");
          return out.join("\n");
        }

        // 12s. Long enough that a slow link is not accused of being a broken browser — the game
        // measures 4.4s over a throttled 4 Mbps phone link — and short enough to beat the point
        // where someone gives up and closes the tab.
        setTimeout(function () {
          var boot = document.getElementById("boot");
          if (!boot || document.querySelector("#game canvas")) return;
          var d = boot.querySelector(".diag");
          if (!d) return;
          d.textContent = probe();
          d.style.display = "block";
          var t = boot.querySelector(".title");
          if (t) {
            t.textContent = "KHONG KHOI DONG DUOC";
            t.style.fontSize = "24px";
            t.style.animation = "none";
          }
        }, 12000);
      })();
    </script>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">
      <!-- ⚠ The third place the game is named, after <title> and the home screen's cover art.
           It is the *first* one a player sees — the boot poster stands until `platform.init()`
           resolves — so a stale name here is the name they read, whatever the other two say. -->
      <div class="title">ASTROBALL</div>
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="diag"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
