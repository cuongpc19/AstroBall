    <script>
// ─────────────────────────────────────────────────────────────────────────────
// AquaSort — prototype nước cho AstroBall
//
// Chỗ rẻ để chốt cái NHÌN và cái LUẬT trước khi động vào GameScene thật. Các con
// số bám đúng game cũ, không phải số chọn cho prototype:
//
//   khay  → bình nước, 9 đơn vị   (TRAY_N)
//   ray   → một bồn 30 đơn vị     (BELT_SLOTS) — nhưng không còn ô, không còn vòng
//   box   → máng 3 đơn vị         (BOX_SLOTS)
//   máy   → thân tủ, khoang lõm, vỏ chrome, giếng box (UI trong config.ts)
//
// Cái bị bỏ so với game cũ là **vật lý giữa các viên bi**: không còn body Matter
// va nhau trong phễu, nước chảy thẳng từ bình xuống bồn.
//
// Luật rút, bản dịch sát của cái vòng lặp cũ:
//
//   bồn xếp nước thành LỚP theo thứ tự vào, cùng màu thì gộp lại
//   MỖI máng đang mở tự hút màu của nó ra khỏi bồn, nằm ở lớp nào cũng được
//   không màu nào trong bồn khớp máng nào = tắc; nước dâng quá 30 = tràn
//
// ⚠ "Lớp nào cũng được" mới giữ được tinh thần game cũ, chứ không phải "chỉ lớp
// đáy". Bản trước chỉ cho rút lớp đáy và tắc ở 21/30 sau chín giây: một bình 9 đơn
// vị dồn xuống trong khi chỉ một máng cùng màu mở nhận được 3, sáu đơn vị còn lại
// chẹn đáy vĩnh viễn. Trên ray cũ chuyện đó không xảy ra được — viên không khớp
// chạy vòng tiếp, nó không chặn ai. Áp lực vì thế trở về đúng chỗ cũ: sức chứa 30.
//
// Toàn bộ file độc lập: không import gì, mở thẳng bằng browser cũng chạy.
// ─────────────────────────────────────────────────────────────────────────────

const W = 540, H = 872;

// Bảng màu và tông máy lấy nguyên từ src/game/config.ts.
const PAL = {
  blue:   { base: "#2b5ce8", light: "#6d92ff", dark: "#1a3a9e" },
  green:  { base: "#23bb45", light: "#62e37c", dark: "#137a2b" },
  orange: { base: "#ff8a14", light: "#ffb862", dark: "#c25c00" },
  yellow: { base: "#ffd020", light: "#ffe883", dark: "#c99a00" },
  cyan:   { base: "#55d9f5", light: "#a6efff", dark: "#1f9cba" },
  purple: { base: "#a341f0", light: "#c989ff", dark: "#6d1cab" },
  pink:   { base: "#ff86c4", light: "#ffbadd", dark: "#c94a8d" },
  red:    { base: "#ec3d3d", light: "#ff8080", dark: "#a71c1c" },
};
const NAMES = Object.keys(PAL);

// ⚠ Ba tông, không phải hai — ghi chú ở `UI` trong config.ts nói vì sao. `machine`
// là thân tủ (cái NỀN mà bàn nằm lên), `panelDeep` là vành quanh khoang, chất liệu
// slate duy nhất và là thứ làm nổi hình dáng bàn, `panel` là sàn khoang, lại trắng,
// để nó chạy liền mạch xuống dưới. Tô slate cả khoang thì bàn thành miếng dán tối
// trên hộp trắng; tô slate cả thân tủ thì cái vỏ đọc thành cái lỗ.
const UI = {
  machine: "#dfe6f5", machineEdge: "#a9b6d6",
  panel: "#f4f7fd", panelDeep: "#9fb0cb",
  chrome: "#f3f6fc", beltDeep: "#565d6b",
  ink: "#2b3550",
};

// ⚠ Tỉ lệ 9:3 buộc mỗi bình phải có ĐÚNG 3 máng cùng màu. Tổng nước màu C là (số
// bình C) x 9, sức chứa máng màu C là (số máng C) x 3 — lệch một cái là bàn thừa
// nước thiếu chỗ, không giải được dù chơi hoàn hảo. Vì thế `buildLevel` sinh máng
// TỪ danh sách bình, không sinh độc lập.
const JAR_UNITS = 9;
const TROUGH_CAP = 3;
const TANK_CAP = 30;
const COLS = 4;            // BOX_COLS của game cũ
const TR_VISIBLE = 6;      // BOX_VISIBLE — vẽ bấy nhiêu, còn lại đếm bằng badge
const HATCH_LOAD = 3;      // số bình sau cánh cửa mỗi hatch
const LID_LOAD = 4;        // số bình dưới mỗi tấm socola — game cũ cũng là 4

let DRAIN_MS = 170;
const POUR_MS = 150;
const POUR_LEAD = 220;
// ⚠ 25°. Thân bình gần vuông để vừa một ô lưới, mà hình gần vuông xoay 45° thì
// thành hình THOI — mất sạch dấu hiệu "cái bình", và với mặt nước nằm ngang ở đáy
// nó đọc thành phễu đồng hồ cát. 66° và 46° đều hỏng đúng kiểu đó.
const TILT_MAX = 0.44;
const CLEAR_MS = 620;

// ── Bộ level ─────────────────────────────────────────────────────────────────
//
// `trays / colors / hidden / hatches / crates` chép **nguyên văn** từ `SHEET` trong
// src/game/level.ts, level 1..20. Đó là bộ số đã được tune bằng sim của game cũ, và
// chép lại nguyên là cách duy nhất để prototype này có cùng nhịp lên độ khó.
//
// ⚠ `pairs` và `lids` KHÔNG có trong SHEET và không phải số đã tune. Game cũ sinh
// chúng bằng công thức (`lids = d >= 0.6 && l % 4 === 0 ? 1 : 0`) và để `pairs` mặc
// định 0 kèm ghi chú rằng bật nó lên là làm hỏng `LADDER` và `VARIANTS`, phải tune
// lại toàn bộ. Ở đây bật lên vì được yêu cầu giữ bình đôi và bình socola — nên hai
// cột này là LỊCH DO TÔI ĐẶT, không phải di sản. Đừng đọc chúng như đã cân bằng.
const SHEET = [
  { trays:  8, colors: 4, hidden: 0, hatches: 0, crates: 0, pairs: 0, lids: 0 },
  { trays: 10, colors: 4, hidden: 0, hatches: 0, crates: 0, pairs: 0, lids: 0 },
  { trays: 10, colors: 4, hidden: 0, hatches: 0, crates: 0, pairs: 0, lids: 0 },
  { trays: 10, colors: 5, hidden: 0, hatches: 0, crates: 0, pairs: 0, lids: 0 },
  { trays: 13, colors: 6, hidden: 0, hatches: 0, crates: 0, pairs: 0, lids: 0 },
  { trays: 10, colors: 4, hidden: 0, hatches: 0, crates: 0, pairs: 0, lids: 0 },
  { trays: 14, colors: 5, hidden: 0, hatches: 0, crates: 0, pairs: 0, lids: 0 },
  { trays: 10, colors: 3, hidden: 0, hatches: 3, crates: 0, pairs: 0, lids: 0 },
  { trays: 14, colors: 6, hidden: 0, hatches: 1, crates: 0, pairs: 0, lids: 0 },
  { trays:  8, colors: 4, hidden: 0, hatches: 0, crates: 0, pairs: 1, lids: 0 },
  { trays: 13, colors: 6, hidden: 3, hatches: 0, crates: 0, pairs: 0, lids: 0 },
  { trays: 14, colors: 6, hidden: 0, hatches: 0, crates: 0, pairs: 1, lids: 1 },
  { trays: 13, colors: 6, hidden: 2, hatches: 0, crates: 0, pairs: 0, lids: 0 },
  { trays: 14, colors: 6, hidden: 0, hatches: 1, crates: 0, pairs: 1, lids: 0 },
  { trays: 14, colors: 6, hidden: 4, hatches: 1, crates: 1, pairs: 0, lids: 0 },
  { trays: 14, colors: 6, hidden: 5, hatches: 2, crates: 2, pairs: 0, lids: 1 },
  { trays:  9, colors: 4, hidden: 0, hatches: 0, crates: 0, pairs: 1, lids: 0 },
  { trays: 14, colors: 6, hidden: 0, hatches: 0, crates: 0, pairs: 1, lids: 0 },
  { trays: 14, colors: 6, hidden: 4, hatches: 1, crates: 2, pairs: 0, lids: 0 },
  { trays: 14, colors: 6, hidden: 0, hatches: 2, crates: 2, pairs: 1, lids: 1 },
];

// ── Layout ───────────────────────────────────────────────────────────────────
const MACH = { x: 14, y: 74, w: 512, h: 780 };
const GRID_COLS = 6, GRID_ROWS = 6, CELL = 56, PITCH = 62;
const GRID_X0 = (W - GRID_COLS * PITCH) / 2 + (PITCH - CELL) / 2;
const GRID_Y0 = 100;
// ⚠ Bồn cố tình thấp — 84px cho 30 đơn vị. Nó chỉ cần trả lời "đang giữ màu gì" và
// "còn bao nhiêu chỗ", cả hai đọc bằng bề dày dải màu. Chiều cao dôi ra chuyển hết
// lên cho lưới bình, vì đó mới là chỗ ra quyết định.
const TANK = { x: 40, y: 500, w: 460, h: 84 };
const TR = { x0: 42, y0: 618, w: 106, gap: 8, h: 32, vgap: 5 };

const cellX = (c) => GRID_X0 + c * PITCH + CELL / 2;
const cellY = (r) => GRID_Y0 + r * PITCH + CELL / 2;
const trX = (i) => TR.x0 + i * (TR.w + TR.gap);
const spoutX = (i) => trX(i) + TR.w / 2;
const K = (c, r) => c + "," + r;

// ── State ────────────────────────────────────────────────────────────────────
let level, tiles, grid, cavity, cavitySet, tank, cols, streams, drops, flashes, slide;
let phase, stalledFor, shake, msg, seed;

function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const pick = (a) => a[(rnd() * a.length) | 0];

/**
 * Chọn `n` ô liền khối, mọc dần từ một ô gốc sang các ô kề, rồi dời về giữa lưới.
 *
 * ⚠ Liền khối chứ không bốc ngẫu nhiên n ô: bốc ngẫu nhiên cho ra vài cụm rời rạc
 * và cái khoang vẽ quanh chúng thành mấy hòn đảo, trong khi bàn của game cũ luôn là
 * MỘT khối có eo có ngách. Hình thù đó không phải trang trí — nó là thứ người chơi
 * đọc để biết bàn còn rộng hay đã bị bóp lại, và nó cũng chính là luật thoát.
 */
function growRegion(n) {
  const start = [(rnd() * GRID_COLS) | 0, (rnd() * GRID_ROWS) | 0];
  const taken = new Map([[K(start[0], start[1]), start]]);
  while (taken.size < n) {
    const edge = [];
    for (const [c, r] of taken.values())
      for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nc = c + dc, nr = r + dr;
        if (nc < 0 || nr < 0 || nc >= GRID_COLS || nr >= GRID_ROWS) continue;
        if (!taken.has(K(nc, nr))) edge.push([nc, nr]);
      }
    if (!edge.length) break;
    const p = pick(edge);
    taken.set(K(p[0], p[1]), p);
  }
  const list = [...taken.values()];
  let minC = 9, maxC = -1, minR = 9, maxR = -1;
  for (const [c, r] of list) {
    if (c < minC) minC = c; if (c > maxC) maxC = c;
    if (r < minR) minR = r; if (r > maxR) maxR = r;
  }
  const dc = Math.round((GRID_COLS - 1 - maxC - minC) / 2);
  const dr = Math.round((GRID_ROWS - 1 - maxR - minR) / 2);
  return list.map(([c, r]) => [c + dc, r + dr]);
}

// ── Xây bàn ──────────────────────────────────────────────────────────────────

function newPot(color, cell) {
  return { color, units: JAR_UNITS, cell, tilt: 0, poured: 0 };
}

function place(tile) {
  tiles.push(tile);
  for (const [c, r] of tile.cells) grid.set(K(c, r), tile);
}

function buildLevel(lv, s) {
  level = lv;
  seed = (s ?? Math.floor(Math.random() * 1e9)) >>> 0;
  const sh = SHEET[(lv - 1) % SHEET.length];
  const palette = NAMES.slice(0, sh.colors);

  // Bao nhiêu bình nằm ở đâu. `trays` của SHEET là tổng ĐƠN VỊ khay, và một bình
  // đôi tiêu hai đơn vị đó — đúng như chú thích của `Params.tiles`.
  // ⚠ Bình trong hatch và dưới tấm socola là bình **thêm vào**, không trừ vào
  // `trays`. `Params.lids` viết rõ "each hiding four trays behind a counter" và
  // `dispensers` cũng thế — chúng giấu thêm khay chứ không lấy bớt khay khỏi lưới.
  // Đọc ngược lại thì level 20 (14 khay, 2 hatch, 1 tấm socola) chỉ còn ĐÚNG HAI
  // bình trên bàn, và bàn nhìn như chưa dựng xong. Đã ship đúng thế ở lần chạy đầu.
  const inLids = sh.lids * LID_LOAD;
  const inHatches = sh.hatches * HATCH_LOAD;
  const inPairs = sh.pairs * 2;
  const loose = Math.max(1, sh.trays - inPairs);
  const totalJars = loose + inPairs + inHatches + inLids;

  // Số Ô cần trên lưới: bình trong hatch và dưới tấm socola không chiếm ô riêng.
  const need = loose + sh.pairs * 2 + sh.crates + sh.hatches + sh.lids * 4;
  // ⚠ **Khoang phải rộng hơn số ô dùng.** Với thành máy chặn, một khoang vừa khít
  // thì không bình nào có ô trống bên cạnh và cả bàn đứng im trừ hàng đáy — ghi chú
  // trong level.ts nói đúng thế: "A walled board needs slack inside the cavity, not
  // a snug fit". Chỗ dôi ra chính là chỗ để bóc bàn từ trong ra.
  const slack = Math.max(2, Math.round(need * 0.25));
  const region = growRegion(Math.min(need + slack, GRID_COLS * GRID_ROWS));
  const free = shuffle(region.slice());

  const colors = shuffle(Array.from({ length: totalJars }, (_, i) => palette[i % palette.length]));
  let ci = 0;
  const nextColor = () => colors[ci++];

  tiles = []; grid = new Map();
  cavity = region;
  cavitySet = new Set(region.map(([c, r]) => K(c, r)));
  const used = new Set();
  const take = () => { const c = free.find((x) => !used.has(K(x[0], x[1]))); if (c) used.add(K(c[0], c[1])); return c; };
  const isFree = (c, r) => region.some(([a, b]) => a === c && b === r) && !used.has(K(c, r));

  // Tấm socola trước tiên: nó cần một khối 2x2 nguyên vẹn, và nếu để sau thì các
  // thứ khác đã cắm rải rác khắp nơi và không còn 2x2 nào trống.
  for (let i = 0; i < sh.lids; i++) {
    const spots = [];
    for (const [c, r] of region)
      if (isFree(c, r) && isFree(c + 1, r) && isFree(c, r + 1) && isFree(c + 1, r + 1)) spots.push([c, r]);
    if (!spots.length) break;
    const [c, r] = pick(spots);
    for (const cc of [[c, r], [c + 1, r], [c, r + 1], [c + 1, r + 1]]) used.add(K(cc[0], cc[1]));
    place({
      kind: "lid", cells: [[c, r], [c + 1, r], [c, r + 1], [c + 1, r + 1]],
      // Ruy băng cầu vồng = màu nào cũng tính, đúng như `K.lidRibbon(null)` của game cũ.
      ribbon: rnd() < 0.3 ? null : pick(palette),
      count: 3 + ((rnd() * 3) | 0),
      load: Array.from({ length: LID_LOAD }, () => nextColor()),
    });
  }

  // Hatch: phải có ô NGAY DƯỚI nằm trong bàn, vì nó đẩy bình xuống đó.
  for (let i = 0; i < sh.hatches; i++) {
    const spots = region.filter(([c, r]) => isFree(c, r) && region.some(([a, b]) => a === c && b === r + 1));
    if (!spots.length) break;
    const [c, r] = pick(spots);
    used.add(K(c, r));
    place({ kind: "hatch", cells: [[c, r]], queue: Array.from({ length: HATCH_LOAD }, () => nextColor()) });
  }

  for (let i = 0; i < sh.crates; i++) {
    const c = take(); if (!c) break;
    place({ kind: "crate", cells: [c] });
  }

  // Bình đôi: hai ô kề ngang, mỗi nửa một màu, một chạm rót cả hai.
  for (let i = 0; i < sh.pairs; i++) {
    const spots = region.filter(([c, r]) => isFree(c, r) && isFree(c + 1, r));
    if (!spots.length) break;
    const [c, r] = pick(spots);
    used.add(K(c, r)); used.add(K(c + 1, r));
    place({
      kind: "pair", cells: [[c, r], [c + 1, r]],
      pots: [newPot(nextColor(), [c, r]), newPot(nextColor(), [c + 1, r])],
      pouring: false, pourT: 0,
    });
  }

  // Màu đã phát theo thứ tự đặt: tấm socola, hatch, bình đôi, rồi tới đây. Điều kiện
  // dừng phải là `totalJars`, không phải một hiệu trừ đi hatch/lid — chúng đã tiêu
  // phần của mình từ trước rồi, trừ lần nữa là trừ hai lượt.
  const hiddenLeft = { n: sh.hidden };
  while (ci < totalJars) {
    const cell = take(); if (!cell) break;
    const t = { kind: "jar", cells: [cell], pots: [newPot(nextColor(), cell)], pouring: false, pourT: 0, hidden: false };
    if (hiddenLeft.n > 0) { t.hidden = true; hiddenLeft.n--; }
    place(t);
  }

  // ⚠ Máng sinh TỪ danh sách bình đã phát màu, ba cái một bình. Sinh độc lập rồi
  // hy vọng khớp là cách chắc chắn đẻ ra bàn không giải được.
  const bag = [];
  for (const c of colors.slice(0, ci)) for (let k = 0; k < JAR_UNITS / TROUGH_CAP; k++) bag.push(c);
  shuffle(bag);
  cols = Array.from({ length: COLS }, () => []);
  bag.forEach((c, i) => cols[i % COLS].push({ color: c, filled: 0 }));

  tank = { layers: [], total: 0, wob: 0, wobPhase: 0 };
  streams = []; drops = []; flashes = [];
  slide = new Array(COLS).fill(0);
  phase = "play"; stalledFor = 0; shake = 0; msg = "";
}

// ── Luật bàn ─────────────────────────────────────────────────────────────────

/**
 * Ô có phải lối thoát không.
 *
 * ⚠ **Ô ngoài khoang là THÀNH MÁY, không phải ô trống.** Đây là `walled` của game
 * cũ, và ghi chú ở đó gọi nó là luật thoát nhìn từ phía bên kia: một ô trống cạnh
 * khay là lối ra, còn vỏ máy thì không — nên cùng một hình bàn, chơi có thành và
 * chơi không thành là hai bài khác nhau, một bên bóc từ ngoài vào, một bên bóc từ
 * trong ra.
 *
 * Bản đầu bỏ mất vế này: `cellFree` chỉ hỏi "trong lưới và chưa có tile", nên mọi ô
 * ngoài khoang đều tính là lối ra. Hình vẽ đã có thành tủ trắng bao quanh khoang từ
 * trước, nên cái sai không nhìn ra được — nó chỉ khiến mọi bình ở rìa bàn rót được
 * miễn phí, tức là bàn không có thành. Hình nói một đằng, luật làm một nẻo.
 */
const cellFree = (c, r) =>
  c >= 0 && r >= 0 && c < GRID_COLS && r < GRID_ROWS &&
  cavitySet.has(K(c, r)) && !grid.has(K(c, r));

/**
 * Port thẳng `canEscape` trong src/game/logic.ts:
 *
 *   hàng đáy luôn được — nó nằm trên miệng phễu, rót thẳng xuống chứ không lách
 *   ngang trước;
 *   còn lại cần ÍT NHẤT MỘT ô kề trực giao đang TRỐNG.
 *
 * ⚠ **Mép bàn không tính là lối ra** (trừ hàng đáy). Khoang được vẽ hở xuống dưới
 * và bịt kín ba phía còn lại, nên một bình bị kẹp ba mặt là bị nhốt dù đứng sát mép.
 * Coi mép là lối ra thì mọi ô rìa được rót miễn phí và bốn góc của khối đặc mở ra
 * trong khi nhìn rõ là chúng không đi đâu được.
 *
 * ⚠ Đây **cũng là** phép thử lộ mặt của bình ẩn, và hai cái phải là MỘT phép thử —
 * ghi chú trong logic.ts kể chuyện level 38 ship lỗi vì tách chúng ra.
 */
function canEscape(t) {
  for (const [c, r] of t.cells) if (r === GRID_ROWS - 1) return true;
  for (const [c, r] of t.cells)
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc, nr = r + dr;
      if (t.cells.some(([a, b]) => a === nc && b === nr)) continue;
      if (cellFree(nc, nr)) return true;
    }
  return false;
}

const pourable = (t) => (t.kind === "jar" || t.kind === "pair") && !t.hidden && !t.pouring;
const liftable = (t) => pourable(t) && canEscape(t);

function tapTile(t) {
  if (phase !== "play" || !t || !liftable(t)) return;
  t.pouring = true; t.pourT = 0;
  for (const p of t.pots) p.poured = 0;
}

/** Bình rót xong: gỡ khỏi bàn, rồi hỏi hatch và tấm socola xem có gì mở ra không. */
function retire(t) {
  for (const [c, r] of t.cells) grid.delete(K(c, r));
  tiles = tiles.filter((x) => x !== t);
  for (const p of t.pots) countTowardLids(p.color);
}

/**
 * Tấm socola: mỗi bình rót xong đúng màu ruy băng thì hạ số đếm một nấc. Về 0 thì
 * tấm vỡ và bốn bình dưới nó nhập bàn.
 *
 * ⚠ Ruy băng `null` là cầu vồng — màu nào cũng tính — y như `K.lidRibbon(null)` của
 * game cũ. Nó là LUẬT chứ không phải trang trí: ruy băng nói màu nào mở được tấm.
 */
function countTowardLids(color) {
  for (const t of tiles.slice()) {
    if (t.kind !== "lid" || t.count <= 0) continue;
    if (t.ribbon !== null && t.ribbon !== color) continue;
    t.count--;
    if (t.count > 0) continue;
    const cells = t.cells.slice(), load = t.load.slice();
    for (const [c, r] of cells) grid.delete(K(c, r));
    tiles = tiles.filter((x) => x !== t);
    flashes.push({ box: [cellX(cells[0][0]) - CELL / 2, cellY(cells[0][1]) - CELL / 2, PITCH + CELL, PITCH + CELL], color: t.ribbon ?? "cyan", t: 1 });
    cells.forEach(([c, r], i) => {
      if (i >= load.length) return;
      place({ kind: "jar", cells: [[c, r]], pots: [newPot(load[i], [c, r])], pouring: false, pourT: 0, hidden: false });
    });
  }
}

/** Hatch đẩy bình ra ô ngay dưới khi ô đó trống. Hết hàng thì chính nó biến mất. */
function serviceHatches() {
  for (const t of tiles.slice()) {
    if (t.kind !== "hatch") continue;
    const [c, r] = t.cells[0];
    if (!t.queue.length) {
      grid.delete(K(c, r));
      tiles = tiles.filter((x) => x !== t);
      continue;
    }
    if (!cellFree(c, r + 1)) continue;
    const color = t.queue.shift();
    place({ kind: "jar", cells: [[c, r + 1]], pots: [newPot(color, [c, r + 1])], pouring: false, pourT: 0, hidden: false });
  }
}

// ── Luật bồn ─────────────────────────────────────────────────────────────────

function pushUnit(color) {
  const top = tank.layers[tank.layers.length - 1];
  if (top && top.color === color) top.units++;
  else tank.layers.push({ color, units: 1 });
  tank.total++;
  tank.wob = Math.min(1, tank.wob + 0.2);
  if (tank.total > TANK_CAP) { phase = "lose"; msg = "TRÀN BỒN!"; shake = 1; }
}

const active = (i) => (cols[i].length ? cols[i][0] : null);

/** Bốc một đơn vị khỏi lớp `i`; lớp cạn thì bỏ, hai lớp cùng màu chạm nhau thì gộp. */
function takeUnit(i) {
  const L = tank.layers[i];
  L.units--; tank.total--;
  if (L.units > 0) return;
  tank.layers.splice(i, 1);
  if (i > 0 && i < tank.layers.length && tank.layers[i - 1].color === tank.layers[i].color) {
    tank.layers[i - 1].units += tank.layers[i].units;
    tank.layers.splice(i, 1);
  }
}

/**
 * Mỗi máng đang mở tự hút màu của nó ra khỏi bồn, một đơn vị mỗi nhịp, bốn vòi
 * song song. Lấy từ lớp THẤP NHẤT có màu đó: nước sâu ra trước, mặt bồn hạ liên tục.
 */
function drain() {
  let moved = false;
  for (let i = 0; i < COLS; i++) {
    const t = active(i);
    if (!t) continue;
    const li = tank.layers.findIndex((L) => L.color === t.color);
    if (li < 0) continue;
    takeUnit(li);
    drops.push({ x: spoutX(i), y: TANK.y + TANK.h, color: t.color, t: 0 });
    t.filled++;
    // ⚠ Đóng máng NGAY trong lượt rút, không hẹn giờ. Bản đầu shift qua setTimeout
    // 260ms trong khi nhịp rút là 110 — hai đơn vị nữa kịp rót vào máng đã đầy, nước
    // đó rời bồn mà không mở thêm máng nào, và tổng nước một màu tụt xuống dưới tổng
    // sức chứa máng màu đó: bàn thành KHÔNG THỂ giải. Cái đang tan là bóng ma.
    if (t.filled >= TROUGH_CAP) {
      flashes.push({ col: i, color: t.color, t: 1 });
      slide[i] = 1;
      cols[i].shift();
    }
    moved = true;
  }
  return moved;
}

/** Miệng bình: **góc dưới của vành sau khi nghiêng**, chỗ nước thật sự tràn qua. */
function mouthOf(p) {
  const a = p.tilt * TILT_MAX;
  const x = cellX(p.cell[0]), y = cellY(p.cell[1]);
  const hx = 23, hy = 23;
  return { x: x + hx * Math.cos(a) + hy * Math.sin(a), y: y + hx * Math.sin(a) - hy * Math.cos(a) };
}

// ── Loop ─────────────────────────────────────────────────────────────────────
let lastDrain = 0, last = 0;

function step(now, dt) {
  if (phase === "play") {
    // Bình ẩn lộ mặt bằng ĐÚNG phép thử của `liftable` — xem ghi chú ở `canEscape`.
    for (const t of tiles) if (t.hidden && canEscape(t)) t.hidden = false;

    for (const t of tiles.slice()) {
      if (!t.pots) continue;
      if (!t.pouring) { for (const p of t.pots) p.tilt += (0 - p.tilt) * 0.18; continue; }
      t.pourT += dt;
      for (const p of t.pots) p.tilt += (1 - p.tilt) * 0.16;
      const want = Math.min(JAR_UNITS, Math.floor((t.pourT - POUR_LEAD) / POUR_MS));
      for (const p of t.pots) {
        while (p.poured < want && p.units > 0) {
          p.poured++; p.units--;
          const m = mouthOf(p);
          streams.push({ x0: m.x, y0: m.y, color: p.color, t: 0 });
          pushUnit(p.color);
        }
      }
      if (t.pots.every((p) => p.units <= 0)) { t.pouring = false; retire(t); }
    }
    serviceHatches();

    if (now - lastDrain > DRAIN_MS) {
      lastDrain = now;
      // Bồn rỗng KHÔNG phải tắc: `drain` trả false cả khi không có gì để rút.
      const moved = drain();
      stalledFor = moved || tank.total === 0 ? 0 : stalledFor + DRAIN_MS;
    }

    const done = !tiles.some((t) => t.pots || t.kind === "hatch" || t.kind === "lid");
    if (done && tank.total === 0) { phase = "win"; msg = "SẠCH BỒN!"; }
    else if (done && stalledFor > 900) { phase = "lose"; msg = "BỒN TẮC!"; }
  }

  tank.wob *= 0.94;
  tank.wobPhase += dt * 0.006;
  shake *= 0.9;
  for (const s of streams) s.t += dt / 300;
  streams = streams.filter((s) => s.t < 1);
  for (const d of drops) d.t += dt / 200;
  drops = drops.filter((d) => d.t < 1);
  for (const f of flashes) f.t -= dt / CLEAR_MS;
  flashes = flashes.filter((f) => f.t > 0);
  for (let i = 0; i < COLS; i++) slide[i] = Math.max(0, slide[i] - dt / CLEAR_MS);
}

// ── Draw ─────────────────────────────────────────────────────────────────────
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

function rr(x, y, w, h, r) {
  const k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
const fillRR = (x, y, w, h, r, s) => { rr(x, y, w, h, r); ctx.fillStyle = s; ctx.fill(); };

function waterTop(x, w, y, amp, ph) {
  ctx.moveTo(x, y);
  for (let i = 0; i <= 24; i++) {
    const t = i / 24;
    ctx.lineTo(x + t * w, y + Math.sin(ph + t * 7.5) * amp);
  }
}

/** Thân tủ: bóng đổ, mép, thân, gờ sáng trên nắp. Đúng bốn lớp của `buildMachine`. */
function drawMachine() {
  const m = MACH;
  fillRR(m.x - 8, m.y + 12, m.w + 16, m.h, 44, "rgba(37,35,80,0.35)");
  fillRR(m.x - 4, m.y + 6, m.w + 8, m.h, 40, UI.machineEdge);
  fillRR(m.x, m.y, m.w, m.h, 38, UI.machine);
  // Một vệt sáng dọc mép trên — đọc thành cạnh nhựa đúc, và nó là thứ duy nhất nói
  // cái tủ có bề dày.
  fillRR(m.x + 14, m.y + 7, m.w - 28, 12, 6, "rgba(255,255,255,0.5)");
}

/**
 * Khoang lõm dưới lưới: vành slate rồi sàn trắng, mỗi lớp là MỘT `fill()` cho tất
 * cả các ô.
 *
 * ⚠ Fill riêng từng ô thì chỗ hai ô chồng nhau bị tô hai lượt và với màu có alpha
 * đó là một lưới ô bàn cờ hiện giữa khoang; stroke từng ô thì vẽ ra đúng những
 * đường ghép mà cách này xoá đi. Và phải có cầu nối, nếu không chỗ bốn ô gặp nhau
 * thủng một lỗ hình thoi cho thân tủ lọt qua.
 */
function fillCells(inset, radius, style, pad = 0) {
  const has = new Set(cavity.map(([c, r]) => K(c, r)));
  ctx.beginPath();
  for (const [c, r] of cavity) {
    const x = cellX(c) - CELL / 2 - inset, y = cellY(r) - CELL / 2 - inset;
    const w = CELL + inset * 2, h = CELL + inset * 2;
    const k = Math.min(radius, w / 2, h / 2);
    ctx.moveTo(x + k, y);
    ctx.arcTo(x + w, y, x + w, y + h, k);
    ctx.arcTo(x + w, y + h, x, y + h, k);
    ctx.arcTo(x, y + h, x, y, k);
    ctx.arcTo(x, y, x + w, y, k);
    ctx.closePath();
  }
  // ⚠ Cầu nối chỉ được nới rộng DỌC THEO KHE, còn bề ngang phải khớp đúng ô — cộng
  // `pad`, và `pad` chỉ khác 0 ở lớp trong. Bản đầu nới cả hai phương ở cả hai lớp,
  // nên cầu của lớp vành (inset 8) thò ra xa hơn sàn khoang (inset 3) và để lại một
  // mẩu slate nhô ra ở mỗi mối nối — trông như mấy cái chấm bẩn rải đều giữa khoang.
  // Lớp trong lấy pad 4 để bịt lỗ hình thoi mà vẫn nằm gọn trong vành.
  const gap = PITCH - CELL;
  for (const [c, r] of cavity) {
    const x = cellX(c) - CELL / 2, y = cellY(r) - CELL / 2;
    const e = inset + pad;
    if (has.has(K(c + 1, r))) ctx.rect(x + CELL - 2, y - e, gap + 4, CELL + e * 2);
    if (has.has(K(c, r + 1))) ctx.rect(x - e, y + CELL - 2, CELL + e * 2, gap + 4);
  }
  ctx.fillStyle = style;
  ctx.fill();
}

function drawCavity() {
  fillCells(8, 21, UI.panelDeep, 0);
  fillCells(3, 17, UI.panel, 4);
  for (const [c, r] of cavity) {
    if (grid.has(K(c, r))) continue;
    fillRR(cellX(c) - CELL / 2 + 2, cellY(r) - CELL / 2 + 2, CELL - 4, CELL - 4, 12, "#e4ebf8");
    ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 2;
    rr(cellX(c) - CELL / 2 + 3, cellY(r) - CELL / 2 + 3, CELL - 6, CELL - 6, 11); ctx.stroke();
  }
}

function drawPot(p, locked, hidden) {
  const bw = 46, bh = 54;
  const x = cellX(p.cell[0]), y = cellY(p.cell[1]);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(p.tilt * TILT_MAX);
  ctx.translate(-bw / 2, -bh / 2);

  // ⚠ Kính sáng có viền slate, không phải trắng mờ: bình đứng trên sàn khoang trắng,
  // và trắng mờ trên trắng thì cái bình chỉ còn là vũng nước màu lơ lửng.
  fillRR(bw / 2 - 9, -14, 18, 20, 4, "rgba(255,255,255,0.62)");
  ctx.strokeStyle = "rgba(96,120,160,0.5)"; ctx.lineWidth = 1.6;
  rr(bw / 2 - 9, -14, 18, 20, 4); ctx.stroke();
  fillRR(0, 0, bw, bh, 13, hidden ? "#8d9bb4" : "rgba(255,255,255,0.62)");

  if (!hidden && p.units > 0) {
    ctx.save();
    rr(2, 2, bw - 4, bh - 4, 11); ctx.clip();
    // ⚠ Mặt nước phải NẰM NGANG so với màn hình, không nghiêng theo bình — trong một
    // cái bình trong suốt thì nước dán vào thành là thứ mắt bắt ngay. Xoay ngược lại
    // đúng góc nghiêng trước khi đổ.
    const a2 = p.tilt * TILT_MAX;
    ctx.translate(bw / 2, bh / 2);
    ctx.rotate(-a2);
    const pal = PAL[p.color];
    const top = bh / 2 - (p.units / JAR_UNITS) * (bh - 8) * (1 - 0.28 * Math.sin(a2));
    const g = ctx.createLinearGradient(0, top, 0, bh);
    g.addColorStop(0, pal.light); g.addColorStop(0.4, pal.base); g.addColorStop(1, pal.dark);
    ctx.fillStyle = g;
    ctx.beginPath();
    waterTop(-bw, bw * 3, top, 2.2, x * 0.05 + performance.now() * 0.004);
    ctx.lineTo(bw * 2, bh * 2); ctx.lineTo(-bw, bh * 2); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  ctx.strokeStyle = locked ? "rgba(70,90,124,0.75)" : "rgba(88,112,155,0.6)";
  ctx.lineWidth = 2;
  rr(0, 0, bw, bh, 13); ctx.stroke();
  fillRR(7, 8, 5, bh - 20, 2.5, "rgba(255,255,255,0.5)");

  if (hidden) {
    ctx.fillStyle = "#eef3fb";
    ctx.font = "700 30px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("?", bw / 2, bh / 2);
    ctx.textBaseline = "alphabetic";
  } else if (locked) {
    // ⚠ Bình bị nhốt phải NHÌN RA ĐƯỢC, không chỉ là bấm không ăn. Game cũ nói điều
    // đó bằng trứng nổi-hay-lép; bình không có trứng nên lời hứa chuyển sang cái NẮP.
    // Nắp chứ không phải làm mờ: mờ đọc thành "ô hỏng", nắp đọc thành "đậy, mở sau".
    fillRR(bw / 2 - 13, -18, 26, 13, 4, "#69769a");
    fillRR(bw / 2 - 13, -18, 26, 6, 3, "#8f9cbd");
    fillRR(2, 2, bw - 4, bh - 4, 11, "rgba(46,58,84,0.28)");
  }
  ctx.restore();
}

/** Kẹp giữ hai nửa bình đôi — vẽ riêng ở giữa, không nướng vào mặt bình. */
function drawClip(t) {
  const [a, b] = t.cells;
  const x = (cellX(a[0]) + cellX(b[0])) / 2, y = cellY(a[1]);
  fillRR(x - 11, y - 15, 22, 30, 7, UI.machineEdge);
  fillRR(x - 9, y - 13, 18, 23, 5, "#ffffff");
  fillRR(x - 5, y - 7, 10, 14, 3, UI.panelDeep);
}

function drawCrate(t) {
  const [c, r] = t.cells[0];
  const x = cellX(c) - CELL / 2, y = cellY(r) - CELL / 2;
  fillRR(x + 1, y + 4, CELL - 2, CELL - 4, 10, "#6b4423");
  const g = ctx.createLinearGradient(0, y, 0, y + CELL);
  g.addColorStop(0, "#b98a52"); g.addColorStop(1, "#8d6236");
  fillRR(x + 1, y + 1, CELL - 2, CELL - 7, 10, g);
  ctx.strokeStyle = "#7d5430"; ctx.lineWidth = 7; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x + 10, y + 9); ctx.lineTo(x + CELL - 10, y + CELL - 15);
  ctx.moveTo(x + CELL - 10, y + 9); ctx.lineTo(x + 10, y + CELL - 15);
  ctx.stroke();
}

/** Hatch: vỏ máy với cửa cuốn ở đáy, số trên mặt là còn bao nhiêu bình sau cửa. */
function drawHatch(t) {
  const [c, r] = t.cells[0];
  const x = cellX(c) - CELL / 2, y = cellY(r) - CELL / 2;
  const doorTop = CELL - 19;
  fillRR(x + 1, y + 3, CELL - 2, CELL - 3, 13, "#2f3a4f");
  const g = ctx.createLinearGradient(0, y, 0, y + doorTop);
  g.addColorStop(0, "#b6cbec"); g.addColorStop(1, "#7f99c6");
  fillRR(x + 2, y + 2, CELL - 4, doorTop - 2, 12, g);
  fillRR(x + 3, y + doorTop - 4, 6, 20, 3, "#5a6c8c");
  fillRR(x + CELL - 9, y + doorTop - 4, 6, 20, 3, "#5a6c8c");
  fillRR(x + 7, y + doorTop - 2, CELL - 14, 18, 5, "#3d4a63");
  ctx.strokeStyle = "#55658a"; ctx.lineWidth = 1.6;
  for (let k = 0; k < 3; k++) {
    ctx.beginPath();
    ctx.moveTo(x + 10, y + doorTop + 2.5 + k * 5);
    ctx.lineTo(x + CELL - 10, y + doorTop + 2.5 + k * 5);
    ctx.stroke();
  }
  ctx.fillStyle = UI.ink;
  ctx.font = "700 22px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(String(t.queue.length), x + CELL / 2, y + doorTop / 2 + 8);
}

/**
 * Tấm socola: khối 2x2 với hai dải ruy băng bắt chéo và một mặt đồng hồ đếm.
 *
 * ⚠ Vẽ là **socola**, không phải tấm chrome. Ghi chú ở `K.lid` của game cũ kể rằng
 * bản chrome đọc thành một mảnh của chính cái tủ — một tấm panel tình cờ có số trên
 * đó — chứ không thành một vật ĐANG NẰM CHẶN trên bàn. Mọi vật cản khác nói mình là
 * gì bằng chất liệu, cái này cũng phải thế.
 */
function drawLid(t) {
  const [c, r] = t.cells[0];
  const x = cellX(c) - CELL / 2, y = cellY(r) - CELL / 2;
  const w = PITCH + CELL, h = PITCH + CELL;
  fillRR(x + 2, y + 6, w - 4, h - 6, 16, "#3d2412");
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "#8a5a2f"); g.addColorStop(1, "#5d3618");
  fillRR(x + 2, y + 2, w - 4, h - 10, 16, g);

  const RIB = 18;
  const band = (bx, by, bw, bh) => {
    if (t.ribbon === null) {
      // Cầu vồng: chạy hết bảng màu dọc theo dải, để "màu nào cũng tính" đọc được
      // mà không cần chú thích.
      const along = bw > bh;
      const lg = ctx.createLinearGradient(bx, by, along ? bx + bw : bx, along ? by : by + bh);
      NAMES.forEach((n, i) => lg.addColorStop(i / (NAMES.length - 1), PAL[n].base));
      ctx.fillStyle = lg;
    } else ctx.fillStyle = PAL[t.ribbon].base;
    ctx.fillRect(bx, by, bw, bh);
  };
  band(x + (w - RIB) / 2, y, RIB, h - 8);
  band(x, y + (h - RIB) / 2 - 2, w, RIB);
  ctx.fillStyle = "rgba(30,16,6,0.28)";
  ctx.fillRect(x + (w - RIB) / 2 - 3, y, 3, h - 8);
  ctx.fillRect(x, y + (h - RIB) / 2 - 5, w, 3);

  const cx = x + w / 2, cy = y + h / 2 - 2;
  ctx.fillStyle = "rgba(40,22,10,0.35)";
  ctx.beginPath(); ctx.arc(cx, cy + 2, 25, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#f7f1e4";
  ctx.beginPath(); ctx.arc(cx, cy, 23, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#5d3618";
  ctx.font = "700 28px system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(String(t.count), cx, cy + 1);
  ctx.textBaseline = "alphabetic";
}

function drawTiles() {
  for (const t of tiles) {
    if (t.kind === "crate") drawCrate(t);
    else if (t.kind === "hatch") drawHatch(t);
    else if (t.kind === "lid") drawLid(t);
  }
  for (const t of tiles) {
    if (!t.pots) continue;
    const locked = !liftable(t) && !t.pouring && !t.hidden;
    if (t.kind === "pair") drawClip(t);
    for (const p of t.pots) drawPot(p, locked, t.hidden);
  }
}

function drawPourStreams() {
  for (const t of tiles) {
    if (!t.pots || !t.pouring) continue;
    for (const p of t.pots) {
      if (p.tilt < 0.4 || p.units <= 0) continue;
      const pal = PAL[p.color];
      const m = mouthOf(p);
      const yEnd = TANK.y + 6;
      const midY = m.y + (yEnd - m.y) * 0.45;
      // ⚠ Hai mép của dòng là hai đường RIÊNG, cùng độ cong, lệch nhau đúng bề rộng.
      // Dùng chung một điểm điều khiển thì trên quãng rơi dài chúng bị kéo dính vào
      // nhau và cú rót đọc thành sợi chỉ treo từ bình xuống.
      const xEnd = m.x + 10, cx = m.x + 6, wTop = 9, wBot = 6.5;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(m.x - wTop / 2, m.y);
      ctx.quadraticCurveTo(cx - wTop / 2, midY, xEnd - wBot / 2, yEnd);
      ctx.lineTo(xEnd + wBot / 2, yEnd);
      ctx.quadraticCurveTo(cx + wTop / 2, midY, m.x + wTop / 2, m.y);
      ctx.closePath();
      ctx.globalAlpha = 0.95; ctx.fillStyle = pal.base; ctx.fill();
      ctx.globalAlpha = 0.55; ctx.strokeStyle = pal.light; ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(m.x - 1.5, m.y);
      ctx.quadraticCurveTo(cx - 1.5, midY, xEnd - 1.5, yEnd);
      ctx.stroke();
      ctx.globalAlpha = 0.5; ctx.fillStyle = pal.light;
      ctx.beginPath(); ctx.ellipse(xEnd, yEnd + 2, 11, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
}

/** Bồn, trong vỏ chrome — cùng cách dựng với vỏ băng chuyền của game cũ. */
function drawTank() {
  const { x, y, w, h } = TANK;
  const unit = h / TANK_CAP;
  fillRR(x - 12, y - 10, w + 24, h + 22, 24, UI.machineEdge);
  fillRR(x - 12, y - 12, w + 24, h + 22, 24, UI.chrome);
  fillRR(x - 4, y - 4, w + 8, h + 8, 18, UI.beltDeep);
  fillRR(x, y, w, h, 15, "#1b2338");

  ctx.save();
  rr(x, y, w, h, 15); ctx.clip();
  let cursor = y + h;
  for (let i = 0; i < tank.layers.length; i++) {
    const L = tank.layers[i];
    const p = PAL[L.color];
    const top = cursor - L.units * unit;
    const isTop = i === tank.layers.length - 1;
    const g = ctx.createLinearGradient(0, top, 0, cursor);
    g.addColorStop(0, p.light); g.addColorStop(0.35, p.base); g.addColorStop(1, p.dark);
    ctx.fillStyle = g;
    ctx.beginPath();
    if (isTop) waterTop(x, w, top, 3.4 * tank.wob + 1, tank.wobPhase);
    else { ctx.moveTo(x, top); ctx.lineTo(x + w, top); }
    ctx.lineTo(x + w, cursor + 1); ctx.lineTo(x, cursor + 1); ctx.closePath();
    ctx.fill();
    // Vạch sáng ở ranh giới: chỗ duy nhất nói cho người chơi biết thứ tự trong bồn.
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.fillRect(x, top - 1, w, isTop ? 0 : 2);
    cursor = top;
  }
  ctx.fillStyle = "rgba(255,60,60,0.16)";
  ctx.fillRect(x, y, w, unit * 5);
  ctx.restore();

  fillRR(x + 8, y + 8, 8, h - 20, 4, "rgba(255,255,255,0.16)");
  for (let i = 0; i < COLS; i++) {
    fillRR(spoutX(i) - 11, y + h + 6, 22, 14, 5, UI.machineEdge);
    fillRR(spoutX(i) - 7, y + h + 18, 14, 8, 3, UI.beltDeep);
  }

  ctx.fillStyle = stalledFor > 400 ? "#c0392b" : UI.ink;
  ctx.font = "700 19px system-ui, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(tank.total + " / " + TANK_CAP, x - 8, y - 22);
  if (stalledFor > 400 && phase === "play") {
    ctx.font = "700 14px system-ui, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText("TẮC — không màu nào khớp máng đang mở", x + w + 8, y - 22);
  }
}

/** Giếng lõm mà các cột máng thụt vào, cùng hai tông với khoang lưới. */
function drawWell() {
  const top = TR.y0 - 12;
  const hgt = MACH.y + MACH.h - top - 10;
  fillRR(MACH.x + 3, top - 7, MACH.w - 6, hgt + 7, 32, UI.panelDeep);
  fillRR(MACH.x + 10, top, MACH.w - 20, hgt, 26, UI.panel);
  for (let i = 0; i < COLS; i++)
    fillRR(trX(i) - 3, top + 8, TR.w + 6, hgt - 14, 12, "rgba(159,176,203,0.22)");
}

function drawTroughs() {
  for (let i = 0; i < COLS; i++) {
    const shown = Math.min(TR_VISIBLE, cols[i].length);
    const hidden = cols[i].length - shown;
    const ease = slide[i] * slide[i] * (3 - 2 * slide[i]);
    const yOff = ease * (TR.h + TR.vgap);
    if (hidden > 0) {
      ctx.fillStyle = "rgba(90,110,145,0.7)";
      ctx.font = "700 13px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("+" + hidden, trX(i) + TR.w / 2, TR.y0 + shown * (TR.h + TR.vgap) + 12);
    }
    for (let k = 0; k < shown; k++) {
      const t = cols[i][k];
      const x = trX(i), y = TR.y0 + k * (TR.h + TR.vgap) + yOff;
      const p = PAL[t.color];
      const open = k === 0;
      // ⚠ Máng chưa tới lượt vẫn phải ĐỌC ĐƯỢC MÀU, chỉ mờ hơn. Ở 0.4 trên nền
      // giếng trắng chúng bạc hết thành xám, mà cả cột là hàng đợi người chơi phải
      // nhìn trước để biết rót gì — che nó đi là bỏ mất nửa thông tin của bàn.
      ctx.globalAlpha = open ? 1 : 0.78;
      fillRR(x, y, TR.w, TR.h, 9, "rgba(30,44,72,0.75)");
      if (open && t.filled > 0) {
        ctx.save();
        rr(x + 3, y + 3, TR.w - 6, TR.h - 6, 7); ctx.clip();
        const top = y + TR.h - 3 - (t.filled / TROUGH_CAP) * (TR.h - 6);
        const g = ctx.createLinearGradient(0, top, 0, y + TR.h);
        g.addColorStop(0, p.light); g.addColorStop(0.4, p.base); g.addColorStop(1, p.dark);
        ctx.fillStyle = g;
        ctx.beginPath();
        waterTop(x, TR.w, top, 1.6, performance.now() * 0.005 + i);
        ctx.lineTo(x + TR.w, y + TR.h); ctx.lineTo(x, y + TR.h); ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      // Vành máng mang màu nó nhận — máng rỗng thì đó là thứ duy nhất nói màu gì.
      fillRR(x + 3, y + 2, TR.w - 6, 6, 3, p.base);
      ctx.strokeStyle = open ? "rgba(255,255,255,0.55)" : "rgba(255,255,255,0.22)";
      ctx.lineWidth = 2;
      rr(x, y, TR.w, TR.h, 9); ctx.stroke();
      if (open) {
        ctx.fillStyle = "rgba(255,255,255,0.92)";
        ctx.font = "700 14px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(t.filled + "/" + TROUGH_CAP, x + TR.w / 2, y + TR.h - 8);
      }
      ctx.globalAlpha = 1;
    }
  }
  // Bóng ma của thứ vừa vỡ: nở ra rồi tan, vẽ SAU cả lưới nên nó nằm trên cái đang
  // trượt lên — cái cũ tan để lộ cái mới bên dưới.
  for (const f of flashes) {
    const box = f.box ?? [trX(f.col), TR.y0, TR.w, TR.h];
    const grow = (1 - f.t) * 5;
    ctx.globalAlpha = f.t * f.t;
    fillRR(box[0] - grow, box[1] - grow, box[2] + grow * 2, box[3] + grow * 2, 9 + grow, PAL[f.color].base);
    ctx.globalAlpha = f.t * f.t * 0.9;
    fillRR(box[0] - grow, box[1] - grow, box[2] + grow * 2, box[3] + grow * 2, 9 + grow, "rgba(255,255,255,0.85)");
    ctx.globalAlpha = 1;
  }
}

function drawDrops() {
  for (const s of streams) {
    const p = PAL[s.color];
    const y = s.y0 + (TANK.y + 8 - s.y0) * s.t * s.t;
    ctx.globalAlpha = 0.55 * (1 - s.t);
    ctx.fillStyle = p.light;
    ctx.beginPath(); ctx.ellipse(s.x0 + 14 + s.t * 6, y, 2.4, 3.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (const d of drops) {
    const p = PAL[d.color];
    const y = d.y + (TR.y0 + 8 - d.y) * d.t * d.t;
    ctx.fillStyle = p.base;
    ctx.beginPath(); ctx.ellipse(d.x, y, 4.5, 8, 0, 0, Math.PI * 2); ctx.fill();
  }
}

function draw() {
  ctx.save();
  if (shake > 0.01) ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#2f2c63"); bg.addColorStop(1, "#6a4f9e");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  drawMachine();
  drawCavity();
  drawTiles();
  drawPourStreams();
  drawTank();
  drawWell();
  drawTroughs();
  drawDrops();

  // HUD nằm trên nền tím, ngoài thân tủ — nên chữ sáng, khác chữ trên máy.
  ctx.fillStyle = "rgba(240,238,255,0.95)";
  ctx.font = "700 24px system-ui, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("Level " + level, 24, 44);
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.font = "700 15px system-ui, sans-serif";
  ctx.fillText(DEMO ? "demo — thắng " + tally.win + " / thua " + tally.lose : "R = bàn mới · N = level sau", W - 24, 44);

  if (phase !== "play") {
    ctx.fillStyle = "rgba(20,16,44,0.74)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = phase === "win" ? "#7fe0a0" : "#ff8f8f";
    ctx.font = "700 52px system-ui, sans-serif";
    ctx.fillText(msg, W / 2, H / 2 - 10);
    ctx.fillStyle = "rgba(230,242,255,0.8)";
    ctx.font = "600 20px system-ui, sans-serif";
    ctx.fillText(phase === "win" ? "chạm để sang level " + (level + 1) : "chạm để chơi lại", W / 2, H / 2 + 34);
  }
  ctx.restore();
}

// ── Bot ──────────────────────────────────────────────────────────────────────
//
// `?demo` cho nó tự chơi — cách duy nhất kiểm tra luật chạy tới thắng, vì một bàn
// chỉ tắc sau chục nước rót. `?fast` rút nhịp để soi nhiều bàn; không đụng tới luật.
//
// ⚠ Bot này đơn giản hơn bản trước, và đó là một PHÉP ĐO. Hồi bồn chỉ rút được lớp
// đáy, nó phải đếm "chỗ trống của màu này trừ phần nước màu này đã trong bồn" — tức
// "marbles already spoken for" trong scripts/bots.mjs — vì rót thừa là chẹn đáy vĩnh
// viễn. Giờ nước thừa chỉ nằm chờ, nên phép đếm đó vô nghĩa. Cái mất theo là độ khó.
const Q = new URLSearchParams(location.search);
const DEMO = Q.has("demo");
if (Q.has("fast")) DRAIN_MS = 40;
const BOT_GAP = Q.has("fast") ? 140 : 420;
let botAt = 0, tally = { win: 0, lose: 0 }, overAt = 0;

function bot(now) {
  if (DEMO && phase !== "play") {
    if (!overAt) overAt = now;
    else if (now - overAt > 700) {
      tally[phase === "win" ? "win" : "lose"]++;
      overAt = 0;
      buildLevel(phase === "win" ? level + 1 : level);
    }
    return;
  }
  if (!DEMO || phase !== "play" || now - botAt < BOT_GAP) return;
  if (tiles.some((t) => t.pouring)) return;
  const ready = tiles.filter(liftable);
  if (!ready.length) return;
  const load = (t) => t.pots.reduce((n, p) => n + p.units, 0);
  const open = new Set();
  for (let i = 0; i < COLS; i++) { const a = active(i); if (a) open.add(a.color); }
  const fits = ready.filter((t) => tank.total + load(t) <= TANK_CAP);
  if (!fits.length) return;
  const p = fits.find((t) => t.pots.every((q) => open.has(q.color))) ?? fits[0];
  botAt = now; tapTile(p);
}

// ── Input + fit ──────────────────────────────────────────────────────────────
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio;
  cv.style.width = W * s + "px"; cv.style.height = H * s + "px";
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener("resize", fit);

cv.addEventListener("pointerdown", (e) => {
  if (phase !== "play") { buildLevel(phase === "win" ? level + 1 : level); return; }
  const r = cv.getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width) * W;
  const y = ((e.clientY - r.top) / r.height) * H;
  const c = Math.floor((x - GRID_X0 + (PITCH - CELL) / 2) / PITCH);
  const rw = Math.floor((y - GRID_Y0 + (PITCH - CELL) / 2) / PITCH);
  tapTile(grid.get(K(c, rw)));
});
window.addEventListener("keydown", (e) => {
  if (e.key === "r" || e.key === "R") buildLevel(level);
  if (e.key === "n" || e.key === "N") buildLevel(level + 1);
});

buildLevel(Number(Q.get("level")) || 1);
fit();
requestAnimationFrame(function frame(now) {
  const dt = Math.min(50, now - (last || now));
  last = now;
  bot(now);
  step(now, dt);
  draw();
  requestAnimationFrame(frame);
});
    </script>
  </body>
