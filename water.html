//
//   bồn xếp nước thành LỚP theo thứ tự vào, cùng màu thì gộp lại
//   MỖI máng đang mở tự hút màu của nó ra khỏi bồn, nằm ở lớp nào cũng được
//   không màu nào trong bồn khớp máng nào = tắc; nước dâng quá 30 = tràn

// đáy". Bản trước chỉ cho rút lớp đáy và tắc ở 21/30 sau chín giây: một bình 9 đơn
// vị dồn xuống trong khi chỉ một máng cùng màu mở nhận được 3, sáu đơn vị còn lại
// chẹn đáy vĩnh viễn. Trên ray cũ chuyện đó không xảy ra được — viên không khớp
// chạy vòng tiếp, nó không chặn ai. Áp lực vì thế trở về đúng chỗ cũ: sức chứa 30.
//
// Toàn bộ file độc lập: không import gì, mở thẳng bằng browser cũng chạy.

d":"tile","color":6,"hidden":true},{"kind":"tile","color":5,"hidden":true},{"kind":"floor"},{"kind":"tile","color":6,"hidden":true},{"kind":"tile","color":5,"hidden":true},{"kind":"tile","color":4,"hidden":true},{"kind":"crate"},{"kind":"tile","color":3,"hidden":true},{"kind":"tile","color":5,"hidden":false},{"kind":"tile","color":1,"hidden":true},{"kind":"crate"},{"kind":"tile","color":2,"hidden":false},{"kind":"tile","color":1,"hidden":true},{"kind":"tile","color":2,"hidden":false},{"kind":"tile","color":1,"hidden":true},{"kind":"tile","color":3,"hidden":false},{"kind":"tile","color":4,"hidden":false},{"kind":"tile","color":3,"hidden":false},{"kind":"tile","color":5,"hidden":false},{"kind":"tile","color":1,"hidden":false},{"kind":"tile","color":1,"hidden":false}],"tag":"hard","columns":[[1,1,3,1,5,1,5,1,3,1,3,1,6,1,3,6,3,1,6,3,5,6,3,6,3,6,1],[3,6,1,6,3,4,2,5,1,5,2,1,4,1,3,2,5,1,6,5,5,4,2,6,1],[4,2,6,5,1,1,2,5,4,2,5,1,5,3,5,4,2,6,1],[3,1,3,6,4,2,5,1,5,2,1,4,2,5,1,6,3,5,4,2,6,5]],"refTaps":[24,18,25,27,12,21,20,26,28,13,7,14,8,7,2,29,9,10,11,16,4,22,23,3,17,7,0,11,6,11,7]}};
const LEVEL_MAX = Object.keys(HM).length;

// ── Layout ───────────────────────────────────────────────────────────────────
// Lưới lấy kích thước TỪ blueprint mỗi level — bàn của game cũ có bàn 4x5, bàn 6x6.
// Canh giữa theo bề ngang, ghim mép dưới cho hàng đáy luôn nằm ngay trên bồn.
const CELL = 56, PITCH = 62;
const GRID_BOTTOM = 442;
let GRID_COLS = 6, GRID_ROWS = 6, GRID_X0 = 0, GRID_Y0 = 100;
function layoutGrid(cols, rows) {
  GRID_COLS = cols; GRID_ROWS = rows;
  GRID_X0 = (W - cols * PITCH) / 2 + (PITCH - CELL) / 2;
  GRID_Y0 = GRID_BOTTOM - rows * PITCH;
}

// ⚠ **Bồn dựng ĐỨNG, dựa hẳn vào mép phải.** Nằm ngang thì nó cắt ngang màn hình và
// chia bàn cờ làm hai nửa rời nhau; dựng đứng thì cả khu dưới là một đường đi liền:
// chai trên rót sang phải vào bồn, ống dẫn vòng xuống trái, thanh phân phối xả xuống
// các cột. Người chơi đọc được đường đi của nước chỉ bằng cách nhìn.
//
// Cao 350px cho 30 đơn vị, tức gần 12px một đơn vị — gấp bốn lần lúc bồn còn nằm
// ngang. Từng đơn vị vào và ra giờ nhìn thấy được, không còn là một vệt nhích.
// ⚠ Hẹp 76 -> 68 và dời sang phải. Bồn đang là điểm hút mắt MẠNH NHẤT màn hình, nên
// thứ tự đọc thành bồn → kho chai → bàn cờ, trong khi bàn cờ mới là chỗ ra quyết
// định. Nó là chỉ báo tiến độ, không phải nhân vật chính.
const TANK = { x: 442, y: 458, w: 68, h: 350 };

// Thanh phân phối: nước từ bồn theo ống lên đây rồi xả xuống các cột ngay bên dưới.
const MANI = { x: 24, y: 470, w: 352, h: 26 };

const TR = { x0: 30, y0: 528, w: 82, gap: 6, h: 64, vgap: 12 };

// ⚠ Chỗ xén khu box: ba hàng ĐẦY ĐỦ, hàng thứ tư chỉ ló cái nắp.
//
// Vẽ trọn hàng thứ tư thì cột đọc thành "còn đúng bốn cái"; một cái nắp ló ra thì nó
// nói "còn nữa" mà không tốn một hàng và không bắt ai đọc badge. Cộng 4 chứ không
// phải 0: nắp cao 12px và nằm ở `y - 10`, nên cắt ở `y + 4` để lại đúng cái nắp cộng
// vài pixel vai. Đây thuần tuý là chỗ CẮT — `cols` vẫn giữ đủ số bình của cột.
const TR_CUT = TR.y0 + 3 * (TR.h + TR.vgap) + 4;

// ⚠ Đáy tủ TÍNH TỪ chỗ xén, không viết cứng. Lúc nó là một con số rời, mỗi lần đổi
// chiều cao chai lại để hở một mảng tủ trắng dài phía dưới giếng — trông như bàn cờ
// bị tụt lên trên. Buộc vào nhau thì không lệch lại được.
// Đáy tủ phải ôm cả cột máng LẪN cái bồn — bồn giờ cao hơn khu box, nên lấy cái nào
// thấp hơn thì tủ bị cắt ngang giữa bồn.
const MACH = { x: 14, y: 74, w: 512, h: Math.max(TR_CUT + 40, TANK.y + TANK.h + 24) - 74 };
H = MACH.y + MACH.h + 30;

const cellX = (c) => GRID_X0 + c * PITCH + CELL / 2;
const cellY = (r) => GRID_Y0 + r * PITCH + CELL / 2;
const trX = (i) => TR.x0 + i * (TR.w + TR.gap);
const spoutX = (i) => trX(i) + TR.w / 2;
const K = (c, r) => c + "," + r;

// ── State ────────────────────────────────────────────────────────────────────
let level, tiles, grid, cavity, cavitySet, tank, cols, streams, drops, flashes, slide;
let phase, stalledFor, shake, msg, overflow;
// Dòng chảy trong ống: `on` tắt dần sau mỗi lần rút, `color` là màu vừa đi qua.
let pipe = { on: 0, color: "cyan" };
// Hạt bắn ra lúc một chai đầy — chỉ là hình, không có luật nào đọc nó.
let sparks = [];
// Chai đã đầy đang bay lên kệ, và số thứ tự ô kệ tiếp theo.
let shelved = [], shelfN = 0;
let totalBoxes = 0;

// ⚠ Không còn hàm ngẫu nhiên nào trong file này, và đó là chủ ý. Bàn đọc thẳng từ
// blueprint — cùng level là cùng bàn, mọi lần, trên mọi máy. Thêm lại một `Math.
// random()` ở đâu đó là bắt đầu có bàn không lặp lại được, và một bàn không lặp lại
// được thì không debug được.

// ── Xây bàn ──────────────────────────────────────────────────────────────────

function newPot(color, cell) {
  return { color, units: JAR_UNITS, cell, tilt: 0, poured: 0 };
}

function place(tile) {
  tiles.push(tile);
  for (const [c, r] of tile.cells) grid.set(K(c, r), tile);
}

function buildLevel(lv) {
  level = Math.max(1, Math.min(LEVEL_MAX, lv));
  const bp = HM[level];
  layoutGrid(bp.cols, bp.rows);
  const colorOf = (i) => NAMES[i % NAMES.length];

  tiles = []; grid = new Map(); cavity = [];

  bp.cells.forEach((cell, i) => {
    const c = i % bp.cols, r = (i / bp.cols) | 0;
    // ⚠ `wall` KHÔNG vào khoang. Đó chính là thành máy: `cellFree` hỏi khoang, nên
    // ô tường không bao giờ là lối thoát, và `drawCavity` cũng không phủ sàn lên nó
    // — thân tủ lộ ra đúng chỗ đó. Một chỗ khai báo, cả luật lẫn hình đọc chung.
    if (cell.kind === "wall") return;
    cavity.push([c, r]);
    if (cell.kind === "floor") return;
    if (grid.has(K(c, r))) return;            // nửa sau của một tile nhiều ô

    if (cell.kind === "crate") { place({ kind: "crate", cells: [[c, r]] }); return; }

    if (cell.kind === "hatch") {
      // ⚠ **Hatch không còn là cái cửa nhả bình sang ô khác.** Nó là một CHỒNG bình
      // đứng ngay tại ô của nó: rót cái trước thì cái sau dâng lên đúng chỗ đó.
      //
      // Bỏ được luôn khái niệm hướng (`dir` của game cũ có up/down/left/right, và ô
      // nhận phải trống thì mới nhả được — hai thứ đó vừa phải giải thích vừa phải
      // canh). Và quan trọng hơn: cái chồng TỰ NÓI ra thứ mà cửa cuốn phải viết bằng
      // con số. Nhìn thấy ba lớp là biết ngay rót xong còn hai cái nữa.
      //
      // Về luật, nó chỉ là một bình bình thường — `canEscape`, nắp, bật nắp đều dùng
      // chung đường như mọi bình khác, không có nhánh riêng nào.
      const q = cell.queue.map(colorOf);
      const hq = cell.hiddenQ && cell.hiddenQ.length ? cell.hiddenQ.slice() : q.map(() => false);
      place({
        kind: "jar", cells: [[c, r]],
        pots: [newPot(q[0], [c, r])],
        queue: q.slice(1), hiddenQ: hq.slice(1),
        pouring: false, pourT: 0, hidden: !!hq[0],
      });
      return;
    }

    if (cell.kind === "choc") {
      // ⚠ Không bàn nào trong 20 level đầu có socola, nên nhánh này CHƯA được nhìn
      // thấy chạy. Giả định: ô này là góc trên-trái của khối 2x2, và `border < 0` là
      // ruy băng cầu vồng. Kiểm lại khi mở tới level đầu tiên thật sự có nó.
      const cs = [[c, r], [c + 1, r], [c, r + 1], [c + 1, r + 1]];
      place({
        kind: "lid", cells: cs, count: cell.need,
        ribbon: cell.border >= 0 ? colorOf(cell.border) : null,
        load: cell.under.map((u) => colorOf(u.color)),
      });
      return;
    }

    if (cell.kind === "tile") {
      // ⚠ `wide`/`mate` cũng chưa xuất hiện trong 20 bàn đầu. Đọc `mate` như "0 =
      // nửa trái, dựng cả cặp; khác 0 = nửa phải, bỏ qua" — cũng là một giả định.
      if (cell.wide && cell.mate) return;
      const cs = cell.wide ? [[c, r], [c + 1, r]] : [[c, r]];
      place({
        kind: cell.wide ? "pair" : "jar", cells: cs,
        pots: cs.map((cc) => newPot(colorOf(cell.color), cc)),
        pouring: false, pourT: 0, hidden: !!cell.hidden,
      });
    }
  });

  cavitySet = new Set(cavity.map(([c, r]) => K(c, r)));

  // ⚠ **Thứ tự box lấy từ blueprint, không sinh lại.** Bàn giải được hay không nằm
  // ở thứ tự này chứ không nằm ở cách xếp khay — chép vị trí khay rồi xáo lại box là
  // ra một bàn KHÁC, chỉ giống ở phần nhìn thấy được. Mỗi phần tử là MỘT box 3 chỗ,
  // và tổng của chúng khớp đúng số khay x 3.
  cols = bp.columns.map((col) => col.map((ci) => ({ color: colorOf(ci), filled: 0 })));
  // Tổng số chai phải làm đầy — mẫu số của thanh tiến độ trên HUD.
  totalBoxes = cols.reduce((n, c) => n + c.length, 0);

  tank = { layers: [], total: 0, wob: 0, wobPhase: 0 };
  streams = []; drops = []; flashes = []; sparks = []; shelved = []; shelfN = 0;
  slide = new Array(COLS).fill(0);
  phase = "play"; stalledFor = 0; shake = 0; msg = ""; overflow = null;
}

// ── Luật bàn ─────────────────────────────────────────────────────────────────

/**
 * Ô có phải lối thoát không.
 *
 * ⚠ **Ô ngoài khoang là THÀNH MÁY, không phải ô trống.** Đây là `walled` của game
 * cũ, và ghi chú ở đó gọi nó là luật thoát nhìn từ phía bên kia: một ô trống cạnh
 * khay là lối ra, còn vỏ máy thì không — nên cùng một hình bàn, chơi có thành và
 * chơi không thành là hai bài khác nhau, một bên bóc từ ngoài vào, một bên bóc từ
 * trong ra.
 *
 * Bản đầu bỏ mất vế này: `cellFree` chỉ hỏi "trong lưới và chưa có tile", nên mọi ô
 * ngoài khoang đều tính là lối ra. Hình vẽ đã có thành tủ trắng bao quanh khoang từ
 * trước, nên cái sai không nhìn ra được — nó chỉ khiến mọi bình ở rìa bàn rót được
 * miễn phí, tức là bàn không có thành. Hình nói một đằng, luật làm một nẻo.
 */
const cellFree = (c, r) =>
  c >= 0 && r >= 0 && c < GRID_COLS && r < GRID_ROWS &&
  cavitySet.has(K(c, r)) && !grid.has(K(c, r));

/**
 * Port thẳng `canEscape` trong src/game/logic.ts:
 *
 *   hàng đáy luôn được — nó nằm trên miệng phễu, rót thẳng xuống chứ không lách
 *   ngang trước;
 *   còn lại cần ÍT NHẤT MỘT ô kề trực giao đang TRỐNG.
 *
 * ⚠ **Mép bàn không tính là lối ra** (trừ hàng đáy). Khoang được vẽ hở xuống dưới
 * và bịt kín ba phía còn lại, nên một bình bị kẹp ba mặt là bị nhốt dù đứng sát mép.
 * Coi mép là lối ra thì mọi ô rìa được rót miễn phí và bốn góc của khối đặc mở ra
 * trong khi nhìn rõ là chúng không đi đâu được.
 *
 * ⚠ Đây **cũng là** phép thử lộ mặt của bình ẩn, và hai cái phải là MỘT phép thử —
 * ghi chú trong logic.ts kể chuyện level 38 ship lỗi vì tách chúng ra.
 */
function canEscape(t) {
  for (const [c, r] of t.cells) if (r === GRID_ROWS - 1) return true;
  for (const [c, r] of t.cells)
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc, nr = r + dr;
      if (t.cells.some(([a, b]) => a === nc && b === nr)) continue;
      if (cellFree(nc, nr)) return true;
    }
  return false;
}

const pourable = (t) => (t.kind === "jar" || t.kind === "pair") && !t.hidden && !t.pouring;
const liftable = (t) => pourable(t) && canEscape(t);

function tapTile(t) {
  if (phase !== "play" || !t) return;
  // ⚠ Chạm vào chai bị nhốt phải có phản hồi RIÊNG, không phải im lặng. Tài liệu xếp
  // "sai" ngang hàng với "đúng" trong P0, và đúng thế: im lặng thì người chơi không
  // biết mình bấm trượt hay game đơ. Rung ngang 2–3 nhịp, không cần mạnh hơn.
  if (!liftable(t)) {
    if (t.pots && !t.pouring) { t.nope = 1; sndNope(); }
    return;
  }
  // ⚠ Phản hồi chạm: bình nảy một nhịp rồi mới nghiêng. Không có nó thì trong 200ms
  // đầu — đúng khoảng thời gian ngón tay còn che mất cái bình — một cú chạm hợp lệ
  // và một cú chạm vào bình bị khoá phản hồi giống hệt nhau: không gì cả.
  t.tap = 1;
  // Tiếng rót hoãn lại đúng bằng thời gian bay: nước chưa chảy thì chưa có tiếng.
  setTimeout(() => sndPour((POUR_LEAD + JAR_UNITS * POUR_MS) / 1000), FLY_MS);
  t.pouring = true; t.pourT = 0;
  for (const p of t.pots) p.poured = 0;
}

/**
 * Bình rót xong.
 *
 * ⚠ Còn hàng đợi thì KHÔNG gỡ khỏi bàn — thay ruột tại chỗ và cái sau dâng lên. Gỡ
 * rồi đặt lại một tile mới sẽ làm ô trống đi một nhịp, và trong nhịp đó những bình
 * quanh nó tưởng như vừa có lối ra: nắp bật lên rồi đậy lại ngay. `locked` đặt về
 * `undefined` để lượt sau tính lại từ đầu mà không châm ngòi hiệu ứng bật nắp.
 */
function retire(t) {
  for (const p of t.pots) countTowardLids(p.color);
  if (t.queue && t.queue.length) {
    const color = t.queue.shift();
    const hid = t.hiddenQ && t.hiddenQ.length ? t.hiddenQ.shift() : false;
    t.pots = [newPot(color, t.cells[0])];
    t.hidden = !!hid;
    t.pouring = false;
    t.pop = 0;
    t.locked = undefined;
    return;
  }
  for (const [c, r] of t.cells) grid.delete(K(c, r));
  tiles = tiles.filter((x) => x !== t);
}

/**
 * Tấm socola: mỗi bình rót xong đúng màu ruy băng thì hạ số đếm một nấc. Về 0 thì
 * tấm vỡ và bốn bình dưới nó nhập bàn.
 *
 * ⚠ Ruy băng `null` là cầu vồng — màu nào cũng tính — y như `K.lidRibbon(null)` của
 * game cũ. Nó là LUẬT chứ không phải trang trí: ruy băng nói màu nào mở được tấm.
 */
function countTowardLids(color) {
  for (const t of tiles.slice()) {
    if (t.kind !== "lid" || t.count <= 0) continue;
    if (t.ribbon !== null && t.ribbon !== color) continue;
    t.count--;
    if (t.count > 0) continue;
    const cells = t.cells.slice(), load = t.load.slice();
    for (const [c, r] of cells) grid.delete(K(c, r));
    tiles = tiles.filter((x) => x !== t);
    flashes.push({ box: [cellX(cells[0][0]) - CELL / 2, cellY(cells[0][1]) - CELL / 2, PITCH + CELL, PITCH + CELL], color: t.ribbon ?? "cyan", t: 1 });
    cells.forEach(([c, r], i) => {
      if (i >= load.length) return;
      place({ kind: "jar", cells: [[c, r]], pots: [newPot(load[i], [c, r])], pouring: false, pourT: 0, hidden: false });
    });
  }
}

// ── Luật bồn ─────────────────────────────────────────────────────────────────

/**
 * Đổ một đơn vị vào bồn.
 *
 * ⚠ **Cùng màu thì gộp, nằm ở đâu cũng gộp — không chỉ gộp với lớp trên cùng.** Rót
 * cam, rồi vàng, rồi cam nữa, bản trước cho ra ba dải riêng; rót qua lại chục lần
 * thì bồn thành cái áo kẻ sọc và không đọc ra "đang giữ những màu gì" nữa.
 *
 * ⚠ Việc này chỉ ĐÚNG được vì luật rút đã đổi. Hồi bồn chỉ nhả được lớp đáy, thứ tự
 * các lớp CHÍNH LÀ luật — gộp lại là đổi bàn cờ. Giờ mỗi máng mở tự hút màu của nó
 * ra khỏi lớp bất kỳ, nên thứ tự không còn mang thông tin nào; giữ nó lại chỉ tổ
 * chia nhỏ màn hình. Nói cách khác: cái bồn từ một NGĂN XẾP thành một cái TÚI.
 */
function pushUnit(color) {
  const L = tank.layers.find((l) => l.color === color);
  if (L) L.units++;
  else tank.layers.push({ color, units: 1 });
  tank.total++;
  tank.wob = Math.min(1, tank.wob + 0.2);
  // Bồn giật một nhịp mỗi lần nhận nước — cùng thứ mà `wob` làm cho mặt nước, nhưng
  // cho cả cái bồn. Không có nó thì nước "xuất hiện" trong bồn chứ không "rơi vào".
  tank.jolt = Math.min(3, (tank.jolt || 0) + 1.6);
  if (tank.total > TANK_CAP) {
    phase = "lose"; msg = "TRÀN BỒN!"; shake = 1;
    // Màu nước tràn ra lấy từ chính các dải đang có, lớp trên trước — tràn là hậu
    // quả của thứ vừa rót vào, nên nó phải nhìn ra được điều đó. Tối đa 5 màu: nhồi
    // nhiều hơn vào một dải gradient thì dòng nước thành áo kẻ sọc.
    overflow = { t: 0, cols: tank.layers.map((L2) => L2.color).reverse().slice(0, 5) };
  }
}

const active = (i) => (cols[i].length ? cols[i][0] : null);

/** Bốc một đơn vị khỏi lớp `i`; lớp cạn thì bỏ, hai lớp cùng màu chạm nhau thì gộp. */
function takeUnit(i) {
  const L = tank.layers[i];
  L.units--; tank.total--;
  if (L.units > 0) return;
  // Không còn phải gộp hàng xóm: `pushUnit` đã gộp theo màu nên trong bồn không thể
  // tồn tại hai dải cùng màu.
  tank.layers.splice(i, 1);
}

/**
 * Mỗi máng đang mở tự hút màu của nó ra khỏi bồn, một đơn vị mỗi nhịp, bốn vòi
 * song song. Lấy từ lớp THẤP NHẤT có màu đó: nước sâu ra trước, mặt bồn hạ liên tục.
 */
function drain() {
  let moved = false;
  for (let i = 0; i < COLS; i++) {
    const t = active(i);
    if (!t) continue;
    const li = tank.layers.findIndex((L) => L.color === t.color);
    if (li < 0) continue;
    takeUnit(li);
    drops.push({ x: spoutX(i), y: MANI.y + MANI.h + 12, color: t.color, t: 0 });
    pipe.on = 1; pipe.color = t.color;
    t.filled++;
    sndDrip(t.filled / TROUGH_CAP);
    // ⚠ Đóng máng NGAY trong lượt rút, không hẹn giờ. Bản đầu shift qua setTimeout
    // 260ms trong khi nhịp rút là 110 — hai đơn vị nữa kịp rót vào máng đã đầy, nước
    // đó rời bồn mà không mở thêm máng nào, và tổng nước một màu tụt xuống dưới tổng
    // sức chứa máng màu đó: bàn thành KHÔNG THỂ giải. Cái đang tan là bóng ma.
    if (t.filled >= TROUGH_CAP) {
      flashes.push({ col: i, color: t.color, t: 1 });
      // Chai đầy thì bung hạt và kêu một tiếng. Chai vỡ là sự kiện DUY NHẤT trong ván
      // mà người chơi thật sự tiến được một bước — nó phải nghe và nhìn ra được, kể cả
      // khi mắt đang ở lưới trên.
      for (let s = 0; s < 12; s++) {
        const a = (s / 12) * Math.PI * 2 + Math.random() * 0.4;
        const v = 1.6 + Math.random() * 2.4;
        sparks.push({
          x: spoutX(i), y: TR.y0 + TR.h / 2, color: t.color,
          vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.2, t: 1,
        });
      }
      // ⚠ Chai đầy BAY LÊN KỆ chứ không tan tại chỗ. Cái kệ hai bên tủ vốn chỉ là hình
      // trang trí; cho chai đã xong bay lên đó thì nó thành chỗ CẤT THÀNH QUẢ, và người
      // chơi có một cái đếm tiến độ nhìn thấy được mà không cần thêm một con số nào.
      shelved.push({
        x0: spoutX(i), y0: TR.y0 + TR.h / 2, color: t.color,
        to: shelfSlot(shelfN++), t: 0,
      });
      sndClink();
      slide[i] = 1;
      cols[i].shift();
    }
    moved = true;
  }
  return moved;
}

/**
 * Chỗ nước tràn qua vành — góc dưới của miệng chai sau khi nghiêng.
 *
 * ⚠ Đọc `p.px/p.py` chứ không đọc ô của chai. Từ lúc có animation bay, chai không
 * còn đứng yên ở ô của nó trong lúc rót; tính miệng từ ô thì dòng nước bắn ra từ
 * chỗ cái chai vừa rời đi.
 */
function mouthOf(p) {
  const a = p.tilt * TILT_MAX;
  const x = p.px ?? cellX(p.cell[0]), y = p.py ?? cellY(p.cell[1]);
  const hx = 23, hy = 23;
  return { x: x + hx * Math.cos(a) + hy * Math.sin(a), y: y + hx * Math.sin(a) - hy * Math.cos(a) };
}

/** Chỗ chai bay tới để rót: lơ lửng ngay trên miệng bồn. */
function flyTarget(i) {
  return { x: TANK.x + TANK.w / 2 - 8 + i * 24, y: TANK.y - 64 };
}

// ── Loop ─────────────────────────────────────────────────────────────────────
let lastDrain = 0, last = 0;

function step(now, dt) {
  if (phase === "play") {
    // Bình ẩn lộ mặt bằng ĐÚNG phép thử của `liftable` — xem ghi chú ở `canEscape`.
    // ⚠ Lộ mặt là một KHOẢNH KHẮC, không phải một phép gán. Nó là lúc bàn cờ trả lời
    // một câu hỏi người chơi đang giữ trong đầu, nên phải có nhịp: chai nảy lên và loé
    // một cái. Đổi cờ lặng lẽ thì cái "?" biến thành màu giữa hai khung hình và không
    // ai kịp nhận ra bàn vừa mở ra thêm thông tin.
    for (const t of tiles) {
      if (!t.hidden || !canEscape(t)) continue;
      t.hidden = false;
      t.tap = 1;
      sndReveal();
    }

    // ⚠ **Bật nắp là một CHUYỂN TRẠNG THÁI, phải bắt ở đây chứ không tính lại khi
    // vẽ.** Hàm vẽ chạy mỗi khung hình và chỉ biết "lúc này khoá hay không"; cái
    // đáng xem là đúng khoảnh khắc nó thôi bị khoá, và khoảnh khắc đó chỉ tồn tại
    // giữa hai khung hình. Không lưu lại thì nắp biến mất trong một khung — người
    // chơi vừa rót xong ô bên cạnh, không nhìn về phía này, và không bao giờ biết
    // bàn vừa mở thêm đường nào.
    //
    // ⚠ Lượt đầu chỉ GHI trạng thái, không châm ngòi: nếu không thì mọi bình rót
    // được trên bàn cùng bật nắp một lượt ngay khi level mở ra.
    for (const t of tiles) {
      if (!t.pots) continue;
      const lk = !liftable(t) && !t.pouring && !t.hidden;
      if (t.locked === undefined) t.locked = lk;
      else if (t.locked && !lk) { t.pop = 1; t.locked = false; }
      else t.locked = lk;
    }

    for (const t of tiles.slice()) {
      if (!t.pots) continue;
      if (!t.pouring) {
        for (const p of t.pots) {
          p.tilt += (0 - p.tilt) * 0.18;
          p.px = cellX(p.cell[0]); p.py = cellY(p.cell[1]);
        }
        continue;
      }
      t.pourT += dt;
      // ⚠ **Bay trước, rót sau.** Chai rời ô của nó, vọt theo một vòng cung ra lơ lửng
      // trên miệng bồn, rồi mới nghiêng. Rót ngay tại ô thì dòng nước phải bắn ngang
      // 400px và người chơi phải TIN rằng nó tới được bồn; cho cái chai tự đi tới đó
      // thì không còn gì phải tin.
      //
      // ⚠ Vị trí ghi vào `p.px/p.py` ở ĐÂY, trong bước cập nhật, chứ không tính lại
      // lúc vẽ. `mouthOf` cũng đọc hai giá trị đó, nên miệng chai và dòng nước không
      // thể lệch nhau — mà lệch một khung hình là dòng nước rời khỏi cái chai.
      const fly = Math.min(1, t.pourT / FLY_MS);
      t.fly = fly;
      const e = fly * fly * (3 - 2 * fly);
      t.pots.forEach((p, i) => {
        const hx = cellX(p.cell[0]), hy = cellY(p.cell[1]);
        const d = flyTarget(i);
        p.px = hx + (d.x - hx) * e;
        p.py = hy + (d.y - hy) * e - Math.sin(Math.PI * e) * 34;
      });
      if (fly < 1) continue;
      for (const p of t.pots) p.tilt += (1 - p.tilt) * 0.16;
      const want = Math.min(JAR_UNITS, Math.floor((t.pourT - FLY_MS - POUR_LEAD) / POUR_MS));
      for (const p of t.pots) {
        while (p.poured < want && p.units > 0) {
          p.poured++; p.units--;
          const m = mouthOf(p);
          streams.push({ x0: m.x, y0: m.y, color: p.color, t: 0 });
          pushUnit(p.color);
        }
      }
      if (t.pots.every((p) => p.units <= 0)) { t.pouring = false; retire(t); }
    }

    if (now - lastDrain > DRAIN_MS) {
      lastDrain = now;
      // Bồn rỗng KHÔNG phải tắc: `drain` trả false cả khi không có gì để rút.
      const moved = drain();
      stalledFor = moved || tank.total === 0 ? 0 : stalledFor + DRAIN_MS;
    }

    const done = !tiles.some((t) => t.pots || t.kind === "lid");
    if (done && tank.total === 0) { phase = "win"; msg = "SẠCH BỒN!"; }
    else if (done && stalledFor > 900) { phase = "lose"; msg = "BỒN TẮC!"; }
  }

  tank.wob *= 0.94;
  tank.jolt = (tank.jolt || 0) * 0.82;
  tank.wobPhase += dt * 0.006;
  shake *= 0.9;
  for (const s of streams) s.t += dt / 300;
  streams = streams.filter((s) => s.t < 1);
  for (const d of drops) d.t += dt / 650;   // giọt rơi chậm theo nhịp rút
  drops = drops.filter((d) => d.t < 1);
  for (const f of flashes) f.t -= dt / CLEAR_MS;
  flashes = flashes.filter((f) => f.t > 0);
  for (let i = 0; i < COLS; i++) slide[i] = Math.max(0, slide[i] - dt / CLEAR_MS);
  if (overflow) overflow.t += dt / 1500;
  // ⚠ Tắt dần chậm hơn một nhịp rút (575ms), nên giữa hai đơn vị cái ống vẫn còn
  // nước — đúng như một cái ống thật đang chảy. Bằng đúng nhịp rút thì nó chớp tắt
  // theo từng đơn vị và đọc thành đèn nháy, không thành dòng chảy.
  pipe.on = Math.max(0, pipe.on - dt / 900);
  for (const s of sparks) {
    s.x += s.vx; s.y += s.vy; s.vy += 0.16; s.t -= dt / 620;
  }
  sparks = sparks.filter((s) => s.t > 0);
  for (const s of shelved) s.t += dt / 760;
  shelved = shelved.filter((s) => s.t < 1);
  for (const t of tiles) if (t.pop > 0) t.pop = Math.max(0, t.pop - dt / POP_MS);
  for (const t of tiles) if (t.tap > 0) t.tap = Math.max(0, t.tap - dt / 140);
  for (const t of tiles) if (t.nope > 0) t.nope = Math.max(0, t.nope - dt / 300);
}


// ── Âm thanh ─────────────────────────────────────────────────────────────────
//
// Tự tổng hợp bằng WebAudio, không nạp file nào — file này phải mở thẳng bằng
// browser là chạy được.
//
// ⚠ AudioContext bị chặn cho tới khi có tương tác thật, nên nó chỉ được tạo ở cú
// chạm đầu tiên. Tạo lúc tải trang thì nó nằm ở trạng thái "suspended" và nuốt im
// mọi tiếng động mà không báo gì.
let AC = null;
function audio() {
  if (AC) return AC;
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return null;
  AC = new C();
  return AC;
}

/** Nhiễu nâu — phổ nghiêng về trầm. Nhiễu trắng nghe ra tiếng xì hơi, không ra nước. */
function noiseBuf(dur) {
  const n = Math.max(1, Math.floor(AC.sampleRate * dur));
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < n; i++) {
    last = (last + (Math.random() * 2 - 1) * 0.09) * 0.985;
    d[i] = last * 3.2;
  }
  return buf;
}

/**
 * Một cái "bụp" — bọt nước vỡ.
 *
 * ⚠ **Cao độ đi LÊN, không đi xuống.** Đây là chỗ bản trước sai và là lý do nó
 * không ra tiếng nước: tôi cho sin trượt từ cao xuống thấp, mà cái đó tai nghe ra
 * "boop" của đồ chơi. Tiếng giọt nước thật là bọt khí đang co lại, tần số cộng
 * hưởng vì thế TĂNG rất nhanh trong khoảng 50ms. Đảo chiều cái ramp là gần như toàn
 * bộ khác biệt giữa "giọt nước" và "nốt nhạc".
 */
function blip(f, gain, t0) {
  const o = AC.createOscillator();
  const g = AC.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(f, t0);
  o.frequency.exponentialRampToValueAtTime(f * 2.4, t0 + 0.055);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.13);
  o.connect(g).connect(AC.destination);
  o.start(t0);
  o.stop(t0 + 0.15);
}

/**
 * Tiếng rót: một dòng nhiễu LIÊN TỤC dài bằng đúng cú rót, cộng bọt vỡ rải rác.
 *
 * ⚠ Bản trước là một đợt nhiễu 0,5 giây rồi thôi — mà cú rót kéo 1,6 giây, nên phần
 * lớn thời gian nước chảy trên hình thì loa im. Một dòng nước là âm thanh LIÊN TỤC;
 * cắt ngắn nó thì còn lại tiếng "xoẹt".
 *
 * ⚠ Bộ lọc phải rung. Bandpass đứng yên cho ra tiếng ồn trắng có màu; cho tần số
 * trung tâm dao động chậm quanh 900Hz thì mới thành tiếng dòng nước đang xoáy.
 */
function sndPour(dur) {
  const ac = audio();
  if (!ac) return;
  const t0 = ac.currentTime;
  const d = dur || 1.6;

  // Dòng nước: nhiễu nâu chạy suốt cú rót.
  const src = ac.createBufferSource();
  src.buffer = noiseBuf(d + 0.2);

  // ⚠ **Tần số cộng hưởng DÂNG DẦN suốt cú rót — đây mới là dấu hiệu "rót vào cốc".**
  // Cái cốc đầy lên thì cột không khí bên trên ngắn lại, nên cả tiếng nước lẫn tiếng
  // bọt đều cao dần. Bản trước giữ bandpass đứng ở 900Hz và chỉ cho nó rung quanh đó:
  // ra tiếng dòng nước chảy ngoài trời, không ra tiếng rót vào vật chứa. Cái RAMP này
  // gần như là toàn bộ khác biệt.
  const bp = ac.createBiquadFilter();
  bp.type = "bandpass";
  bp.frequency.setValueAtTime(520, t0);
  bp.frequency.exponentialRampToValueAtTime(1950, t0 + d);
  bp.Q.value = 1.6;
  // Rung nhẹ chồng lên cái ramp — dòng nước có xoáy, không phải một cái còi trượt.
  const lfo = ac.createOscillator();
  const lfoGain = ac.createGain();
  lfo.frequency.value = 6.5;
  lfoGain.gain.value = 200;
  lfo.connect(lfoGain).connect(bp.frequency);

  const hp = ac.createBiquadFilter();
  hp.type = "highpass";
  hp.frequency.value = 300;

  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.085, t0 + 0.1);
  g.gain.setValueAtTime(0.085, t0 + d - 0.22);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);

  src.connect(bp).connect(hp).connect(g).connect(ac.destination);
  lfo.start(t0); lfo.stop(t0 + d);
  src.start(t0); src.stop(t0 + d);

  // Bọt: dày và cao dần theo đúng cái ramp trên. Thưa bọt thì còn lại tiếng xì.
  for (let t = 0.08; t < d - 0.12; t += 0.055 + Math.random() * 0.075) {
    const k = t / d;
    blip(300 + k * 700 + Math.random() * 200, 0.02 + Math.random() * 0.018, t0 + t);
  }
  // Cú "ục" đầu tiên khi dòng nước chạm đáy cốc.
  blip(190, 0.05, t0 + 0.06);
}



/** Tiếng lộ mặt: một nốt ngắn đi lên — "à, ra là màu này". */
function sndReveal() {
  const ac = audio();
  if (!ac) return;
  const t0 = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(520, t0);
  o.frequency.exponentialRampToValueAtTime(1040, t0 + 0.12);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.05, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
  o.connect(g).connect(ac.destination);
  o.start(t0); o.stop(t0 + 0.22);
}
/** Tiếng "cụp" ngắn, trầm khi chạm vào chai chưa mở được. */
function sndNope() {
  const ac = audio();
  if (!ac) return;
  const t0 = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(230, t0);
  o.frequency.exponentialRampToValueAtTime(150, t0 + 0.09);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.05, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.13);
  o.connect(g).connect(ac.destination);
  o.start(t0); o.stop(t0 + 0.15);
}

/** Tiếng "cạch" thuỷ tinh khi một chai đầy — hai nốt ngắn, nốt trên lệch quãng năm. */
function sndClink() {
  const ac = audio();
  if (!ac) return;
  const t0 = ac.currentTime;
  for (const [f, g, d] of [[1180, 0.075, 0.16], [1760, 0.05, 0.12]]) {
    const o = ac.createOscillator();
    const gn = ac.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(f, t0);
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.exponentialRampToValueAtTime(g, t0 + 0.005);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(gn).connect(ac.destination);
    o.start(t0); o.stop(t0 + d + 0.02);
  }
}
/**
 * Một đơn vị nước rơi vào bình: cú va chạm ngắn cộng một cái bụp.
 *
 * ⚠ Cao độ đi theo `k` (bình đã đầy tới đâu). Bình càng đầy, khoảng không phía trên
 * càng ngắn, cao độ càng lên — đúng như rót vào chai thật, và nó là thông tin: nghe
 * là biết bình sắp đầy mà không cần rời mắt khỏi chỗ khác.
 */
function sndDrip(k) {
  const ac = audio();
  if (!ac) return;
  const t0 = ac.currentTime;
  const src = ac.createBufferSource();
  src.buffer = noiseBuf(0.05);
  const bp = ac.createBiquadFilter();
  bp.type = "bandpass";
  bp.frequency.value = 2300 + k * 260;
  bp.Q.value = 2.5;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.045, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
  src.connect(bp).connect(g).connect(ac.destination);
  src.start(t0); src.stop(t0 + 0.06);
  // ⚠ Chênh cao độ giữa các giọt kéo từ 420Hz xuống 130Hz. Ba nấc đầy nhau cách xa
  // quá thì ba giọt nghe thành ba âm thanh KHÁC NHAU, và tai đọc đó là ba sự kiện
  // khác loại. Còn 130 thì chúng vẫn là một tiếng giọt nước, chỉ nhích lên khi bình
  // gần đầy — đủ để nghe ra mà không phá mất tính đồng nhất.
  blip(500 + k * 130, 0.1, t0 + 0.005);
}
// ── Draw ─────────────────────────────────────────────────────────────────────
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

function rr(x, y, w, h, r) {
  const k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}

/**
 * Độ lệch cố định của từng ô: xoay 1–3°, phóng 97–103%.
 *
 * ⚠ Băm từ toạ độ ô, KHÔNG random. Một cái chai đổi độ nghiêng giữa hai khung hình
 * là cái chai đang rung; nó phải lệch một lần rồi giữ nguyên như thế cả ván. Cũng vì
 * vậy mà mọi lần vẽ lại cùng một bàn cho ra cùng một bố cục.
 *
 * ⚠ Lệch RẤT nhỏ. Cái cần phá là cảm giác "mọi vật dán lên lưới toạ độ", không phải
 * làm bàn cờ xộc xệch — quá 3° là bắt đầu đọc thành lỗi căn chỉnh.
 */
function jitter(c, r) {
  const h = ((c * 73856093) ^ (r * 19349663)) >>> 0;
  return {
    rot: (((h % 1000) / 1000) - 0.5) * 0.09,
    scale: 0.97 + ((h >>> 10) % 1000) / 1000 * 0.06,
  };
}
const fillRR = (x, y, w, h, r, s) => { rr(x, y, w, h, r); ctx.fillStyle = s; ctx.fill(); };

/**
 * Đường bao cái chai: cổ hẹp ở trên, hai VAI CONG trượt ra thân, đáy bo.
 *
 * ⚠ Hình chữ nhật bo góc không phải cái chai — nó là viên gạch có cái nút ở trên.
 * Thứ làm mắt đọc ra "chai" là chỗ chuyển từ cổ ra thân: một đoạn cong đổ xuống hai
 * bên. Đó là toàn bộ khác biệt, và nó nằm gọn trong hai đường bezier.
 *
 * Nhận nguyên hộp bao, nên gọi lại với hộp thụt vào là được cái chai nhỏ hơn đồng
 * dạng — dùng cho lòng chai mà không phải viết đường bao thứ hai.
 */
function bottlePath(bx, y, bw, bh) {
  const nw = Math.max(6, bw * 0.4);     // bề rộng cổ
  const nh = bh * 0.14;                 // cổ cao bấy nhiêu rồi mới loe
  const sh = bh * 0.24;                 // vai đổ hết trong bấy nhiêu
  const r = Math.min(11, bw * 0.24);    // bo đáy
  const cx = bx + bw / 2, nx = nw / 2;
  ctx.beginPath();
  ctx.moveTo(cx - nx, y);
  ctx.lineTo(cx - nx, y + nh);
  ctx.bezierCurveTo(cx - nx, y + nh + sh * 0.62, bx, y + nh + sh * 0.38, bx, y + nh + sh);
  ctx.lineTo(bx, y + bh - r);
  ctx.quadraticCurveTo(bx, y + bh, bx + r, y + bh);
  ctx.lineTo(bx + bw - r, y + bh);
  ctx.quadraticCurveTo(bx + bw, y + bh, bx + bw, y + bh - r);
  ctx.lineTo(bx + bw, y + nh + sh);
  ctx.bezierCurveTo(bx + bw, y + nh + sh * 0.38, cx + nx, y + nh + sh * 0.62, cx + nx, y + nh);
  ctx.lineTo(cx + nx, y);
  ctx.closePath();
}

/** Tối màu một hex đi `f` lần. Dùng khi cần một bậc đậm hơn `dark` của bảng màu. */

/**
 * Bọt khí nổi lên trong một cột nước.
 *
 * ⚠ Không lưu trạng thái, tính thẳng từ đồng hồ: mỗi bọt là một pha `(t/chu kỳ + lệch)`
 * lấy phần thập phân. Nuôi một mảng hạt cho việc này thì phải sinh, phải huỷ, phải
 * dọn khi mực nước tụt — mà cái nhìn thấy được y hệt.
 *
 * ⚠ Vẽ trong vùng CÓ NƯỚC thôi, và mờ dần khi gần mặt: bọt vỡ ở mặt nước chứ không
 * đi xuyên qua. Bỏ đoạn mờ đó thì chúng đọc thành chấm trắng trôi trên không.
 */
function bubbles(x, w, top, bot, n, seed, speed) {
  const now = performance.now();
  ctx.fillStyle = "#ffffff";
  for (let i = 0; i < n; i++) {
    const k = (i * 2.3 + seed) % 1;
    const ph = ((now / speed + k * 1.7) % 1);
    const by = bot - ph * (bot - top);
    if (by < top + 2) continue;
    const r = 1.3 + ((i * 7 + seed * 13) % 5) * 0.42;
    const near = Math.min(1, (by - top) / 22);
    ctx.globalAlpha = 0.42 * near;
    ctx.beginPath();
    ctx.arc(x + 5 + ((i * 37 + seed * 61) % Math.max(1, w - 10)), by, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  return "rgb(" + Math.round(((n >> 16) & 255) * f) + "," +
    Math.round(((n >> 8) & 255) * f) + "," + Math.round((n & 255) * f) + ")";
}

function waterTop(x, w, y, amp, ph) {
  ctx.moveTo(x, y);
  for (let i = 0; i <= 24; i++) {
    const t = i / 24;
    ctx.lineTo(x + t * w, y + Math.sin(ph + t * 7.5) * amp);
  }
}

/** Thân tủ: bóng đổ, mép, thân, gờ sáng trên nắp. Đúng bốn lớp của `buildMachine`. */
/**
 * Một chai nhỏ trên kệ tủ. Chỉ là hình trang trí — không tile, không luật.
 *
 * ⚠ Vẽ RẤT nhạt và đặt sau lớp thân tủ, trước lớp khoang. Nó phải nói "cái tủ này
 * đựng đầy bình nước" trong một cái liếc, rồi im hẳn: mọi thứ trên bàn cờ đều là
 * bình nước, nên một cái chai vẽ đậm ở rìa màn hình là một cái bình người chơi sẽ
 * thử bấm vào.
 */
function shelfBottle(x, y, color) {
  const p = PAL[color];
  ctx.globalAlpha = 0.22;
  fillRR(x - 3, y - 7, 6, 7, 2, p.dark);
  fillRR(x - 8, y, 16, 24, 5, "#ffffff");
  ctx.globalAlpha = 0.32;
  fillRR(x - 6, y + 9, 12, 13, 3, p.base);
  ctx.globalAlpha = 0.3;
  ctx.strokeStyle = p.dark; ctx.lineWidth = 1;
  rr(x - 8, y, 16, 24, 5); ctx.stroke();
  ctx.globalAlpha = 1;
}

/**
 * Ô kệ thứ `n` trên hai giá bên hông tủ — chỗ một chai đã đầy bay tới.
 *
 * ⚠ Toạ độ ở đây phải khớp với `drawRacks`. Hai chỗ cùng đọc một hình mà tính riêng
 * thì sớm muộn chai sẽ đáp xuống bên cạnh cái kệ.
 */
function shelfSlot(n) {
  const side = n % 2;
  const k = (n / 2) | 0;
  const row = k % 5;
  const col = ((k / 5) | 0) % 2;
  const x = side ? MACH.x + MACH.w - 76 : MACH.x + 12;
  return { x: x + (col ? 46 : 16), y: MACH.y + 34 + row * 54 + 6 };
}

/**
 * Hai giá kệ dọc hai bên khoang, mỗi tầng vài chai — cái tủ chứa bình nước.
 *
 * ⚠ Cắt theo thân tủ và vẽ TRƯỚC khoang. Bàn cờ rộng hẹp tuỳ level, nên kệ và
 * khoang chắc chắn có lúc chồng lên nhau; để khoang phủ lên trên là cách duy nhất
 * không phải tính lại chỗ đặt kệ theo từng bàn.
 */
function drawRacks() {
  // ⚠ Nhạt hẳn xuống 0.42. Hai giá này là TRANG TRÍ, mà ở độ đậm cũ chúng hút mắt
  // ngang với bàn cờ — nhận xét gọi đúng: màn hình đọc thành "một nhà máy rất nhiều
  // chai" thay vì "bàn cờ, kho chai, cái bồn". Thứ tự phải là board rõ nhất.
  ctx.save();
  ctx.globalAlpha = 0.42;
  rr(MACH.x, MACH.y, MACH.w, MACH.h, 38); ctx.clip();
  const top = MACH.y + 34, bot = TANK.y - 34;
  for (const side of [0, 1]) {
    const x = side ? MACH.x + MACH.w - 76 : MACH.x + 12;
    ctx.globalAlpha = 0.55;
    fillRR(x - 4, top - 10, 72, bot - top + 14, 8, "#8a5b30");
    fillRR(x - 1, top - 7, 66, bot - top + 8, 6, "#a97544");
    ctx.globalAlpha = 0.42;
    let n = side * 3;
    for (let sy = top; sy + 40 < bot; sy += 54) {
      shelfBottle(x + 16, sy + 6, NAMES[n++ % 8]);
      shelfBottle(x + 46, sy + 6, NAMES[n++ % 8]);
      // Mặt kệ, và một vạch tối mỏng dưới nó cho có bề dày.
      // Mặt kệ gỗ, có cạnh sáng ở trên và bóng ở dưới.
      ctx.globalAlpha = 0.55;
      fillRR(x - 4, sy + 31, 72, 6, 2, "#c08a4e");
      fillRR(x - 4, sy + 31, 72, 2, 1, "#dcae76");
      fillRR(x - 4, sy + 37, 72, 3, 1.5, "#6d451f");
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

function drawMachine() {
  const m = MACH;
  fillRR(m.x - 8, m.y + 12, m.w + 16, m.h, 44, "rgba(37,35,80,0.35)");
  fillRR(m.x - 4, m.y + 6, m.w + 8, m.h, 40, UI.machineEdge);
  fillRR(m.x, m.y, m.w, m.h, 38, UI.machine);
  drawRacks();
  // Một vệt sáng dọc mép trên — đọc thành cạnh nhựa đúc, và nó là thứ duy nhất nói
  // cái tủ có bề dày.
  fillRR(m.x + 14, m.y + 7, m.w - 28, 12, 6, "rgba(255,255,255,0.5)");
}

/**
 * Khoang lõm dưới lưới: vành slate rồi sàn trắng, mỗi lớp là MỘT `fill()` cho tất
 * cả các ô.
 *
 * ⚠ Fill riêng từng ô thì chỗ hai ô chồng nhau bị tô hai lượt và với màu có alpha
 * đó là một lưới ô bàn cờ hiện giữa khoang; stroke từng ô thì vẽ ra đúng những
 * đường ghép mà cách này xoá đi. Và phải có cầu nối, nếu không chỗ bốn ô gặp nhau
 * thủng một lỗ hình thoi cho thân tủ lọt qua.
 */
function fillCells(inset, radius, style, pad = 0) {
  const has = new Set(cavity.map(([c, r]) => K(c, r)));
  ctx.beginPath();
  for (const [c, r] of cavity) {
    const x = cellX(c) - CELL / 2 - inset, y = cellY(r) - CELL / 2 - inset;
    const w = CELL + inset * 2, h = CELL + inset * 2;
    const k = Math.min(radius, w / 2, h / 2);
    ctx.moveTo(x + k, y);
    ctx.arcTo(x + w, y, x + w, y + h, k);
    ctx.arcTo(x + w, y + h, x, y + h, k);
    ctx.arcTo(x, y + h, x, y, k);
    ctx.arcTo(x, y, x + w, y, k);
    ctx.closePath();
  }
  // ⚠ Cầu nối chỉ được nới rộng DỌC THEO KHE, còn bề ngang phải khớp đúng ô — cộng
  // `pad`, và `pad` chỉ khác 0 ở lớp trong. Bản đầu nới cả hai phương ở cả hai lớp,
  // nên cầu của lớp vành (inset 8) thò ra xa hơn sàn khoang (inset 3) và để lại một
  // mẩu slate nhô ra ở mỗi mối nối — trông như mấy cái chấm bẩn rải đều giữa khoang.
  // Lớp trong lấy pad 4 để bịt lỗ hình thoi mà vẫn nằm gọn trong vành.
  const gap = PITCH - CELL;
  for (const [c, r] of cavity) {
    const x = cellX(c) - CELL / 2, y = cellY(r) - CELL / 2;
    const e = inset + pad;
    if (has.has(K(c + 1, r))) ctx.rect(x + CELL - 2, y - e, gap + 4, CELL + e * 2);
    if (has.has(K(c, r + 1))) ctx.rect(x - e, y + CELL - 2, CELL + e * 2, gap + 4);
  }
  ctx.fillStyle = style;
  ctx.fill();
}

function drawCavity() {
  fillCells(8, 21, UI.panelDeep, 0);
  fillCells(3, 17, UI.panel, 4);
  // ⚠ Vành phải NGẮT ở hàng đáy. Hàng đáy nằm trên miệng phễu — `canEscape` cho nó
  // thoát vô điều kiện chính vì thế — nên vẽ viền chắn ngang dưới nó là hình nói
  // ngược lại luật: người chơi thấy chai bị bịt kín mà bấm vào thì nó vẫn rót.
  for (const [c, r] of cavity) {
    if (r !== GRID_ROWS - 1) continue;
    const x = cellX(c) - CELL / 2 - 3;
    const y = cellY(r) + CELL / 2 - 8;
    ctx.fillStyle = UI.panel;
    ctx.fillRect(x, y, CELL + 6, TANK.y - 12 - y);
  }

  // ⚠ **Mặt kệ, không phải ô vuông rời.** Bản trước vẽ mỗi ô trống một hình vuông bo
  // góc riêng, và cả lưới đọc thành block puzzle — chai nằm TRÊN các tile, không nằm
  // TRONG một cái giá. Nhận xét gọi đúng tên: nó giống Tetris. Thay bằng một vạch kệ
  // chạy suốt mỗi hàng: cùng lượng thông tin (hàng nào có chỗ), mà ngôn ngữ hình là
  // "giá chứa chai" chứ không phải "lưới ô".
  const rows = new Map();
  for (const [c, r] of cavity) {
    const e = rows.get(r) ?? { min: c, max: c };
    rows.set(r, { min: Math.min(e.min, c), max: Math.max(e.max, c) });
  }
  for (const [r, e] of rows) {
    const x0 = cellX(e.min) - CELL / 2 + 1;
    const x1 = cellX(e.max) + CELL / 2 - 1;
    const y = cellY(r) + CELL / 2 - 5;
    fillRR(x0, y, x1 - x0, 5, 2.5, "rgba(190,156,104,0.42)");
    fillRR(x0, y, x1 - x0, 2, 1, "rgba(255,255,255,0.85)");
  }
}

function drawPot(p, locked, hidden, pop, tap, nope) {
  const bw = 46, bh = 54;
  // Vẽ tại vị trí `step` vừa tính — trong lúc bay, chai không còn ở ô của nó.
  const y = p.py ?? cellY(p.cell[1]);
  let x = p.px ?? cellX(p.cell[0]);
  // Rung ngang khi bị từ chối: ba nhịp, biên độ tắt dần trong 300ms.
  //
  // ⚠ Chỉ lệch chỗ VẼ, không đụng `p.px`. `mouthOf` đọc `p.px`, nên rung vào đó là
  // rung luôn cả dòng nước của một cú rót khác đang diễn ra — mà một chai bị từ chối
  // thì đang không rót gì cả, nên lỗi ấy sẽ không lộ ra cho tới đúng lúc nó lộ ra.
  if (nope > 0) x += Math.sin(nope * Math.PI * 6) * nope * 7;
  if (tap > 0) {
    // Vòng sáng lan ra từ chính cái bình vừa chạm — nó nói "đã nhận", ở đúng chỗ ngón
    // tay vừa rời đi.
    const k = 1 - tap;
    ctx.globalAlpha = tap * 0.5;
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3 * tap + 1;
    rr(x - bw / 2 - 4 - k * 14, y - bh / 2 - 4 - k * 14, bw + 8 + k * 28, bh + 8 + k * 28, 16 + k * 8);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Bóng đổ mềm dưới đáy chai — thứ đặt nó ĐỨNG TRÊN sàn khoang thay vì trôi trên đó.
  ctx.globalAlpha = 0.16;
  ctx.fillStyle = "#7a5a30";
  ctx.beginPath(); ctx.ellipse(x + 1, y + bh / 2 - 1, bw * 0.36, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  const j = jitter(p.cell[0], p.cell[1]);
  ctx.save();
  ctx.translate(x, y);
  // Tap phóng 1.06 trong ~130ms, đúng khoảng tài liệu đề nghị. 1.11 như trước đọc
  // thành cái chai nảy dựng lên, không thành "đã nhận cú chạm".
  const s = (1 + tap * 0.06) * j.scale;
  ctx.scale(s, s);
  ctx.rotate(p.tilt * TILT_MAX + (1 - Math.min(1, p.tilt * 3)) * j.rot);
  ctx.translate(-bw / 2, -bh / 2);

  // ⚠ Cùng `bottlePath` với chai ở khu máng — cổ hẹp, hai vai cong trượt ra thân. Hai
  // khu phải là MỘT họ hình: cái ở trên rót ra, cái ở dưới hứng vào, và người chơi
  // đọc cả hai bằng cùng một thói quen. Chữ nhật bo góc ở trên với chai có vai ở dưới
  // là hai đồ vật khác nhau bị bắt làm cùng một việc.
  //
  // Cổ chỉ nhô 9px: ô cách nhau 62 mà thân cao 54, khe dọc chỉ 8px — cổ dài hơn thế
  // là thò lên đè vào đáy chai hàng trên, và hai cái đọc thành một cặp bị nối ống.
  // ⚠ Nút BẦN, không phải cổ thuỷ tinh trắng. Chai trên đã nói màu bằng chính chất
  // lỏng nhìn xuyên qua, nên cái nút được rảnh tay để làm chất liệu — và một nút bần
  // nâu là thứ kéo cả cụm ra khỏi tông "thiết bị" sang tông "lọ thuốc". Chai dưới thì
  // ngược lại: lúc rỗng nó không có gì nói màu ngoài cái nắp, nên nắp ở đó phải giữ màu.
  fillRR(bw / 2 - 9, -10, 18, 15, 4, "#c08a4e");
  fillRR(bw / 2 - 9, -10, 18, 6, 3, "#d9a469");
  ctx.strokeStyle = "rgba(120,80,38,0.55)"; ctx.lineWidth = 1.6;
  rr(bw / 2 - 9, -10, 18, 15, 4); ctx.stroke();
  // ⚠ Chai ẩn vẫn là CÁI CHAI, chỉ là chưa biết màu — thân trắng như mọi chai khác,
  // lòng phủ một lớp kính mờ. Tô đặc một khối xám thì nó đọc thành viên gạch chặn
  // đường, tức là nhầm sang loại vật khác hẳn: người chơi tưởng nó là vật cản chứ
  // không phải một chai sắp lộ mặt.
  bottlePath(0, 0, bw, bh);
  ctx.fillStyle = "rgba(255,255,255,0.72)";
  ctx.fill();
  if (hidden) {
    bottlePath(3, 3, bw - 6, bh - 6);
    ctx.fillStyle = "#e2d3b4"; ctx.fill();
  }

  if (!hidden && p.units > 0) {
    ctx.save();
    bottlePath(2, 2, bw - 4, bh - 4); ctx.clip();
    // ⚠ Mặt nước phải NẰM NGANG so với màn hình, không nghiêng theo bình — trong một
    // cái bình trong suốt thì nước dán vào thành là thứ mắt bắt ngay. Xoay ngược lại
    // đúng góc nghiêng trước khi đổ.
    const a2 = p.tilt * TILT_MAX;
    ctx.translate(bw / 2, bh / 2);
    ctx.rotate(-a2);
    const pal = PAL[p.color];
    const top = bh / 2 - (p.units / JAR_UNITS) * (bh - 8) * (1 - 0.28 * Math.sin(a2));
    const g = ctx.createLinearGradient(0, top, 0, bh);
    g.addColorStop(0, pal.light); g.addColorStop(0.4, pal.base); g.addColorStop(1, pal.dark);
    ctx.fillStyle = g;
    ctx.beginPath();
    waterTop(-bw, bw * 3, top, 2.2, x * 0.05 + performance.now() * 0.004);
    ctx.lineTo(bw * 2, bh * 2); ctx.lineTo(-bw, bh * 2); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Viền dày lên 2 -> 2.7: tài liệu đề nghị +20–35%, và nó là thứ tách chai khỏi sàn
  // khoang trắng mà không phải thêm bóng.
  ctx.strokeStyle = locked ? "rgba(120,86,46,0.8)" : "rgba(150,110,66,0.75)";
  ctx.lineWidth = 2.7;
  bottlePath(0, 0, bw, bh); ctx.stroke();
  fillRR(7, 8, 5, bh - 20, 2.5, "rgba(255,255,255,0.5)");

  if (hidden) {
    ctx.fillStyle = "#fdf6e6";
    ctx.font = "700 30px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("?", bw / 2, bh / 2);
    ctx.textBaseline = "alphabetic";
  } else if (locked || pop > 0) {
    // ⚠ Bình bị nhốt phải NHÌN RA ĐƯỢC, không chỉ là bấm không ăn. Game cũ nói điều
    // đó bằng trứng nổi-hay-lép; bình không có trứng nên lời hứa chuyển sang cái NẮP.
    // Nắp chứ không phải làm mờ: mờ đọc thành "ô hỏng", nắp đọc thành "đậy, mở sau".
    //
    // `pop` chạy 1 -> 0 sau khi bình hết bị chắn. `k` là 0 khi còn đậy và 1 khi nắp
    // đã bay hẳn đi, nên hai trạng thái dùng CHUNG một hình vẽ — nắp lúc đậy và nắp
    // lúc bay không thể lệch nhau, vì chúng là một.
    const k = locked ? 0 : 1 - pop;
    // ⚠ **Ba nhịp, không phải một cú trượt.** Bản trước chỉ dịch nắp lên rồi mờ đi,
    // nên nó đọc thành "cái nắp tan biến" chứ không thành "cái nắp bị bật ra". Cái
    // làm nên chữ BẬT là:
    //   1. bung lên nhanh trong ba phần mười đầu rồi rơi lại — một parabol có đỉnh
    //      hẳn hoi, chứ không phải đường thẳng;
    //   2. xoay đủ nhiều để thấy nó lộn (2.6 rad, không phải 1.5 — dưới một vòng
    //      phần tư thì mắt đọc là nghiêng, không đọc là lộn);
    //   3. một luồng hơi bật ra ở cổ đúng lúc nó rời chỗ, vì cái thứ đẩy nắp đi phải
    //      nhìn thấy được, nếu không thì nắp tự nhiên bay.
    const lift = k * (58 - 46 * k);
    const bounce = 1 + 0.18 * Math.sin(Math.PI * Math.min(1, k * 1.6));
    if (!locked && pop > 0.45) {
      // Luồng hơi: bốn chấm toả ra từ miệng cổ, sống ngắn hơn cái nắp nhiều.
      const puff = (0.45 - (pop - 0.45)) / 0.45;
      ctx.save();
      ctx.globalAlpha = Math.max(0, (pop - 0.45) / 0.55) * 0.75;
      ctx.fillStyle = "#ffffff";
      for (let i = 0; i < 4; i++) {
        const a = -Math.PI / 2 + (i - 1.5) * 0.5;
        const d = 6 + puff * 16;
        ctx.beginPath();
        ctx.arc(bw / 2 + Math.cos(a) * d, -8 + Math.sin(a) * d * 0.6, 3 - puff * 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha = locked ? 1 : Math.min(1, pop * 1.7);
    ctx.translate(bw / 2 + k * 19, -7 - lift);
    ctx.rotate(k * 2.6);
    ctx.scale(bounce, bounce);
    fillRR(-13, -7, 26, 13, 4, "#5f4426");
    fillRR(-13, -7, 26, 6, 3, "#8a6538");
    // Mặt dưới nắp: chỉ thấy được khi nó đã lộn, và chính nó nói cho mắt biết là
    // đang nhìn một vật thể lật chứ không phải một hình phẳng trôi đi.
    ctx.globalAlpha *= Math.max(0, Math.sin(k * 2.6) );
    fillRR(-13, 3, 26, 3, 1.5, "#3f4a66");
    ctx.restore();
    ctx.restore();
    // Màng tối trong bình tan cùng nhịp, nếu không thì nắp bay đi mà cái bình vẫn
    // xám — vẫn đọc là chưa mở được.
    ctx.globalAlpha = locked ? 1 : pop;
    bottlePath(2, 2, bw - 4, bh - 4);
    ctx.fillStyle = "rgba(86,64,34,0.30)"; ctx.fill();
    ctx.globalAlpha = 1;
    if (!locked) {
      // Một loé trắng trên thân, để "vừa mở được" bắt được mắt kể cả khi người chơi
      // đang nhìn chỗ khác trên bàn.
      ctx.globalAlpha = pop * 0.55;
      bottlePath(0, 0, bw, bh);
      ctx.fillStyle = "#ffffff"; ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

/** Kẹp giữ hai nửa bình đôi — vẽ riêng ở giữa, không nướng vào mặt bình. */
function drawClip(t) {
  const [a, b] = t.cells;
  const x = (cellX(a[0]) + cellX(b[0])) / 2, y = cellY(a[1]);
  fillRR(x - 11, y - 15, 22, 30, 7, UI.machineEdge);
  fillRR(x - 9, y - 13, 18, 23, 5, "#ffffff");
  fillRR(x - 5, y - 7, 10, 14, 3, UI.panelDeep);
}
/**
 * Ô chặn: một khối thép bắt bulông xuống sàn khoang.
 *
 * ⚠ Đổi từ thùng gỗ nâu sang thép, vì tông nâu đất là thứ DUY NHẤT trên màn hình
 * không thuộc bảng màu nào — không phải màu bình, không phải tông máy. Nó là di sản
 * của game cũ, nơi cả cabinet là nhựa trắng và gỗ mới là "vật liệu khác".
 *
 * ⚠ Nhưng vẫn phải KHÁC HẲN cái bình, không được đẹp lên thành một mảnh trang trí.
 * Ghi chú ở `K.crate` của game cũ gọi nó là thứ duy nhất trên bàn người chơi không
 * làm gì được, và cách nó nói điều đó là bằng chất liệu. Thép bắt bulông, đặc, không
 * có nước bên trong, không có nắp — ba dấu hiệu ngược hẳn với mọi thứ rót được.
 */
function drawCrate(t) {
  const [c, r] = t.cells[0];
  const x = cellX(c) - CELL / 2, y = cellY(r) - CELL / 2;
  const s = CELL;
  fillRR(x + 2, y + 5, s - 4, s - 5, 10, "#463522");
  const g = ctx.createLinearGradient(0, y, 0, y + s);
  g.addColorStop(0, "#9c8465");
  g.addColorStop(0.55, "#7b6446");
  g.addColorStop(1, "#5f4a30");
  fillRR(x + 2, y + 2, s - 4, s - 8, 10, g);
  // Nẹp chéo, chìm vào mặt thép.
  ctx.save();
  rr(x + 4, y + 4, s - 8, s - 12, 8); ctx.clip();
  ctx.strokeStyle = "rgba(38,46,66,0.55)"; ctx.lineWidth = 8; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x + 6, y + 6); ctx.lineTo(x + s - 6, y + s - 12);
  ctx.moveTo(x + s - 6, y + 6); ctx.lineTo(x + 6, y + s - 12);
  ctx.stroke();
  ctx.strokeStyle = "rgba(190,203,228,0.35)"; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 6, y + 4); ctx.lineTo(x + s - 6, y + s - 14);
  ctx.moveTo(x + s - 6, y + 4); ctx.lineTo(x + 6, y + s - 14);
  ctx.stroke();
  ctx.restore();
  // Bốn con bulông — thứ nói "bắt chặt xuống", không phải "đang nằm đó".
  for (const [bx, by] of [[11, 11], [s - 11, 11], [11, s - 17], [s - 11, s - 17]]) {
    ctx.fillStyle = "rgba(30,38,56,0.5)";
    ctx.beginPath(); ctx.arc(x + bx, y + by + 1, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e0cba4";
    ctx.beginPath(); ctx.arc(x + bx, y + by, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#78859f";
    ctx.beginPath(); ctx.arc(x + bx + 0.4, y + by + 0.4, 1.4, 0, Math.PI * 2); ctx.fill();
  }
}

/**
 * Các lớp bình đứng SAU cái đang rót được — phần nhìn thấy của hàng đợi.
 *
 * ⚠ Vẽ dâng lên phía trên và thu nhỏ dần, chứ không xếp ngang. Xếp ngang thì nó đọc
 * thành mấy cái bình khác nhau cùng nằm trong một ô, và người chơi sẽ thử bấm vào
 * từng cái. Xếp chồng lùi về sau chỉ có một nghĩa: cùng một chỗ, đến lượt sau.
 *
 * ⚠ Không tô màu — chỉ là bóng bình trắng xám. Cái chồng này để nói CÒN BAO NHIÊU,
 * không phải còn màu gì; đúng bằng lượng thông tin cái cửa cuốn cũ đưa ra bằng một
 * con số. Tô màu là làm bàn dễ đi, và đó là một quyết định luật, không phải hình.
 */
function drawQueue(t) {
  if (!t.queue || !t.queue.length) return;
  const [c, r] = t.cells[0];
  const x = cellX(c), y = cellY(r);
  const n = Math.min(2, t.queue.length);
  for (let i = n; i >= 1; i--) {
    // ⚠ Lệch lên 9px một lớp và chỉ thu hẹp 5px. Bản đầu lệch 7 và thu 7, nên lớp sau
    // nằm gọn trong bóng của lớp trước và không thấy gì cả — cái chồng chỉ đọc được
    // nếu VAI của bình sau nhô ra hai bên cái nắp của bình trước.
    const bw = 46 - i * 5, bh = 54 - i * 5;
    const oy = y - 2 - i * 9;
    ctx.globalAlpha = 0.9 - i * 0.2;
    fillRR(x - bw / 2, oy - bh / 2, bw, bh, 11, "#f8eeda");
    ctx.strokeStyle = "rgba(160,120,72,0.55)"; ctx.lineWidth = 1.4;
    rr(x - bw / 2, oy - bh / 2, bw, bh, 11); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (t.queue.length > 2) {
    // Quá hai lớp thì chồng thêm không đọc ra được nữa — nói bằng số.
    ctx.fillStyle = UI.ink;
    ctx.font = "700 13px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("+" + t.queue.length, x + 20, y - CELL / 2 - 2);
  }
}

/**
 * Tấm socola: khối 2x2 với hai dải ruy băng bắt chéo và một mặt đồng hồ đếm.
 *
 * ⚠ Vẽ là **socola**, không phải tấm chrome. Ghi chú ở `K.lid` của game cũ kể rằng
 * bản chrome đọc thành một mảnh của chính cái tủ — một tấm panel tình cờ có số trên
 * đó — chứ không thành một vật ĐANG NẰM CHẶN trên bàn. Mọi vật cản khác nói mình là
 * gì bằng chất liệu, cái này cũng phải thế.
 */
function drawLid(t) {
  const [c, r] = t.cells[0];
  const x = cellX(c) - CELL / 2, y = cellY(r) - CELL / 2;
  const w = PITCH + CELL, h = PITCH + CELL;
  fillRR(x + 2, y + 6, w - 4, h - 6, 16, "#3d2412");
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "#8a5a2f"); g.addColorStop(1, "#5d3618");
  fillRR(x + 2, y + 2, w - 4, h - 10, 16, g);

  const RIB = 18;
  const band = (bx, by, bw, bh) => {
    if (t.ribbon === null) {
      // Cầu vồng: chạy hết bảng màu dọc theo dải, để "màu nào cũng tính" đọc được
      // mà không cần chú thích.
      const along = bw > bh;
      const lg = ctx.createLinearGradient(bx, by, along ? bx + bw : bx, along ? by : by + bh);
      NAMES.forEach((n, i) => lg.addColorStop(i / (NAMES.length - 1), PAL[n].base));
      ctx.fillStyle = lg;
    } else ctx.fillStyle = PAL[t.ribbon].base;
    ctx.fillRect(bx, by, bw, bh);
  };
  band(x + (w - RIB) / 2, y, RIB, h - 8);
  band(x, y + (h - RIB) / 2 - 2, w, RIB);
  ctx.fillStyle = "rgba(30,16,6,0.28)";
  ctx.fillRect(x + (w - RIB) / 2 - 3, y, 3, h - 8);
  ctx.fillRect(x, y + (h - RIB) / 2 - 5, w, 3);

  const cx = x + w / 2, cy = y + h / 2 - 2;
  ctx.fillStyle = "rgba(40,22,10,0.35)";
  ctx.beginPath(); ctx.arc(cx, cy + 2, 25, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#f7f1e4";
  ctx.beginPath(); ctx.arc(cx, cy, 23, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#5d3618";
  ctx.font = "700 28px system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(String(t.count), cx, cy + 1);
  ctx.textBaseline = "alphabetic";
}

function drawTiles() {
  for (const t of tiles) {
    if (t.kind === "crate") drawCrate(t);
    else if (t.kind === "lid") drawLid(t);
  }
  // Chai đang bay vẽ SAU cùng: nó rời khỏi lưới và đi ngang qua các ô khác, nên phải
  // nằm trên chúng — không thì nó chui xuống dưới đúng lúc đang là thứ được nhìn.
  const order = tiles.filter((t) => t.pots).sort((a, b) => (a.pouring ? 1 : 0) - (b.pouring ? 1 : 0));
  for (const t of order) {
    const locked = !liftable(t) && !t.pouring && !t.hidden;
    drawQueue(t);
    if (t.kind === "pair") drawClip(t);
    for (const p of t.pots) drawPot(p, locked, t.hidden, t.pop || 0, t.tap || 0, t.nope || 0);
  }
}

/**
 * Dòng nước từ miệng chai bay sang MIỆNG BỒN bên phải.
 *
 * ⚠ Vẽ bằng một nét cong tô dày, không phải dải ribbon dựng từ hai mép. Ribbon chỉ
 * đúng khi dòng gần như thẳng đứng; giờ chai ở góc trái trên phải bắn sang phải cả
 * 400px, và hai mép dựng thủ công sẽ chéo nhau ở khúc uốn. Nét dày có bo đầu thì
 * đúng ở mọi hướng.
 */
function drawPourStreams() {
  const tx = TANK.x + TANK.w / 2;
  const ty = TANK.y + 6;
  for (const t of tiles) {
    if (!t.pots || !t.pouring) continue;
    for (const p of t.pots) {
      if (p.tilt < 0.4 || p.units <= 0) continue;
      const pal = PAL[p.color];
      const m = mouthOf(p);
      // Điểm điều khiển kéo lên trên: nước rời miệng chai theo phương gần ngang rồi
      // mới đổ xuống, chứ không bổ nhào thẳng xuống bồn.
      const cx = m.x + (tx - m.x) * 0.55;
      const cy = m.y - 26;
      ctx.save();
      ctx.lineCap = "round";
      ctx.strokeStyle = pal.base; ctx.lineWidth = 9; ctx.globalAlpha = 0.95;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.quadraticCurveTo(cx, cy, tx, ty);
      ctx.stroke();
      ctx.strokeStyle = pal.light; ctx.lineWidth = 2.6; ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y - 1.5);
      ctx.quadraticCurveTo(cx, cy - 1.5, tx, ty - 1.5);
      ctx.stroke();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = pal.light;
      ctx.beginPath(); ctx.ellipse(tx, ty + 2, 16, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
}

/** Bồn, trong vỏ chrome — cùng cách dựng với vỏ băng chuyền của game cũ. */
/**
 * Bồn: bình nước lớn của cây nước uống — chân đế, thân kính, nắp vòm có cổ rót.
 *
 * ⚠ Nó phải đọc ra là CÙNG MỘT LOẠI VẬT với các chai bên dưới, chỉ to hơn: cũng cổ,
 * cũng nắp, cũng nước nhìn xuyên qua. Một cái hộp chữ nhật đựng nước thì đúng chức
 * năng nhưng lạc họ — người chơi phải học rằng nó liên quan tới các chai, thay vì
 * nhìn là biết.
 *
 * ⚠ Thước sức chứa chuyển ra thành ỐNG THUỶ ngoài thân, không nằm chồng lên nước
 * nữa. Đặt trong lòng thì nó cắt ngang các dải màu và tranh chỗ với chính thứ nó
 * đang đo; ống thuỷ chạy dọc bên hông là cách máy móc thật làm, và cũng là chỗ duy
 * nhất không có gì khác cần nhìn.
 */
function drawTank() {
  const { x, y, w, h } = TANK;
  const jolt = tank.jolt || 0;
  ctx.save();
  if (jolt > 0.05) ctx.translate(0, Math.sin(performance.now() / 22) * jolt);
  const unit = h / TANK_CAP;
  const cx = x + w / 2;

  // Chân đế đồng thau.
  fillRR(x - 17, y + h + 2, w + 34, 18, 7, "#8a5f13");
  fillRR(x - 17, y + h - 2, w + 34, 18, 7, "#a9761c");
  fillRR(x - 13, y + h + 1, w + 26, 5, 2.5, "#e8b845");

  // Cổ và nắp đồng thau — cùng kim loại với đai ống, nên cái bồn và đường ống đọc
  // thành một bộ thiết bị chứ không phải hai món rời.
  fillRR(cx - 15, y - 26, 30, 22, 7, "#a9761c");
  fillRR(cx - 12, y - 24, 24, 18, 6, "#e8b845");
  fillRR(cx - 21, y - 34, 42, 14, 6, "#a9761c");
  fillRR(cx - 21, y - 36, 42, 14, 6, "#e8b845");
  fillRR(cx - 17, y - 33, 34, 4, 2, "#f8dd93");

  // Thân: khung chrome rồi kính.
  fillRR(x - 7, y - 5, w + 14, h + 12, 20, UI.machineEdge);
  fillRR(x - 7, y - 7, w + 14, h + 12, 20, UI.chrome);
  fillRR(x - 3, y - 3, w + 6, h + 6, 16, UI.beltDeep);
  const tg = ctx.createLinearGradient(x, 0, x + w, 0);
  tg.addColorStop(0, "#dcbb85");
  tg.addColorStop(0.42, "#fbf3e2");
  tg.addColorStop(1, "#fffaf0");
  fillRR(x, y, w, h, 13, tg);

  ctx.save();
  rr(x, y, w, h, 13); ctx.clip();
  let cursor = y + h;
  for (let i = 0; i < tank.layers.length; i++) {
    const L = tank.layers[i];
    const p = PAL[L.color];
    const top = cursor - L.units * unit;
    const isTop = i === tank.layers.length - 1;
    ctx.fillStyle = p.base;
    ctx.beginPath();
    if (isTop) waterTop(x, w, top, 2.6 * tank.wob + 1, tank.wobPhase);
    else { ctx.moveTo(x, top); ctx.lineTo(x + w, top); }
    ctx.lineTo(x + w, cursor + 1); ctx.lineTo(x, cursor + 1); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.fillRect(x, top - 1, w, isTop ? 0 : 2);
    cursor = top;
  }
  if (tank.total > 0) bubbles(x, w, y + h - (tank.total / TANK_CAP) * h, y + h, 9, 3, 2600);
  // Vệt sáng dọc trên mặt kính, vẽ đè lên nước — đó là thứ nói "có lớp kính ở đây".
  fillRR(x + 7, y + 8, 9, h - 20, 5, "rgba(255,255,255,0.34)");
  // Vùng nguy hiểm dịu bớt: 0.16 -> 0.10. Cái ống thuỷ bên hông đã đỏ và nhấp nháy
  // khi tới ngưỡng; một mảng đỏ to trong lòng bồn nữa là nói hai lần, và nó chính là
  // thứ khiến cái bồn hút mắt hơn cả bàn cờ.
  ctx.fillStyle = "rgba(255,60,60,0.10)";
  ctx.fillRect(x, y, w, unit * (TANK_CAP - WARN_AT));
  ctx.restore();
  ctx.strokeStyle = "rgba(180,146,96,0.55)"; ctx.lineWidth = 1.4;
  rr(x, y, w, h, 13); ctx.stroke();

  // ── Ống thuỷ, chạy dọc bên hông phải ──────────────────────────────────────
  const frac = Math.min(1, tank.total / TANK_CAP);
  const gx = x + w + 6, gw = 11, gy = y + 10, gh = h - 20;
  fillRR(gx - 2, gy - 6, gw + 4, gh + 12, 7, UI.machineEdge);
  fillRR(gx, gy, gw, gh, 5, "rgba(120,90,50,0.20)");
  const wy = gy + gh - (WARN_AT / TANK_CAP) * gh;
  ctx.fillStyle = "rgba(190,60,60,0.7)";
  ctx.fillRect(gx - 3, wy - 0.5, gw + 6, 1.8);
  if (frac > 0) {
    const fh = frac * (gh - 4);
    const hot = tank.total >= WARN_AT;
    // ⚠ Nhấp nháy bằng ĐỘ SÁNG chứ không phải độ mờ: mờ dần thì cột biến mất một nửa
    // số khung hình, đúng lúc nó là thứ đang phải nhìn nhất.
    const blink = hot ? 0.72 + 0.28 * Math.abs(Math.sin(performance.now() / 190)) : 1;
    const c = hot
      ? "rgb(" + Math.round(250 * blink) + "," + Math.round(70 * blink) + "," + Math.round(70 * blink) + ")"
      : "#59a7d8";
    fillRR(gx + 2, gy + gh - fh - 2, gw - 4, fh, 4, c);
    if (hot) {
      ctx.globalAlpha = (blink - 0.72) / 0.28 * 0.5;
      fillRR(gx - 3, gy + gh - fh - 5, gw + 6, fh + 6, 6, "#ff5a4a");
      ctx.globalAlpha = 1;
    }
  }
  ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1.2;
  rr(gx, gy, gw, gh, 5); ctx.stroke();
  ctx.restore();
}
/**
 * Đường ống từ đáy bồn vòng sang trái, leo lên, rồi thanh phân phối xả xuống bốn cột.
 *
 * ⚠ Vẽ SAU bồn và TRƯỚC khu box: ống phải chui ra từ dưới vỏ bồn và luồn xuống dưới
 * thanh phân phối. Nằm trên thì nó thành một nét vẽ dán đè lên máy.
 *
 * ⚠ Cái làm nó ra "đường ống" chứ không ra "một nét gạch" là các KHỚP NỐI: mặt bích
 * ở chỗ trổ khỏi bồn, hai vòng đai giữa đoạn đứng, và một cái van có tay vặn. Ống
 * thật không phải một sợi dây liền — mắt biết điều đó, kể cả khi không nghĩ tới.
 */
function drawPipes() {
  const px = (MANI.x + MANI.w + TANK.x) / 2;
  const yBot = TANK.y + TANK.h - 30;
  const yTop = MANI.y + MANI.h / 2;
  const xEnd = MANI.x + MANI.w - 10;

  // ⚠ Hai khúc cua bo tròn bán kính 28, không phải góc vuông. Ống nước thật không gập
  // 90° — người ta dùng co, và cái co là thứ làm đường ống mềm ra. Dựng bằng `arcTo`
  // trên chính ba đoạn thẳng cũ, nên thân ống và dòng nước bên trong dùng CHUNG một
  // đường: lệch nhau một pixel ở khúc cua là nước tràn ra ngoài thành ống.
  const R = 28;
  const path = () => {
    ctx.beginPath();
    ctx.moveTo(TANK.x + 8, yBot);
    ctx.arcTo(px, yBot, px, yTop, R);
    ctx.arcTo(px, yTop, xEnd, yTop, R);
    ctx.lineTo(xEnd, yTop);
  };

  // ⚠ Ống có hai trạng thái, không phải một hình tĩnh. Lúc nghỉ nó nhạt và ít tương
  // phản; lúc có nước chạy, cả thân ống ngả sang màu nước. Không có vế đó thì cái ống
  // chỉ là trang trí — người chơi không đọc được "đường này ĐANG hoạt động" từ chính
  // cái ống, mà phải suy ra từ dòng nước bên trong nó.
  const act = Math.min(1, pipe.on * 2.2);
  const glow = PAL[pipe.color];
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const [wgt, col] of [[19, "#c9a06a"], [15, UI.machineEdge], [9, "#fdf6e6"]]) {
    ctx.strokeStyle = col; ctx.lineWidth = wgt;
    path(); ctx.stroke();
  }
  if (act > 0) {
    ctx.save();
    ctx.globalAlpha = act * 0.35;
    ctx.strokeStyle = glow.light; ctx.lineWidth = 21;
    path(); ctx.stroke();
    ctx.globalAlpha = act * 0.22;
    ctx.strokeStyle = glow.base; ctx.lineWidth = 15;
    path(); ctx.stroke();
    ctx.restore();
  }

  // ⚠ Dòng nước vẽ MẢNH — 4px trong lòng ống 9px, chừa thành ống hai bên. Tô gần kín
  // lòng thì cái ống biến thành một sợi màu đặc và mất luôn cảm giác "nước chảy TRONG
  // một cái ống"; để hở hai mép thì thành ống vẫn còn đó và nước nằm gọn bên trong.
  if (pipe.on > 0) {
    const a = Math.min(1, pipe.on * 2.2);
    ctx.save();
    ctx.lineCap = "round";
    ctx.strokeStyle = PAL[pipe.color].base;
    ctx.globalAlpha = 0.8 * a;
    ctx.lineWidth = 4;
    path(); ctx.stroke();
    ctx.strokeStyle = PAL[pipe.color].light;
    ctx.globalAlpha = 0.55 * a;
    ctx.lineWidth = 2;
    ctx.setLineDash([9, 48]);
    ctx.lineDashOffset = -(performance.now() / 26) % 57;
    path(); ctx.stroke();
    ctx.restore();
  }

  // Khớp nối: hai đai trên đoạn đứng, một mặt bích chỗ trổ khỏi bồn.
  // Đai ống bằng đồng thau — nhấn kim loại DUY NHẤT trên màn hình, nên nó tự đánh dấu
  // các khớp nối mà không cần thêm đường nét nào.
  const collar = (cx, cy, w, h) => {
    fillRR(cx - w / 2, cy - h / 2, w, h, 3, "#a9761c");
    fillRR(cx - w / 2 + 1.5, cy - h / 2 + 1.5, w - 3, h - 3, 2.5, "#e8b845");
    fillRR(cx - w / 2 + 2.5, cy - h / 2 + 2.5, w - 5, 2, 1, "#f8dd93");
  };
  collar(px, yBot - (yBot - yTop) * 0.34, 26, 11);
  collar(px, yBot - (yBot - yTop) * 0.66, 26, 11);
  collar(TANK.x + 4, yBot, 12, 26);

  // Van tay vặn, ngay trên chỗ ống rời bồn.
  const vx = px, vy = yBot - (yBot - yTop) * 0.13;
  fillRR(vx - 13, vy - 9, 26, 18, 5, "#b0864f");
  fillRR(vx - 11, vy - 7, 22, 14, 4, "#f6ead2");
  ctx.strokeStyle = "#b0864f"; ctx.lineWidth = 4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(vx, vy); ctx.lineTo(vx + 17, vy - 9); ctx.stroke();
  ctx.fillStyle = "#c0392b";
  ctx.beginPath(); ctx.arc(vx + 19, vy - 10, 5, 0, Math.PI * 2); ctx.fill();

  // ── Thanh phân phối ───────────────────────────────────────────────────────
  // ⚠ Bo tròn hẳn hai đầu (bán kính = nửa chiều cao) và viền dày: một thanh bo 10 với
  // nét mảnh là thanh kim loại kỹ thuật, cùng hình đó bo hết cỡ là một món đồ chơi.
  fillRR(MANI.x, MANI.y + 5, MANI.w, MANI.h, MANI.h / 2, "#c9a06a");
  const mg = ctx.createLinearGradient(0, MANI.y, 0, MANI.y + MANI.h);
  mg.addColorStop(0, "#fffaf0");
  mg.addColorStop(0.55, "#ecd9b4");
  mg.addColorStop(1, "#d9b47e");
  fillRR(MANI.x, MANI.y, MANI.w, MANI.h, MANI.h / 2, mg);
  fillRR(MANI.x + 9, MANI.y + 4, MANI.w - 18, 6, 3, "rgba(255,255,255,0.95)");
  ctx.strokeStyle = "#c9a06a"; ctx.lineWidth = 2;
  rr(MANI.x, MANI.y, MANI.w, MANI.h, MANI.h / 2); ctx.stroke();
  if (pipe.on > 0) {
    const a2 = Math.min(1, pipe.on * 2.2);
    ctx.save();
    rr(MANI.x + 3, MANI.y + 3, MANI.w - 6, MANI.h - 6, 7); ctx.clip();
    ctx.lineCap = "round";
    ctx.strokeStyle = PAL[pipe.color].base;
    ctx.globalAlpha = 0.7 * a2;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(MANI.x + MANI.w, MANI.y + MANI.h / 2);
    ctx.lineTo(MANI.x + 8, MANI.y + MANI.h / 2);
    ctx.stroke();
    ctx.strokeStyle = PAL[pipe.color].light;
    ctx.globalAlpha = 0.5 * a2;
    ctx.lineWidth = 2;
    ctx.setLineDash([9, 48]);
    ctx.lineDashOffset = (performance.now() / 26) % 57;
    ctx.beginPath();
    ctx.moveTo(MANI.x + MANI.w, MANI.y + MANI.h / 2);
    ctx.lineTo(MANI.x + 8, MANI.y + MANI.h / 2);
    ctx.stroke();
    ctx.restore();
  }
  // Vòng đai chia khoang — thanh trơn dài 350px đọc thành một cái gạch.
  for (let i = 1; i < COLS; i++) {
    const cx = (spoutX(i - 1) + spoutX(i)) / 2;
    fillRR(cx - 5, MANI.y - 1, 10, MANI.h + 2, 5, "#c2984f");
  }

  // Đầu rót trên mỗi cột: phễu thu nhỏ dần rồi tới miệng vòi.
  // ⚠ Đầu rót là cái BẦU TRÒN, không phải phễu hình thang. Hình thang có ba cạnh
  // thẳng và hai góc nhọn — đúng một cái phễu kỹ thuật, và nó là chi tiết cứng nhất
  // trong cả khu này. Một cái bầu tròn có núm ở dưới đọc ra cùng chức năng mà mềm.
  for (let i = 0; i < COLS; i++) {
    const sx = spoutX(i), sy = MANI.y + MANI.h;
    ctx.beginPath();
    ctx.ellipse(sx, sy + 2, 12, 9, 0, 0, Math.PI);
    ctx.closePath();
    ctx.fillStyle = "#ecd9b4"; ctx.fill();
    ctx.strokeStyle = "#c9a06a"; ctx.lineWidth = 2; ctx.stroke();
    fillRR(sx - 6, sy + 8, 12, 9, 4.5, "#c9a06a");
    fillRR(sx - 4, sy + 9, 8, 6, 3, "#8a6633");
  }
}

/** Giếng lõm mà các cột máng thụt vào, cùng hai tông với khoang lưới. */
/**
 * Bồn tràn: nước ộc qua vành và đổ xuống hai bên, mang theo đúng những màu đang có
 * trong bồn.
 *
 * ⚠ Màu lấy từ `overflow.cols` — chụp lại lúc tràn và ĐẢO NGƯỢC, nên màu chảy ra
 * trước là lớp trên cùng. Tràn là hậu quả của thứ vừa rót vào, và cho nó chảy ra
 * theo đúng thứ tự đó là cách duy nhất nói được điều đó mà không cần chữ.
 *
 * ⚠ Không tô một màu bệt cho cả dòng. Cả trò chơi được đọc bằng màu, nên khoảnh
 * khắc thua cũng phải nói bằng màu: người chơi thấy ngay mình đã dồn quá nhiều thứ
 * gì vào bồn.
 */
function drawOverflow() {
  const t = Math.min(1, overflow.t);
  const cols = overflow.cols.length ? overflow.cols : ["cyan"];
  const { x, y, w } = TANK;
  const ease = 1 - Math.pow(1 - t, 2);
  // ⚠ Chỉ đổ xuống một đoạn rồi tan, không chảy hết màn hình. Bản đầu cho `reach`
  // chạm đáy canvas và dòng rộng tới 42px: hai tấm nước phủ mất nửa dưới màn hình,
  // che cả khu máng — đúng lúc người chơi cần nhìn xem mình đã dồn gì vào bồn.
  const reach = ease * 210;

  // Dải màu dùng chung cho cả hai bên: đúng chồng màu của bồn, kéo dọc theo dòng.
  const g = ctx.createLinearGradient(0, y, 0, y + reach + 10);
  cols.forEach((c, i) => g.addColorStop(Math.min(0.8, i / Math.max(1, cols.length)), PAL[c].base));
  // Đuôi dòng trong dần rồi mất hẳn — cắt ngang bằng một cạnh cứng thì nó đọc thành
  // một thanh nhựa màu chứ không thành nước đang rơi.
  g.addColorStop(1, "rgba(255,255,255,0)");

  for (const side of [-1, 1]) {
    const ex = side < 0 ? x + 8 : x + w - 8;
    const wide = 9 + ease * 12;
    ctx.save();
    ctx.beginPath();
    // Mép nước cong ra khỏi vành rồi mới đổ thẳng xuống — nước không rẽ góc vuông.
    ctx.moveTo(ex, y + 2);
    ctx.quadraticCurveTo(ex + side * (wide + 10), y + 10, ex + side * wide, y + 26);
    ctx.lineTo(ex + side * (wide + 6), y + reach);
    ctx.lineTo(ex - side * 6, y + reach);
    ctx.lineTo(ex - side * 2, y + 24);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.globalAlpha = 0.95;
    ctx.fill();
    // Gân sáng dọc mép ngoài, để khối nước có mặt chứ không phẳng lì.
    ctx.globalAlpha = 0.45;
    ctx.strokeStyle = PAL[cols[0]].light;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(ex + side * 2, y + 6);
    ctx.quadraticCurveTo(ex + side * (wide + 8), y + 12, ex + side * (wide - 2), y + reach);
    ctx.stroke();
    ctx.restore();
  }

  // Gò nước phồng lên trên vành trước khi ộc ra.
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = PAL[cols[0]].base;
  ctx.beginPath();
  ctx.ellipse(x + w / 2, y + 3, w / 2 - 4, 6 + ease * 7, 0, Math.PI, 0);
  ctx.fill();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = PAL[cols[0]].light;
  ctx.beginPath();
  ctx.ellipse(x + w / 2, y + 1, w / 2 - 12, 3 + ease * 4, 0, Math.PI, 0);
  ctx.fill();
  ctx.restore();

  // Giọt văng: mỗi giọt một màu trong bồn, rơi lệch nhịp nhau.
  for (let i = 0; i < 6; i++) {
    const c = PAL[cols[i % cols.length]];
    const ph = ((t * 1.6 + i * 0.137) % 1);
    const sx = x + 14 + ((i * 37) % (w - 28));
    const sy = y + 8 + ph * 230;
    ctx.globalAlpha = (1 - ph) * 0.85;
    ctx.fillStyle = c.base;
    ctx.beginPath();
    ctx.ellipse(sx, sy, 4 - ph * 1.5, 7 - ph * 2, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
/**
 * Giếng chứa các cột chai.
 *
 * ⚠ **Mềm và ấm, không phải một cái khay kỹ thuật.** Bản trước là chữ nhật bo 24 tô
 * trắng lạnh với vành slate mảnh, và nó đọc thành một mảnh giao diện chứ không thành
 * đồ vật. Ba thứ đổi nó: bán kính bo LỚN hẳn (24 -> 40, gần bằng nửa chiều cao khe),
 * một nét bao dày kiểu mực vẽ tay, và sàn ngả kem thay vì trắng xanh. Cùng một hình
 * học, khác hẳn chất.
 *
 * ⚠ Giếng chỉ ôm khu cột, không kéo hết bề ngang tủ — bồn đứng bên phải và một cái
 * giếng full-width sẽ phủ đè lên nó.
 */
function drawWell() {
  const top = TR.y0 - 14;
  // Kết thúc ngay dưới chỗ xén cộng chỗ cho badge, không chạy tới đáy tủ: để hở một
  // khoảng trắng dài dưới hàng bị xén thì cái xén đọc thành lỗi vẽ.
  const hgt = TR_CUT + 30 - top;
  const x = MANI.x - 6, w = MANI.w + 12;
  // Bóng đổ mềm dưới đáy — thứ nhấc cả cụm ra khỏi mặt tủ.
  fillRR(x + 4, top + 4, w - 8, hgt + 4, 40, "rgba(140,102,58,0.22)");
  fillRR(x, top - 8, w, hgt + 8, 40, "#c9a06a");
  fillRR(x + 5, top - 3, w - 10, hgt - 2, 36, "#fdf5e4");
  for (let i = 0; i < COLS; i++) {
    // Khe cột: hốc bo tròn hẳn, có viền trong mảnh — đọc thành chỗ ĐẶT chai, không
    // thành một ô kẻ.
    fillRR(trX(i) - 4, top + 6, TR.w + 8, hgt - 20, 22, "rgba(196,164,112,0.20)");
    ctx.strokeStyle = "rgba(196,164,112,0.5)"; ctx.lineWidth = 1.6;
    rr(trX(i) - 4, top + 6, TR.w + 8, hgt - 20, 22); ctx.stroke();
  }
}

/**
 * Một cái máng.
 *
 * ⚠ **Cả THÂN mang màu, không chỉ cái nắp.** Đây là cách `drawBody` của game cũ vẽ
 * box: cả thanh bar là màu của nó, phần lòng chỉ là chỗ vật thể rơi vào. Bản trước
 * để thân tối và chỉ tô màu một vạch trên nóc, nên trong một cột bốn cái xếp chồng
 * thì thứ đọc được chỉ là bốn cái gạch mảnh — mà cả cột là hàng đợi người chơi phải
 * nhìn trước để biết rót gì.
 *
 * Lòng máng để TRẮNG khi chưa có nước: nó biến mực nước thành thứ tương phản mạnh
 * nhất trên cả cái máng, nên đọc được "đầy tới đâu" mà không cần đọc con số.
 */
/**
 * Đường bao cái máng: miệng rộng hết bề ngang, thành thóp dần xuống đáy, đáy bo.
 *
 * ⚠ **Thóp xuống mới đọc ra là cái máng.** Một chữ nhật bo góc đều bốn phía là viên
 * gạch; trong một cột bốn cái xếp chồng thì đó là bốn viên gạch. Chỉ cần 5px mỗi
 * bên — đủ để mắt thấy thành nghiêng, không đủ để nó thành cái phễu.
 */
/**
 * Một cái máng, vẽ như cái CHẬU nhìn hơi chếch từ trên xuống.
 *
 * ⚠ Bản trước làm phẳng vì tôi đọc "2.D" thành 2D. Ngược lại mới đúng: khối là thứ
 * đang thiếu. Cái làm nên khối ở đây không phải bóng đổ hay gradient — mà là **cái
 * miệng elip**. Một hình chiếu chính diện thì tô kiểu gì cũng là một mảng màu; chỉ
 * cần miệng thành elip là mắt lập tức đọc ra "đang nhìn xuống vào trong một cái
 * chậu", và mực nước biến từ một vạch ngang thành một MẶT nước có diện tích.
 *
 * Bốn thứ cùng nói một hướng chiếu sáng, bỏ cái nào cũng làm hình xẹp lại:
 *   thân tô gradient NGANG (tối hai mép, sáng giữa) — đó là cái làm nó tròn;
 *   lòng chậu tối hơn thân, vì nó nằm trong bóng của chính thành chậu;
 *   vành có bề dày: nét sáng ở nửa gần, nét tối ở nửa xa;
/**
 * Một cái máng, vẽ như một bình nhỏ — cùng họ hình với khay nước ở trên.
 *
/**
 * Một cái máng, vẽ phẳng: thân nhạt bo tròn, khối nước ĐẶC nằm lọt bên trong, nắp là
 * một cục bo tròn nhỏ trên đỉnh.
 *
 * ⚠ **Không gradient, không bóng đổ, không vệt sáng.** Ba bản trước đều đi hướng
 * ngược lại — thêm khối, thêm bóng trong lòng, thêm cổ lắp có vai — và mỗi lần lại
 * đông đúc hơn. Ở kích thước 50x40, nhân với mười sáu cái cùng lúc, mọi lớp đánh
 * bóng đều biến thành nhiễu. Phẳng thì thứ duy nhất mắt bắt được là MÀU và CHIỀU
 * CAO của khối nước, mà đó đúng là hai thứ duy nhất cần đọc.
 *
 * ⚠ Khối nước thụt vào cả bốn phía, kể cả khi đầy. Cho nó chạm mép thân thì cái
 * thân biến mất và chỉ còn một mảng màu — mất luôn dấu hiệu "đây là một cái bình có
 * sức chứa", tức mất chỗ để đọc "còn trống bao nhiêu".
 */
function drawTrough(x, y, t, open) {
  const p = PAL[t.color];
  const lv = t.filled / TROUGH_CAP;
  const bw = 46, bh = TR.h;
  const bx = x + (TR.w - bw) / 2;

  ctx.globalAlpha = open ? 1 : 0.72;

  // Nắp vặn trên cổ — thứ mang màu ngay cả khi chai rỗng. Một vệt bóng trên mặt nắp:
  // nó là chi tiết duy nhất nói cái nắp làm bằng nhựa bóng chứ không phải một mảng màu.
  fillRR(bx + bw / 2 - 9, y - 9, 18, 11, 3.5, p.dark);
  fillRR(bx + bw / 2 - 9, y - 9, 18, 7, 3, p.base);
  fillRR(bx + bw / 2 - 6, y - 8, 8, 2.5, 1.2, "rgba(255,255,255,0.75)");

  // ⚠ **Thành chai TRUNG TÍNH, không mang màu.** Nó vẫn có bề dày thật — tô cả thân
  // rồi khoét lòng, còn lại một vành chừng 7px — nhưng vành đó là nâu nhạt cho mọi
  // chai. Màu để dành cho hai chỗ: cái nắp và khối nước bên trong. Tô màu cả thành
  // nữa thì chai rỗng và chai đầy trông gần như nhau, mà phân biệt hai cái đó là
  // toàn bộ việc phải đọc ở khu này.
  bottlePath(bx, y, bw, bh);
  ctx.fillStyle = "#f6ecd8"; ctx.fill();
  ctx.strokeStyle = "#c2a071"; ctx.lineWidth = 2.5;
  ctx.stroke();

  // ⚠ Một đường lót MÀU chạy sát mặt trong thành, dày chừng 4px. Thành thì trung
  // tính cho mọi chai, nên nếu không có cái lót này thì một chai rỗng chỉ còn cái nắp
  // để nói màu — mà cái nắp bé và nằm tách hẳn trên cùng. Lót vào trong thì màu bám
  // theo đúng hình cái chai, đọc được ngay cả khi chưa có giọt nước nào.
  // ⚠ `lin` = 9: màu ăn từ mặt trong thành vào TỚI GẦN LÕI, chỉ chừa một lõi nhạt
  // hẹp ở giữa. Ở 4px nó chỉ là một cái viền nữa; dày lên thì cả cái chai mang màu
  // của nó, còn cái lõi nhạt là chỗ mực nước chạy — đọc mức nước trên một dải hẹp
  // vẫn dễ hơn đọc nó trên một mảng rộng cùng tông với xung quanh.
  const ins = 7, lin = 9;
  bottlePath(bx + ins, y + ins, bw - ins * 2, bh - ins * 2);
  ctx.fillStyle = p.base; ctx.fill();
  const iw = bw - (ins + lin) * 2, ih = bh - (ins + lin) * 2;
  bottlePath(bx + ins + lin, y + ins + lin, iw, ih);
  ctx.fillStyle = "#fdf7ea"; ctx.fill();
  if (lv > 0) {
    ctx.save();
    bottlePath(bx + ins + lin, y + ins + lin, iw, ih);
    ctx.clip();
    const top = y + bh - ins - lin - lv * ih;
    ctx.fillStyle = p.base;
    ctx.fillRect(bx, top, bw, bh);
    bubbles(bx + ins + lin, iw, top, y + bh - ins - lin, 4, x * 0.07, 2100);
    ctx.restore();
  }

  ctx.globalAlpha = 1;
}

function drawTroughs() {
  // ⚠ Xén ở `TR_CUT`, và cái xén này làm HAI việc. Một: hàng thứ tư chỉ còn cái nắp
  // ló ra, nói "còn nữa" mà không tốn một hàng. Hai: lúc một bình vỡ, cả cột được vẽ
  // thấp hơn đích một ngăn rồi trượt lên, nên cái sâu nhất thò xuống dưới sàn giếng
  // trong đúng khoảng thời gian đó — game cũ vấp y hệt và có ghi chú ở
  // `buildBeltHousing`.
  ctx.save();
  rr(MACH.x + 10, TR.y0 - 26, MACH.w - 20, TR_CUT - TR.y0 + 26, 26);
  ctx.clip();
  for (let i = 0; i < COLS; i++) {
    const shown = Math.min(TR_VISIBLE, cols[i].length);
    const ease = slide[i] * slide[i] * (3 - 2 * slide[i]);
    const yOff = ease * (TR.h + TR.vgap);
    for (let k = 0; k < shown; k++) {
      ctx.globalAlpha = k === 0 ? 1 : 0.92;
      drawTrough(trX(i), TR.y0 + k * (TR.h + TR.vgap) + yOff, cols[i][k], k === 0);
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();

  // Badge nằm NGOÀI vùng xén, dưới hàng bị cắt: số bình còn lại của cột.
  for (let i = 0; i < COLS; i++) {
    const hidden = cols[i].length - Math.min(TR_VISIBLE, cols[i].length);
    if (hidden <= 0) continue;
    // ⚠ Badge là một BONG BÓNG tròn, không phải con số đặt dưới khoang. Số trần nằm
    // trên nền giếng đọc thành chú thích kỹ thuật; một cái bong bóng nổi có viền là
    // một phần của trò chơi. Nội dung không đổi: còn bao nhiêu chai trong cột.
    const bxc = trX(i) + TR.w / 2;
    const byc = TR_CUT + 15;
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = "#7a5a30";
    ctx.beginPath(); ctx.ellipse(bxc, byc + 13, 13, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(bxc, byc, 13, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#c9a06a"; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(bxc, byc, 13, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath(); ctx.ellipse(bxc - 4, byc - 5, 4.5, 3, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#8a6633";
    ctx.font = "700 15px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(hidden), bxc, byc + 5);
  }
  // Bóng ma của thứ vừa vỡ: nở ra rồi tan, vẽ SAU cả lưới nên nó nằm trên cái đang
  // trượt lên — cái cũ tan để lộ cái mới bên dưới.
  for (const f of flashes) {
    // Khung loé phải là khung CÁI BÌNH, không phải cả ô cột. Ô rộng 106 còn bình chỉ
