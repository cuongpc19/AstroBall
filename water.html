    // 64, nên dùng ô thì cái nổ ra rộng gần gấp đôi thứ vừa biến mất.
    const box = f.box ?? [trX(f.col) + (TR.w - 56) / 2, TR.y0 - 11, 56, TR.h + 11];
    const grow = (1 - f.t) * 5;
    ctx.globalAlpha = f.t * f.t;
    fillRR(box[0] - grow, box[1] - grow, box[2] + grow * 2, box[3] + grow * 2, 9 + grow, PAL[f.color].base);
    ctx.globalAlpha = f.t * f.t * 0.9;
    fillRR(box[0] - grow, box[1] - grow, box[2] + grow * 2, box[3] + grow * 2, 9 + grow, "rgba(255,255,255,0.85)");
    ctx.globalAlpha = 1;
  }
}

function drawDrops() {
  for (const s of streams) {
    const p = PAL[s.color];
    const y = s.y0 + (TANK.y + 8 - s.y0) * s.t * s.t;   // hạt bắn đi theo dòng
    ctx.globalAlpha = 0.55 * (1 - s.t);
    ctx.fillStyle = p.light;
    ctx.beginPath(); ctx.ellipse(s.x0 + 14 + s.t * 6, y, 2.4, 3.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (const d of drops) {
    const p = PAL[d.color];
    const y = d.y + (TR.y0 + 8 - d.y) * d.t * d.t;
    ctx.fillStyle = p.base;
    ctx.beginPath(); ctx.ellipse(d.x, y, 4.5, 8, 0, 0, Math.PI * 2); ctx.fill();
  }
}

function draw() {
  ctx.save();
  if (shake > 0.01) ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#2f2c63"); bg.addColorStop(1, "#6a4f9e");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  // Quầng sáng ấm sau lưng máy. Nền phẳng làm cái tủ như bị dán lên một tấm bìa; một
  // vệt sáng phía sau cho nó chỗ đứng mà không phải vẽ thêm bối cảnh nào.
  const halo = ctx.createRadialGradient(W / 2, H * 0.42, 40, W / 2, H * 0.42, W * 0.95);
  halo.addColorStop(0, "rgba(174,150,255,0.30)");
  halo.addColorStop(0.55, "rgba(150,126,224,0.12)");
  halo.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, W, H);

  drawMachine();
  drawCavity();
  drawTiles();
  drawPourStreams();
  // ⚠ Thứ tự: giếng trước, rồi bồn, rồi ống. Giếng vẽ sau thì nó phủ mất cả bồn lẫn
  // ống — đúng như lần chạy đầu, bồn bị che gần hết chỉ còn ló cái nóc.
  drawWell();
  drawTank();
  drawPipes();
  drawTroughs();
  drawDrops();
  // Chai đã đầy đang bay lên kệ.
  //
  // ⚠ Bay theo vòng cung và NHỎ DẦN, không trượt thẳng. Đường thẳng cộng kích thước
  // không đổi đọc thành một mảnh UI bị kéo đi; cung cộng thu nhỏ đọc thành một vật
  // được nhấc lên và cất vào chỗ xa hơn. Nhạt dần ở đoạn cuối để nó hoà vào đúng cái
  // chai tĩnh mà `drawRacks` đã vẽ sẵn ở ô đó.
  for (const s of shelved) {
    const e = s.t * s.t * (3 - 2 * s.t);
    const x = s.x0 + (s.to.x - s.x0) * e;
    const y = s.y0 + (s.to.y - s.y0) * e - Math.sin(Math.PI * e) * 60;
    const k = 1 - 0.55 * e;
    const p = PAL[s.color];
    ctx.save();
    ctx.globalAlpha = s.t > 0.82 ? (1 - s.t) / 0.18 : 1;
    ctx.translate(x, y);
    ctx.scale(k, k);
    fillRR(-8, -30, 16, 9, 3, p.dark);
    bottlePath(-15, -22, 30, 44);
    ctx.fillStyle = "#f6ecd8"; ctx.fill();
    ctx.strokeStyle = "#c2a071"; ctx.lineWidth = 2; ctx.stroke();
    bottlePath(-10, -17, 20, 34);
    ctx.fillStyle = p.base; ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  for (const s of sparks) {
    ctx.globalAlpha = s.t * s.t;
    ctx.fillStyle = PAL[s.color].light;
    ctx.beginPath(); ctx.arc(s.x, s.y, 1.6 + s.t * 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (overflow) drawOverflow();

  // HUD nằm trên nền tím, ngoài thân tủ — nên chữ sáng, khác chữ trên máy.
  ctx.fillStyle = "rgba(240,238,255,0.95)";
  ctx.font = "700 24px system-ui, sans-serif";
  ctx.textAlign = "left";
  // ⚠ Cả HUD phải nằm gọn trong dải 74px phía trên nóc tủ. Bản đầu xếp dọc bốn dòng
  // và thanh tiến độ tụt xuống dưới mép tủ — chữ nằm trên mái nhà.
  ctx.fillText("Level " + level, 24, 36);
  // ⚠ Mục tiêu viết thẳng ra, một dòng. Review nói đúng: người chơi phải ĐOÁN mối quan
  // hệ giữa ba khu, và cái bồn thì nhìn như thứ cần làm đầy — trong khi làm đầy nó là
  // THUA. Không có câu nào nói ngược lại thì hình vẽ tự nó nói sai.
  ctx.font = "600 13px system-ui, sans-serif";
  ctx.fillStyle = "rgba(226,220,255,0.82)";
  ctx.fillText("Rót hết chai · đừng để tràn bồn", 24, 58);

  // Tiến độ toàn ván: số chai đã đầy trên tổng. Mấy con số ở chân mỗi cột không nói
  // được điều này — chúng chỉ đếm phần còn lại của RIÊNG cột đó.
  const done = totalBoxes - cols.reduce((n, c) => n + c.length, 0);
  const bw2 = 168, bx2 = W - 24 - bw2, by2 = 24;
  fillRR(bx2, by2, bw2, 10, 5, "rgba(255,255,255,0.2)");
  if (done > 0) fillRR(bx2, by2, Math.max(10, bw2 * done / totalBoxes), 10, 5, "#8fd4a0");
  ctx.textAlign = "right";
  ctx.font = "700 12px system-ui, sans-serif";
  ctx.fillStyle = "rgba(240,238,255,0.92)";
  ctx.fillText(done + " / " + totalBoxes + " chai đầy", W - 24, 52);
  ctx.font = "600 11px system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.fillText(DEMO ? "demo — thắng " + tally.win + " / thua " + tally.lose : "R = bàn mới · N = level sau", W - 24, 68);

  // ⚠ Hoãn màn thua cho tới khi nước đã đổ ra được một đoạn. Phủ scrim ngay lập tức
  // thì cái hiệu ứng vừa dựng bị che mất đúng lúc nó đang nói điều cần nói.
  if (phase !== "play" && (!overflow || overflow.t > 0.55)) {
    ctx.fillStyle = "rgba(20,16,44,0.74)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = phase === "win" ? "#7fe0a0" : "#ff8f8f";
    ctx.font = "700 52px system-ui, sans-serif";
    ctx.fillText(msg, W / 2, H / 2 - 10);
    ctx.fillStyle = "rgba(230,242,255,0.8)";
    ctx.font = "600 20px system-ui, sans-serif";
    ctx.fillText(phase === "win" ? "chạm để sang level " + (level + 1) : "chạm để chơi lại", W / 2, H / 2 + 34);
  }
  ctx.restore();
}

// ── Bot ──────────────────────────────────────────────────────────────────────
//
// `?demo` cho nó tự chơi — cách duy nhất kiểm tra luật chạy tới thắng, vì một bàn
// chỉ tắc sau chục nước rót. `?fast` rút nhịp để soi nhiều bàn; không đụng tới luật.
//
// ⚠ Bot này đơn giản hơn bản trước, và đó là một PHÉP ĐO. Hồi bồn chỉ rút được lớp
// đáy, nó phải đếm "chỗ trống của màu này trừ phần nước màu này đã trong bồn" — tức
// "marbles already spoken for" trong scripts/bots.mjs — vì rót thừa là chẹn đáy vĩnh
// viễn. Giờ nước thừa chỉ nằm chờ, nên phép đếm đó vô nghĩa. Cái mất theo là độ khó.
const Q = new URLSearchParams(location.search);
const DEMO = Q.has("demo");
if (Q.has("fast")) DRAIN_MS = 40;
const BOT_GAP = Q.has("fast") ? 140 : 420;
let botAt = 0, tally = { win: 0, lose: 0 }, overAt = 0;

function bot(now) {
  if (DEMO && phase !== "play") {
    if (!overAt) overAt = now;
    else if (now - overAt > 700) {
      tally[phase === "win" ? "win" : "lose"]++;
      overAt = 0;
      buildLevel(phase === "win" ? level + 1 : level);
    }
    return;
  }
  if (!DEMO || phase !== "play" || now - botAt < BOT_GAP) return;
  if (tiles.some((t) => t.pouring)) return;
  const ready = tiles.filter(liftable);
  if (!ready.length) return;
  const load = (t) => t.pots.reduce((n, p) => n + p.units, 0);
  const open = new Set();
  for (let i = 0; i < COLS; i++) { const a = active(i); if (a) open.add(a.color); }
  const fits = ready.filter((t) => tank.total + load(t) <= TANK_CAP);
  if (!fits.length) return;
  const p = fits.find((t) => t.pots.every((q) => open.has(q.color))) ?? fits[0];
  botAt = now; tapTile(p);
}

// ── Input + fit ──────────────────────────────────────────────────────────────
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio;
  cv.style.width = W * s + "px"; cv.style.height = H * s + "px";
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener("resize", fit);

cv.addEventListener("pointerdown", (e) => {
  if (phase !== "play") { buildLevel(phase === "win" ? level + 1 : level); return; }
  const r = cv.getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width) * W;
  const y = ((e.clientY - r.top) / r.height) * H;
  const c = Math.floor((x - GRID_X0 + (PITCH - CELL) / 2) / PITCH);
  const rw = Math.floor((y - GRID_Y0 + (PITCH - CELL) / 2) / PITCH);
  tapTile(grid.get(K(c, rw)));
});
window.addEventListener("keydown", (e) => {
  if (e.key === "r" || e.key === "R") buildLevel(level);
  if (e.key === "n" || e.key === "N") buildLevel(level + 1);
});

buildLevel(Number(Q.get("level")) || 1);
fit();
requestAnimationFrame(function frame(now) {
  const dt = Math.min(50, now - (last || now));
  last = now;
  bot(now);
  step(now, dt);
  draw();
  requestAnimationFrame(frame);
});
    </script>
  </body>
</html>
