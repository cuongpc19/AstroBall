    <div id="wrap"><canvas id="c"></canvas></div>
    <script>
// ─────────────────────────────────────────────────────────────────────────────
// AquaSort — prototype nước cho AstroBall
//
// Đây là chỗ rẻ để chốt cái NHÌN trước khi động vào GameScene thật (3.5k dòng, có
// Matter physics trong phễu và cả bộ coach mark bám vào nó). Các con số ở đây bám
// đúng game cũ, không phải số chọn cho prototype:
//
//   khay  → bình nước, 9 đơn vị   (TRAY_N)
//   ray   → một bồn 30 đơn vị     (BELT_SLOTS) — nhưng không còn ô, không còn vòng
//   box   → máng 3 đơn vị         (BOX_SLOTS)
//
// Cái bị bỏ so với game cũ là **vật lý giữa các viên bi**: không còn body Matter
// va nhau trong phễu, nước chảy thẳng từ bình xuống bồn.
//
// Luật rút, và nó là bản dịch sát của cái vòng lặp cũ:
//
//   bồn xếp nước thành LỚP theo thứ tự vào, cùng màu thì gộp lại
//   MỖI máng đang mở tự hút màu của nó ra khỏi bồn, nằm ở lớp nào cũng được
//   không màu nào trong bồn khớp máng nào = tắc; nước dâng quá 30 = tràn
//
// ⚠ **"Lớp nào cũng được" mới là cái giữ được tinh thần game cũ, chứ không phải
// "chỉ lớp đáy".** Bản trước chỉ cho rút lớp dưới cùng, và nó tắc ở 21/30 sau chín
// giây: một bình 9 đơn vị dồn xuống trong khi chỉ một máng cùng màu đang mở nhận
// được 3, sáu đơn vị còn lại nằm chẹn đáy vĩnh viễn. Trên ray cũ chuyện đó không
// xảy ra được — viên không khớp chạy vòng tiếp, nó không chặn ai cả. Cho mọi lớp
// đều rút được là cách nói lại đúng điều đó bằng nước, và nó trả áp lực về đúng
// chỗ cũ: sức chứa 30, tức "BELT FULL".
//
// Toàn bộ file này độc lập: không import gì, mở thẳng bằng browser cũng chạy.
// ─────────────────────────────────────────────────────────────────────────────

const W = 540, H = 900;

// Bảng màu lấy nguyên từ src/game/config.ts — nếu sau này ghép vào game thật thì
// không phải chỉnh lại màu, và hai bên vẫn đọc giống nhau trên cùng một máy.
const PAL = {
  blue:   { base: "#2b5ce8", light: "#6d92ff", dark: "#1a3a9e" },
  green:  { base: "#23bb45", light: "#62e37c", dark: "#137a2b" },
  orange: { base: "#ff8a14", light: "#ffb862", dark: "#c25c00" },
  yellow: { base: "#ffd020", light: "#ffe883", dark: "#c99a00" },
  cyan:   { base: "#55d9f5", light: "#a6efff", dark: "#1f9cba" },
  purple: { base: "#a341f0", light: "#c989ff", dark: "#6d1cab" },
  pink:   { base: "#ff86c4", light: "#ffbadd", dark: "#c94a8d" },
  red:    { base: "#ec3d3d", light: "#ff8080", dark: "#a71c1c" },
};

// ⚠ **Tỉ lệ 9:3 buộc bộ sinh bàn phải đẻ ĐÚNG 3 máng cho mỗi bình.** Tổng nước màu
// C là (số bình C) x 9, sức chứa máng màu C là (số máng C) x 3 — lệch một cái là
// bàn thừa nước và thiếu chỗ, không cách nào chơi hết dù chơi hoàn hảo. Đây là
// ràng buộc duy nhất trong file mà đổi TROUGH_CAP thì phải sửa theo: xem `newBoard`.
const JAR_UNITS = 9;
const TROUGH_CAP = 3;
const TANK_CAP = 30;
const COLS = 4;            // số cột máng, cũng là số màu mở cùng lúc
const DEPTH = 6;           // số máng xếp chồng trong một cột
const JARS = (COLS * DEPTH) / (JAR_UNITS / TROUGH_CAP);   // 24 máng / 3 = 8 bình

let DRAIN_MS = 110;        // một đơn vị nước rời bồn mỗi chừng này
// ⚠ Rót chậm là chủ ý. Cả trò chơi nằm ở thứ tự các lớp trong bồn, mà một cú rót 9
// đơn vị trong nửa giây thì lớp mới hiện ra là đã xong — người chơi không kịp thấy
// nó chồng lên cái gì. 150ms/đơn vị cho một bình mất khoảng 1,6 giây, đủ để đọc.
const POUR_MS = 150;       // một đơn vị rời bình mỗi chừng này
const POUR_LEAD = 220;     // nghiêng bao lâu trước khi giọt đầu rơi
// ⚠ 46°, không phải 66°. Ở 66° cái bình nằm ngang hẳn, thò ra khỏi ô của nó và đè
// lên ô bên cạnh — trên một lưới sát nhau thì nó đọc thành hai bình chồng nhau chứ
// không thành một bình đang nghiêng. 46° vẫn thừa để thấy là đang rót.
const TILT_MAX = 0.8;

// ── Layout ───────────────────────────────────────────────────────────────────
//
// Lưới bình dựng đúng kiểu lưới khay của game cũ: ô vuông trên một khoang lõm, và
// khoang đó ôm theo đúng những ô CÓ bình — nên bàn có hình thù lởm chởm chứ không
// phải một chữ nhật đầy. Xem `drawCavity`.
const GRID_COLS = 4, GRID_ROWS = 4, CELL = 62, PITCH = 68;
const GRID_X0 = (W - GRID_COLS * PITCH) / 2 + (PITCH - CELL) / 2;
const GRID_Y0 = 92;
const TANK = { x: 30, y: 404, w: 480, h: 186 };
const TR = { x0: 34, y0: 640, w: 110, gap: 8, h: 34, vgap: 5 };

const cellX = (c) => GRID_X0 + c * PITCH + CELL / 2;
const cellY = (r) => GRID_Y0 + r * PITCH + CELL / 2;

const trX = (i) => TR.x0 + i * (TR.w + TR.gap);
const spoutX = (i) => trX(i) + TR.w / 2;

// ── State ────────────────────────────────────────────────────────────────────
let jars, cells, tank, cols, streams, drops, flashes, phase, stalledFor, shake, msg, seed;

function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/**
 * Chọn `n` ô cho lưới bình, mọc dần từ một ô gốc sang các ô kề.
 *
 * ⚠ **Mọc liền khối, không phải bốc ngẫu nhiên n ô.** Bốc ngẫu nhiên cho ra vài
 * cụm rời rạc, và cái khoang vẽ quanh chúng thành mấy hòn đảo — trong khi bàn của
 * game cũ luôn là MỘT khối liền có eo có ngách. Hình thù đó không phải trang trí:
 * nó là thứ người chơi đọc để biết bàn còn rộng hay đã bị bóp lại.
 */
function growRegion(n) {
  const key = (c, r) => c + "," + r;
  const start = [(rnd() * GRID_COLS) | 0, (rnd() * GRID_ROWS) | 0];
  const taken = new Map([[key(start[0], start[1]), start]]);
  while (taken.size < n) {
    const edge = [];
    for (const [c, r] of taken.values()) {
      for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nc = c + dc, nr = r + dr;
        if (nc < 0 || nr < 0 || nc >= GRID_COLS || nr >= GRID_ROWS) continue;
        if (taken.has(key(nc, nr))) continue;
        edge.push([nc, nr]);
      }
    }
    if (!edge.length) break;   // lưới kín trước khi đủ n — chỉ xảy ra nếu n > số ô
    const pick = edge[(rnd() * edge.length) | 0];
    taken.set(key(pick[0], pick[1]), pick);
  }
  return [...taken.values()];
}

function newBoard(s) {
  seed = (s ?? Math.floor(Math.random() * 1e9)) >>> 0;
  const names = Object.keys(PAL).slice(0, 6);

  const bag = shuffle(Array.from({ length: JARS }, (_, i) => names[i % names.length]));
  cells = growRegion(JARS);
  jars = bag.map((color, i) => ({
    color, units: JAR_UNITS,
    col: cells[i][0], row: cells[i][1],
    cx: cellX(cells[i][0]), cy: cellY(cells[i][1]),
    tilt: 0, pouring: false, gone: false, poured: 0, pourT: 0,
  }));

  // Ba máng cho mỗi bình — xem ghi chú ở TROUGH_CAP.
  const troughBag = [];
  for (const c of bag) for (let k = 0; k < JAR_UNITS / TROUGH_CAP; k++) troughBag.push(c);
  shuffle(troughBag);
  cols = [];
  for (let i = 0; i < COLS; i++) {
    cols.push(troughBag.slice(i * DEPTH, (i + 1) * DEPTH).map((color) => ({ color, filled: 0 })));
  }

  tank = { layers: [], total: 0, wob: 0, wobPhase: 0 };
  streams = []; drops = []; flashes = [];
  phase = "play"; stalledFor = 0; shake = 0; msg = "";
}

// ── Rules ────────────────────────────────────────────────────────────────────

/** Đổ một đơn vị vào bồn. Cùng màu với lớp trên cùng thì gộp, khác thì thêm lớp. */
function pushUnit(color) {
  const top = tank.layers[tank.layers.length - 1];
  if (top && top.color === color) top.units++;
  else tank.layers.push({ color, units: 1 });
  tank.total++;
  tank.wob = Math.min(1, tank.wob + 0.2);
  if (tank.total > TANK_CAP) { phase = "lose"; msg = "TRÀN BỒN!"; shake = 1; }
}

/** Máng đang mở của cột i, hoặc null nếu cột đã cạn. */
const active = (i) => (cols[i].length ? cols[i][0] : null);

/**
 * Bốc một đơn vị ra khỏi lớp `i`. Lớp cạn thì bỏ đi, và hai lớp vừa chạm nhau mà
 * cùng màu thì gộp lại.
 *
 * ⚠ Phải gộp, không phải cho gọn dữ liệu mà vì cái vạch phân cách giữa hai lớp là
 * thứ người chơi đọc. Bỏ lớp giữa mà không gộp thì trong bồn còn lại hai dải cùng
 * màu dính nhau với một vạch trắng ở giữa — trông như hai mẻ nước khác nhau.
 */
function takeUnit(i) {
  const L = tank.layers[i];
  L.units--;
  tank.total--;
  if (L.units > 0) return;
  tank.layers.splice(i, 1);
  if (i > 0 && i < tank.layers.length && tank.layers[i - 1].color === tank.layers[i].color) {
    tank.layers[i - 1].units += tank.layers[i].units;
    tank.layers.splice(i, 1);
  }
}

/**
 * Mỗi máng đang mở tự hút màu của nó ra khỏi bồn, một đơn vị mỗi nhịp.
 *
 * ⚠ **Nằm ở lớp nào cũng rút được — đó là điểm khác cốt lõi so với bản trước.** Chỉ
 * cần trong bồn có nước cùng màu với một máng đang mở. Nước không khớp không chặn
 * ai, nó chỉ chiếm chỗ và chờ, y như viên bi không khớp chạy vòng trên ray cũ.
 *
 * ⚠ Bốn máng rút SONG SONG, không phải một đơn vị mỗi nhịp cho cả bồn. Bốn cái vòi
 * đã vẽ sẵn dưới đáy bồn; để chúng chảy lần lượt thì ba cái luôn khô và cả cụm đọc
 * thành một cái vòi vẽ thừa ba lần.
 *
 * Lấy từ lớp THẤP NHẤT có màu đó: nước sâu ra trước, và mặt bồn hạ xuống liên tục
 * thay vì thủng một lỗ ở giữa.
 */
function drain() {
  let moved = false;
  for (let i = 0; i < COLS; i++) {
    const t = active(i);
    if (!t) continue;
    const li = tank.layers.findIndex((L) => L.color === t.color);
    if (li < 0) continue;

    takeUnit(li);
    drops.push({ x: spoutX(i), y: TANK.y + TANK.h, color: t.color, t: 0 });
    t.filled++;
    // ⚠ **Đóng máng ngay trong lượt rút, không hẹn giờ.** Bản đầu shift qua
    // setTimeout 260ms trong khi DRAIN_MS là 110 — nên hai đơn vị nữa kịp rót vào một
    // cái máng đã đầy. Nước đó rời bồn nhưng không mở thêm máng nào, nên tổng nước
    // một màu tụt xuống dưới tổng sức chứa máng màu đó, và bàn thành KHÔNG THỂ giải.
    // Bot demo đâm vào đúng chỗ đó ở lần chạy đầu. Hiệu ứng loé tách ra thành
    // `flashes` vì nó là hình, không phải luật.
    if (t.filled >= TROUGH_CAP) { flashes.push({ col: i, color: t.color, t: 1 }); cols[i].shift(); }
    moved = true;
  }
  return moved;
}

function tapJar(j) {
  if (phase !== "play" || j.gone || j.pouring) return;
  j.pouring = true; j.poured = 0; j.pourT = 0;
}

/** Miệng bình, sau khi nghiêng — dòng nước phải chảy ra từ đây chứ không từ tâm. */
function mouthOf(j) {
  const a = j.tilt * TILT_MAX;
  return { x: j.cx + Math.sin(a) * 42, y: j.cy - Math.cos(a) * 42 };
}

// ── Loop ─────────────────────────────────────────────────────────────────────
let lastDrain = 0, last = 0;

function step(now, dt) {
  if (phase === "play") {
    for (const j of jars) {
      if (!j.pouring) { j.tilt += (0 - j.tilt) * 0.18; continue; }
      j.pourT += dt;
      j.tilt += (1 - j.tilt) * 0.16;
      // Nghiêng xong mới chảy — nếu rót ngay từ khung hình đầu thì dòng nước xuất
      // hiện trước khi cái bình kịp cúi xuống, và cả cú rót đọc thành "biến mất".
      if (j.tilt > 0.45) {
        const want = Math.min(JAR_UNITS, Math.floor((j.pourT - POUR_LEAD) / POUR_MS));
        while (j.poured < want && j.poured < JAR_UNITS) {
          j.poured++; j.units--;
          const m = mouthOf(j);
          streams.push({ x0: m.x, y0: m.y, color: j.color, t: 0 });
          pushUnit(j.color);
        }
      }
      if (j.units <= 0) { j.pouring = false; j.gone = true; }
    }

    if (now - lastDrain > DRAIN_MS) {
      lastDrain = now;
      // ⚠ Bồn rỗng KHÔNG phải tắc. `drain` trả false cả khi không có gì để rút, và
      // tính đó là tắc thì bàn vừa mở đã báo TẮC rồi thua sau 900ms.
      const moved = drain();
      stalledFor = moved || tank.total === 0 ? 0 : stalledFor + DRAIN_MS;
    }

    const jarsDone = jars.every((j) => j.gone);
    if (jarsDone && tank.total === 0) { phase = "win"; msg = "SẠCH BỒN!"; }
    else if (jarsDone && stalledFor > 900) { phase = "lose"; msg = "BỒN TẮC!"; }
  }

  tank.wob *= 0.94;
  tank.wobPhase += dt * 0.006;
  shake *= 0.9;
  for (const s of streams) s.t += dt / 300;
  streams = streams.filter((s) => s.t < 1);
  for (const d of drops) d.t += dt / 200;
  drops = drops.filter((d) => d.t < 1);
  for (const f of flashes) f.t -= dt / 300;
  flashes = flashes.filter((f) => f.t > 0);
}

// ── Draw ─────────────────────────────────────────────────────────────────────
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

function rr(x, y, w, h, r) {
  const k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}

/**
 * Mặt nước: một đường sin chạy, biên độ tắt dần theo `wob`.
 *
 * ⚠ Chỉ vẽ cho mặt trên cùng. Gợn sóng ở mọi ranh giới lớp trông như nước đang
 * sôi, và quan trọng hơn là nó xoá mất chỗ phân cách hai màu — thứ duy nhất cho
 * người chơi biết thứ tự trong bồn.
 */
function waterTop(x, w, y, amp, ph) {
  ctx.moveTo(x, y);
  for (let i = 0; i <= 24; i++) {
    const t = i / 24;
    ctx.lineTo(x + t * w, y + Math.sin(ph + t * 7.5) * amp);
  }
}

/**
 * Khoang lõm dưới lưới bình — cùng hai tông với game cũ: mép slate, sàn trắng.
 *
 * ⚠ **Một `fill()` cho tất cả các ô, không phải mỗi ô một lần.** Fill riêng từng ô
 * thì chỗ hai ô chồng nhau bị tô hai lượt, và với màu có alpha thì đó là một lưới
 * ô bàn cờ đậm nhạt hiện lên ngay giữa khoang. Gom mọi hình vào MỘT path rồi fill
 * một phát thì nonzero winding hợp chúng lại thành đúng một khối — đó cũng là lý
 * do không được stroke từng ô: stroke sẽ vẽ ra đúng những đường ghép mà cách này
 * xoá đi.
 */
function fillCells(inset, radius, style) {
  ctx.beginPath();
  for (const [c, r] of cells) {
    const x = cellX(c) - CELL / 2 - inset, y = cellY(r) - CELL / 2 - inset;
    const w = CELL + inset * 2, h = CELL + inset * 2;
    const k = Math.min(radius, w / 2, h / 2);
    ctx.moveTo(x + k, y);
    ctx.arcTo(x + w, y, x + w, y + h, k);
    ctx.arcTo(x + w, y + h, x, y + h, k);
    ctx.arcTo(x, y + h, x, y, k);
    ctx.arcTo(x, y, x + w, y, k);
    ctx.closePath();
  }
  ctx.fillStyle = style;
  ctx.fill();
}

function drawCavity() {
  fillCells(8, 21, "#9fb0cb");     // UI.panelDeep — cái mép làm nên hình thù bàn
  fillCells(3, 17, "#f4f7fd");     // UI.panel — sàn khoang
  // Ô đã rót cạn. Vẫn phải thấy: chỗ trống trên bàn là thông tin, không phải rác.
  for (const j of jars) {
    if (!j.gone) continue;
    ctx.fillStyle = "#e4ebf8";
    rr(j.cx - CELL / 2 + 2, j.cy - CELL / 2 + 2, CELL - 4, CELL - 4, 12); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 2;
    rr(j.cx - CELL / 2 + 3, j.cy - CELL / 2 + 3, CELL - 6, CELL - 6, 11); ctx.stroke();
  }
}

function drawJar(j) {
  if (j.gone) return;
  const p = PAL[j.color];
  const bw = 50, bh = 60;
  ctx.save();
  ctx.translate(j.cx, j.cy);
  // ⚠ Cùng một `TILT_MAX` với `mouthOf` và với phép xoay ngược của mặt nước bên
  // dưới. Ba chỗ này PHẢI khớp: để lệch thì miệng bình rót ra từ khoảng không, và
  // mặt nước bị xoay ra ngoài vùng cắt nên cái bình trông như rỗng. Đã xảy ra đúng
  // thế khi chỗ này còn là một số 1.15 viết cứng.
  ctx.rotate(j.tilt * TILT_MAX);
  ctx.translate(-bw / 2, -bh / 2);

  // ⚠ Kính vẽ **sáng có viền slate**, không phải trắng mờ. Bình đứng trên sàn khoang
  // trắng của game cũ, và trắng mờ trên trắng thì cái bình chỉ còn là vũng nước có
  // màu lơ lửng — không có hình dáng bình nào cả.
  ctx.fillStyle = "rgba(255,255,255,0.62)";
  rr(bw / 2 - 9, -14, 18, 20, 4); ctx.fill();
  ctx.strokeStyle = "rgba(96,120,160,0.5)"; ctx.lineWidth = 1.6;
  rr(bw / 2 - 9, -14, 18, 20, 4); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.62)";
  rr(0, 0, bw, bh, 13); ctx.fill();

  const lv = j.units / JAR_UNITS;
  if (lv > 0) {
    ctx.save();
    rr(2, 2, bw - 4, bh - 4, 11); ctx.clip();
    // ⚠ **Mặt nước phải NẰM NGANG so với màn hình, không nghiêng theo bình.** Vẽ
    // trong hệ toạ độ của bình thì khi bình nghiêng, mặt nước nghiêng theo — và
    // trong một cái bình trong suốt thì đó là thứ mắt bắt ngay: nước dán vào thành
    // bình. Ở 46° nó tệ đến mức bình trông như rỗng. Nên: cắt theo thân bình (đang
    // nghiêng), rồi xoay ngược lại đúng ngần ấy trước khi đổ nước.
    const a2 = j.tilt * TILT_MAX;
    ctx.translate(bw / 2, bh / 2);
    ctx.rotate(-a2);
    // Nghiêng thì mực nước dâng lên phía miệng — thể tích không đổi nhưng mặt cắt
    // hẹp lại. Xấp xỉ tuyến tính theo sin là đủ ở kích thước này.
    const top = bh / 2 - lv * (bh - 8) * (1 - 0.28 * Math.sin(a2));
    const g = ctx.createLinearGradient(0, top, 0, bh);
    g.addColorStop(0, p.light); g.addColorStop(0.4, p.base); g.addColorStop(1, p.dark);
    ctx.fillStyle = g;
    ctx.beginPath();
    waterTop(-bw, bw * 3, top, 2.2, j.cx * 0.05 + performance.now() * 0.004);
    ctx.lineTo(bw * 2, bh * 2); ctx.lineTo(-bw, bh * 2); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  ctx.strokeStyle = "rgba(88,112,155,0.6)"; ctx.lineWidth = 2;
  rr(0, 0, bw, bh, 13); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  rr(7, 9, 5, bh - 22, 2.5); ctx.fill();
  ctx.restore();
}

/**
 * Dòng nước liền từ miệng bình xuống mặt bồn.
 *
 * ⚠ **Liền, không phải chuỗi giọt.** Ở nhịp 150ms/đơn vị thì các giọt rời nhau cả
 * gang tay, và cú rót đọc thành nhỏ giọt chứ không thành rót. Giọt vẫn còn, nhưng
 * để làm hạt bắn TRÊN dòng, chứ không phải để làm chính cái dòng.
 */
function drawPourStream(j) {
  if (!j.pouring || j.tilt < 0.4 || j.units <= 0) return;
  const p = PAL[j.color];
  const m = mouthOf(j);
  const yEnd = TANK.y + 6;
  const midY = m.y + (yEnd - m.y) * 0.45;
  // ⚠ Hai mép của dòng phải là hai đường RIÊNG, cùng độ cong, lệch nhau đúng bề
  // rộng. Bản đầu dùng chung một điểm điều khiển cho cả hai mép, nên chúng bị kéo
  // dính vào nhau ở quãng giữa — trên một quãng rơi 250px thì cái dòng teo lại
  // thành sợi dây, và cú rót đọc thành sợi chỉ treo từ bình xuống.
  const xEnd = m.x + 10, cx = m.x + 6, wTop = 9, wBot = 6.5;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(m.x - wTop / 2, m.y);
  ctx.quadraticCurveTo(cx - wTop / 2, midY, xEnd - wBot / 2, yEnd);
  ctx.lineTo(xEnd + wBot / 2, yEnd);
  ctx.quadraticCurveTo(cx + wTop / 2, midY, m.x + wTop / 2, m.y);
  ctx.closePath();
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = p.base;
  ctx.fill();
  // Gân sáng chạy dọc dòng, lệch về mép được chiếu sáng.
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = p.light;
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(m.x - 1.5, m.y);
  ctx.quadraticCurveTo(cx - 1.5, midY, xEnd - 1.5, yEnd);
  ctx.stroke();
  // Chỗ dòng chạm mặt bồn.
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = p.light;
  ctx.beginPath();
  ctx.ellipse(xEnd, yEnd + 2, 11, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawTank() {
  const x = TANK.x, y = TANK.y, w = TANK.w, h = TANK.h;
  const unit = h / TANK_CAP;

  ctx.fillStyle = "rgba(10,26,48,0.55)";
  rr(x, y, w, h, 18); ctx.fill();

  ctx.save();
  rr(x + 3, y + 3, w - 6, h - 6, 15); ctx.clip();

  // Các lớp, từ đáy lên. `cursor` là mặt trên của lớp vừa vẽ.
  let cursor = y + h - 3;
  for (let i = 0; i < tank.layers.length; i++) {
    const L = tank.layers[i];
    const p = PAL[L.color];
    const top = cursor - L.units * unit;
    const isTop = i === tank.layers.length - 1;
    const g = ctx.createLinearGradient(0, top, 0, cursor);
    g.addColorStop(0, p.light); g.addColorStop(0.35, p.base); g.addColorStop(1, p.dark);
    ctx.fillStyle = g;
    ctx.beginPath();
    if (isTop) waterTop(x, w, top, 3.4 * tank.wob + 1, tank.wobPhase);
    else { ctx.moveTo(x, top); ctx.lineTo(x + w, top); }
    ctx.lineTo(x + w, cursor + 1); ctx.lineTo(x, cursor + 1); ctx.closePath();
    ctx.fill();
    // Vạch sáng ở ranh giới: chỗ duy nhất nói cho người chơi biết thứ tự.
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.fillRect(x, top - 1, w, isTop ? 0 : 2);
    cursor = top;
  }

  // Vùng nguy hiểm: 5 đơn vị cuối. Vẽ ĐÈ lên nước để nó vẫn đỏ khi bị ngập.
  ctx.fillStyle = "rgba(255,60,60,0.16)";
  ctx.fillRect(x, y + 3, w, unit * 5);
  ctx.restore();

  ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2.5;
  rr(x, y, w, h, 18); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.22)";
  rr(x + 10, y + 12, 9, h - 30, 4.5); ctx.fill();

  for (let i = 0; i < COLS; i++) {
    ctx.fillStyle = "rgba(210,230,255,0.7)";
    rr(spoutX(i) - 11, y + h - 4, 22, 16, 5); ctx.fill();
    ctx.fillStyle = "rgba(20,40,70,0.5)";
    rr(spoutX(i) - 6, y + h + 6, 12, 8, 3); ctx.fill();
  }

  ctx.fillStyle = stalledFor > 400 ? "#ff9a9a" : "rgba(210,232,255,0.85)";
  ctx.font = "700 20px system-ui, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(tank.total + " / " + TANK_CAP, x + 6, y - 12);
  // ⚠ Nhỏ hơn và canh phải, vì nó dùng chung một dòng với số đếm. Ở 20px câu này
  // dài hơn nửa bề ngang bồn và đè thẳng lên con số — chính là thứ đang cần đọc khi
  // nó hiện ra.
  if (stalledFor > 400 && phase === "play") {
    ctx.font = "700 14px system-ui, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText("TẮC — không màu nào khớp máng đang mở", x + w - 6, y - 12);
  }
}

function drawTroughs() {
  for (let i = 0; i < COLS; i++) {
    for (let k = 0; k < cols[i].length; k++) {
      const t = cols[i][k];
      const x = trX(i), y = TR.y0 + k * (TR.h + TR.vgap);
      const p = PAL[t.color];
      const open = k === 0;

      ctx.globalAlpha = open ? 1 : 0.42;
      ctx.fillStyle = "rgba(10,26,48,0.5)";
      rr(x, y, TR.w, TR.h, 9); ctx.fill();

      if (open && t.filled > 0) {
        ctx.save();
        rr(x + 3, y + 3, TR.w - 6, TR.h - 6, 7); ctx.clip();
        const top = y + TR.h - 3 - (t.filled / TROUGH_CAP) * (TR.h - 6);
        const g = ctx.createLinearGradient(0, top, 0, y + TR.h);
        g.addColorStop(0, p.light); g.addColorStop(0.4, p.base); g.addColorStop(1, p.dark);
        ctx.fillStyle = g;
        ctx.beginPath();
        waterTop(x, TR.w, top, 1.6, performance.now() * 0.005 + i);
        ctx.lineTo(x + TR.w, y + TR.h); ctx.lineTo(x, y + TR.h); ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Vành máng mang màu nó nhận — máng rỗng thì đó là thứ duy nhất nói màu gì.
      ctx.fillStyle = p.base;
      rr(x + 3, y + 2, TR.w - 6, 6, 3); ctx.fill();
      ctx.strokeStyle = open ? "rgba(255,255,255,0.6)" : "rgba(255,255,255,0.25)";
      ctx.lineWidth = 2;
      rr(x, y, TR.w, TR.h, 9); ctx.stroke();

      if (open) {
        ctx.fillStyle = "rgba(255,255,255,0.92)";
        ctx.font = "700 14px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(t.filled + "/" + TROUGH_CAP, x + TR.w / 2, y + TR.h - 8);
      }
      ctx.globalAlpha = 1;
    }
  }
  for (const f of flashes) {
    ctx.fillStyle = "rgba(255,255,255," + f.t * 0.85 + ")";
    rr(trX(f.col), TR.y0, TR.w, TR.h, 9); ctx.fill();
  }
}

function drawDrops() {
  for (const s of streams) {
    const p = PAL[s.color];
    const y = s.y0 + (TANK.y + 8 - s.y0) * s.t * s.t;
    ctx.globalAlpha = 0.55 * (1 - s.t);
    ctx.fillStyle = p.light;
    ctx.beginPath();
    ctx.ellipse(s.x0 + 14 + s.t * 6, y, 2.4, 3.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (const d of drops) {
    const p = PAL[d.color];
    const y = d.y + (TR.y0 + 8 - d.y) * d.t * d.t;
    ctx.fillStyle = p.base;
    ctx.beginPath();
    ctx.ellipse(d.x, y, 4.5, 8, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function draw() {
  ctx.save();
  if (shake > 0.01) ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#0d1c33"); bg.addColorStop(1, "#1b3a63");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "rgba(220,238,255,0.9)";
  ctx.font = "700 26px system-ui, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("AquaSort", 30, 42);
  ctx.font = "600 14px system-ui, sans-serif";
  ctx.fillStyle = "rgba(180,205,235,0.75)";
  ctx.fillText("chạm bình để rót — máng mở tự hút màu của nó khỏi bồn", 30, 64);

  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.fillText(DEMO ? "demo — thắng " + tally.win + " / thua " + tally.lose : "R = bàn mới", W - 30, 42);

  drawCavity();
  for (const j of jars) drawJar(j);
  for (const j of jars) drawPourStream(j);
  drawTank();
  drawTroughs();
  drawDrops();

  if (phase !== "play") {
    ctx.fillStyle = "rgba(6,14,28,0.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = phase === "win" ? "#7fe0a0" : "#ff8f8f";
    ctx.font = "700 52px system-ui, sans-serif";
    ctx.fillText(msg, W / 2, H / 2 - 10);
    ctx.fillStyle = "rgba(230,242,255,0.8)";
    ctx.font = "600 20px system-ui, sans-serif";
    ctx.fillText("chạm để chơi bàn mới", W / 2, H / 2 + 34);
  }
  ctx.restore();
}

// ── Bot ──────────────────────────────────────────────────────────────────────
//
// `?demo` cho nó tự chơi. Không phải để khoe — đây là cách duy nhất kiểm tra được
// luật có chạy tới thắng hay không, vì một bàn chỉ tắc sau chục nước rót và ngồi
// bấm tay thì không lặp lại được cùng một ván. `?fast` rút nhịp xuống để soi vài
// chục bàn liên tiếp; nó không đụng tới luật.
//
// ⚠ **Bot này ĐƠN GIẢN HƠN bản trước, và đó là một phép đo chứ không phải lười.**
// Hồi bồn chỉ rút được lớp đáy, bot phải đếm "chỗ trống của màu này trừ đi phần nước
// màu này đã nằm trong bồn" — tức "marbles already spoken for" trong
// scripts/bots.mjs — vì rót thừa một màu là chẹn đáy vĩnh viễn. Giờ nước thừa chỉ
// nằm chờ máng sau mở, nên toàn bộ phép đếm đó không còn cần thiết: rót thừa chỉ tốn
// CHỖ, không còn giết ván.
//
// Cái mất theo là độ khó. Với luật này, thứ duy nhất người chơi phải cân là 30 đơn
// vị sức chứa — đúng bằng thứ duy nhất người chơi phải cân trên ray cũ.
const Q = new URLSearchParams(location.search);
const DEMO = Q.has("demo");
if (Q.has("fast")) DRAIN_MS = 26;
const BOT_GAP = Q.has("fast") ? 120 : 420;
let botAt = 0;
let tally = { win: 0, lose: 0 };
let overAt = 0;

function bot(now) {
  if (DEMO && phase !== "play") {
    if (!overAt) overAt = now;
    else if (now - overAt > 700) { tally[phase === "win" ? "win" : "lose"]++; overAt = 0; newBoard(); }
    return;
  }
  if (!DEMO || phase !== "play" || now - botAt < BOT_GAP) return;
  if (jars.some((j) => j.pouring)) return;
  if (tank.total + JAR_UNITS > TANK_CAP) return;

  // Ưu tiên màu đang có máng mở — nước đó chảy đi ngay nên không chiếm chỗ lâu.
  // Không có thì rót đại một bình bất kỳ: bồn còn chỗ, và nước nằm chờ được.
  const open = new Set();
  for (let i = 0; i < COLS; i++) { const a = active(i); if (a) open.add(a.color); }
  const left = jars.filter((j) => !j.gone);
  const pick = left.find((j) => open.has(j.color)) ?? left[0];
  if (pick) { botAt = now; tapJar(pick); }
}

// ── Input + fit ──────────────────────────────────────────────────────────────
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio;
  cv.style.width = W * s + "px"; cv.style.height = H * s + "px";
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener("resize", fit);

cv.addEventListener("pointerdown", (e) => {
  if (phase !== "play") { newBoard(); return; }
  const r = cv.getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width) * W;
  const y = ((e.clientY - r.top) / r.height) * H;
  for (const j of jars) {
    if (!j.gone && Math.abs(x - j.cx) < 40 && Math.abs(y - j.cy) < 42) { tapJar(j); return; }
  }
});
window.addEventListener("keydown", (e) => { if (e.key === "r" || e.key === "R") newBoard(); });

newBoard();
fit();
requestAnimationFrame(function frame(now) {
  const dt = Math.min(50, now - (last || now));
  last = now;
  bot(now);
  step(now, dt);
  draw();
  requestAnimationFrame(frame);
});
    </script>
  </body>
